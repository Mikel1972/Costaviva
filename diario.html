<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--f-texto); background: var(--fondo); color: var(--tinta);
    display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  header { padding: max(10px, env(safe-area-inset-top)) 20px 10px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
  header .titulos { flex: 1; min-width: 0; }
  header h1 { font-size: 20px; margin: 0; }
  @media (max-width: 420px) { header { padding-left: 14px; padding-right: 14px; gap: 10px; } header h1 { font-size: 16px; } }
  header p { margin: 2px 0 0; font-size: 11px; }


  .contenido { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }

  .cabecera-mes { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
  .cabecera-mes button {
    background: var(--superficie-2); border: 1px solid var(--linea); color: var(--tinta); border-radius: 8px;
    width: 32px; height: 32px; font-size: 16px; cursor: pointer;
  }
  .cabecera-mes .mes-nombre { font-family: var(--f-titulo); font-size: 17px; text-transform: capitalize; }

  .calendario { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 480px; margin: 0 auto; }
  .dia-semana { text-align: center; font-family: var(--f-texto); font-size: 10px; color: var(--tinta-3); padding-bottom: 4px; }
  .dia {
    aspect-ratio: 1; border-radius: 8px; background: var(--superficie); border: 1px solid var(--linea);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--f-texto); font-size: 13px; color: var(--tinta-2); cursor: pointer; position: relative;
  }
  .dia.vacio { visibility: hidden; cursor: default; }
  .dia.hoy { border-color: var(--acento); }
  .dia.rojo { background: var(--peligro-fondo); border-color: var(--peligro); color: var(--peligro-texto); }
  .dia.verde { background: var(--ok-fondo); border-color: var(--ok); color: var(--ok-texto); }
  .dia:active { transform: scale(0.94); }

  .leyenda-dias { display: flex; justify-content: center; gap: 18px; margin-top: 14px; font-size: 11px; color: var(--tinta-2); }
  .leyenda-dias span { display: inline-flex; align-items: center; gap: 5px; }
  .chip { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .aviso-consentimiento {
    max-width: 480px; margin: 0 auto 16px; background: var(--superficie); border: 1px solid var(--linea); border-radius: 10px;
    padding: 12px 14px; font-size: 12px; color: var(--tinta-2); line-height: 1.5;
  }
  .aviso-consentimiento a { color: var(--acento); }

  /* Panel de detalle del día — hoja deslizante desde abajo, igual patrón que index.html */
  /* Entre la cabecera y el menú inferior, nunca debajo de ninguno de los dos
     (2026-10-09, captura de Mikel en el iPhone: con bottom: 54px y 78vh la
     hoja tapaba la cabecera por arriba y quedaba 52 px bajo el menú, que
     mide 72 px + la franja del indicador de inicio). --cabecera-abajo lo
     pone el script con lo que mide de verdad la cabecera. */
  /* --menu-alto lo mide el script (alto real del menú inferior en este
     móvil); el calc es solo el valor de reserva. */
  .panel-dia {
    display: none; position: fixed; left: 0; right: 0; bottom: var(--menu-alto, calc(72px + env(safe-area-inset-bottom)));
    max-height: min(78dvh, calc(100dvh - var(--cabecera-abajo, 0px) - var(--menu-alto, calc(72px + env(safe-area-inset-bottom))) - 8px));
    background: var(--superficie); border-top: 1px solid var(--linea); border-radius: 16px 16px 0 0;
    padding: 20px; overflow-y: auto; z-index: 1000; box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
  }
  .panel-dia.visible { display: block; }
  /* Solo la primera letra en mayúscula ("Jueves, 8 de octubre de 2026"). */
  .panel-dia h2 { font-family: var(--f-titulo); font-size: 19px; margin: 0 0 12px; }
  .panel-dia h2::first-letter { text-transform: uppercase; }
  /* "➕ Añadir entrada" siempre a la vista, pegado al pie de la hoja aunque
     el día tenga mucho contenido (2026-10-09, Mikel: "se sigue sin ver lo
     de +añadir entrada"). Mientras hay un formulario abierto sobra. */
  #btnAnadirEntrada {
    position: sticky; bottom: -20px; z-index: 2; display: block; width: calc(100% + 40px);
    margin: 12px -20px -20px; padding: 14px 20px; border-radius: 0; border: none; border-top: 1px solid var(--linea);
    background: var(--superficie); box-shadow: 0 -6px 14px rgba(0,0,0,0.12);
  }
  #zonaFormulario:not(:empty) ~ #btnAnadirEntrada { display: none; }
  .panel-dia .cerrar { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--tinta-2); font-size: 16px; cursor: pointer; }

  label { display: block; font-size: 12px; color: var(--tinta-2); margin: 12px 0 5px; font-family: var(--f-texto); font-weight: 500; }
  input, select, textarea {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--linea); background: var(--superficie-2);
    color: var(--tinta); font-family: var(--f-texto); font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acento); }
  button.principal {
    width: 100%; margin-top: 16px; padding: 11px; border-radius: 8px; border: none;
    background: var(--degradado-fuerte); color: var(--sobre-acento); font-weight: 800; font-size: 14px; cursor: pointer;
  }
  button.principal:disabled { opacity: 0.6; }
  button.secundario {
    width: 100%; margin-top: 8px; padding: 10px; border-radius: 8px; border: 1px solid var(--linea);
    background: transparent; color: var(--tinta-2); font-size: 13px; cursor: pointer;
  }

  .tarjeta-captura { background: var(--superficie-2); border-radius: 10px; padding: 12px; margin-top: 10px; }
  .tarjeta-captura .fila-titulo { display: flex; justify-content: space-between; align-items: baseline; }
  .tarjeta-captura .especie { font-weight: 600; font-size: 14px; }
  .tarjeta-captura .especie .cientifico { display: block; font-weight: 400; font-size: 12px; color: var(--tinta-2); margin-left: 1.4em; }
  .tarjeta-captura .detalle { font-size: 12px; color: var(--tinta-2); margin-top: 2px; }
  .galeria-fotos { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
  .galeria-fotos img { width: 76px; height: 76px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .tarjeta-captura button.borrar-captura {
    background: none; border: none; color: var(--peligro); font-size: 11px; cursor: pointer; margin-top: 6px; padding: 0;
  }

  .contexto-ambiental { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 4px; }
  .contexto-ambiental .dato { background: var(--superficie-2); border-radius: 8px; padding: 8px; text-align: center; }
  .contexto-ambiental .dato .etq { font-size: 9px; color: var(--tinta-3); }
  .contexto-ambiental .dato .val { font-family: var(--f-texto); font-size: 13px; margin-top: 2px; }
  .nota-ficha { font-size: 11px; color: var(--tinta-3); margin-top: 4px; }
  .nota-plegada summary { cursor: pointer; width: fit-content; }
  .nota-plegada[open] summary { margin-bottom: 2px; }
  .atribucion-meteo { margin-top: 6px; font-size: 10.5px; line-height: 1.4; color: var(--tinta-3); }
  .atribucion-meteo a { color: inherit; text-decoration: underline; }

  .mensaje { margin-top: 10px; font-size: 12px; padding: 8px 10px; border-radius: 8px; display: none; }
  .mensaje.error { display: block; background: var(--peligro-fondo); color: var(--peligro-texto); border: 1px solid var(--peligro-borde); }
  .mensaje.ok { display: block; background: var(--ok-fondo); color: var(--ok-texto); border: 1px solid var(--ok-borde); }
  .mensaje.info { display: block; background: var(--aviso-fondo); color: var(--aviso-texto); border: 1px solid var(--aviso-borde); }

  /* Modal "¿cómo quieres añadir la foto?" — identificación de captura
     por IA (2026-09-13). Overlay simple centrado, no una hoja deslizante
     como .panel-dia (esto es una elección puntual de dos botones, no un
     formulario). */
  .modal-elegir-foto {
    display: none; position: fixed; inset: 0; background: rgba(11,30,63,0.75); z-index: 1500;
    align-items: center; justify-content: center; padding: 24px;
  }
  .modal-elegir-foto.visible { display: flex; }
  .modal-elegir-foto .caja {
    background: var(--superficie); border: 1px solid var(--linea); border-radius: 14px; padding: 20px; width: 100%; max-width: 320px;
  }
  .modal-elegir-foto .titulo { font-family: var(--f-titulo); font-size: 16px; margin-bottom: 14px; text-align: center; }
  .modal-elegir-foto button {
    width: 100%; margin-top: 8px; padding: 12px; border-radius: 8px; border: 1px solid var(--linea);
    background: var(--superficie-2); color: var(--tinta); font-size: 14px; cursor: pointer; text-align: left;
  }
  .modal-elegir-foto button:first-of-type { margin-top: 0; }
  .modal-elegir-foto button.cancelar { background: transparent; color: var(--tinta-2); text-align: center; }

  /* Selector de hora: dos <select> nativos (hora, minuto) — el propio
     desplegable del navegador ya trae scroll cuando tiene muchas
     opciones, así que es la forma más simple y fiable de tener "un
     desplegable con scroll" sin reinventar el control. Sustituye tanto
     a <input type="time"> como a un primer intento con una rueda de
     scroll/snap a medida, que en la práctica no se veía bien en todos
     los navegadores. Primera opción siempre "--" (sin especificar) —
     todas las horas de la app son opcionales.
  */
  .hora-select { display: flex; align-items: center; gap: 6px; margin: 4px 0 10px; }
  .hora-select select {
    width: auto; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--linea);
    background: var(--superficie-2); color: var(--tinta); font-family: var(--f-texto); font-size: 14px;
  }
  .hora-select-sep { font-family: var(--f-titulo); font-size: 16px; color: var(--tinta-2); }

</style>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { cargarCompartidas, htmlCasillaCompartir, htmlEtiquetaCompartida, sincronizarCompartida } from "/assets/js/compartir-captura.js";
// Índice de pesca v2 y condiciones por fecha de la salida (2026-10-08).

import * as CondSalida from "/assets/js/condiciones-salida.js";
import * as Regiones from "/assets/js/regiones.js";

const SUPABASE_URL = "https://imncbmizxkorotpeisic.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltbmNibWl6eGtvcm90cGVpc2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzczMTQsImV4cCI6MjEwNDUxMzMxNH0.QYvtoHQyFRo1SploGPCUyWZqeHNwy6Qdd6IsAbmvHnc";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Punto verde de "hay novedades" en la pestaña Grupos del menú inferior
// (pedido explícito del usuario, 2026-09-15) — se comprueba una vez al
// cargar la página. Un fallo aquí nunca debe romper nada más.
async function comprobarNovedadesGrupos(cliente) {
  try {
    const { data: hay, error } = await cliente.rpc("hay_novedades_grupos");
    if (!error && hay) document.getElementById("puntoNovedadesGrupos")?.removeAttribute("hidden");
  } catch (e) {}
}

const { data: sesionInicial } = await supabase.auth.getSession();
if (!sesionInicial.session) {
  window.location.href = "/login.html";
  throw new Error("sin sesión");
}
const usuario = sesionInicial.session.user;

// Analítica de uso propia (2026-09-17, ver index.html para el detalle) —
// nunca bloquea la interacción si falla.
async function registrarEvento(tipo, detalle) {
  try {
    await supabase.from("eventos_uso").insert({ user_id: usuario.id, tipo, detalle: detalle ?? null });
  } catch (e) { /* nunca debe romper la interacción del usuario */ }
}

// Paywall (2026-09-15, pedido explícito del usuario): 7 días de prueba
// desde el alta, luego bloqueo total sin suscripción activa —
// mi_estado_suscripcion() ya resuelve el bypass del admin en el
// servidor. Fallo silencioso a propósito si la RPC falla (red, error
// devuelto, o una excepción real) — try/catch explícito porque un
// throw sin capturar aquí dejaría "Comprobando acceso…" colgado.
try {
  const { data: estadoSuscripcion, error: errorSuscripcion } = await supabase.rpc("mi_estado_suscripcion");
  if (!errorSuscripcion && estadoSuscripcion && estadoSuscripcion.con_acceso === false) {
    window.location.href = "/suscripcion.html";
    throw new Error("sin suscripción activa");
  }
} catch (e) {
  if (e.message === "sin suscripción activa") throw e;
  console.error("mi_estado_suscripcion falló, se deja pasar:", e);
}

window.quitarPantallaInicio();
// Dónde acaba la cabecera, para que la hoja del día no la tape (.panel-dia).
{
  const cab = document.querySelector("header");
  const medir = () => document.documentElement.style.setProperty("--cabecera-abajo", `${Math.ceil(cab.getBoundingClientRect().bottom)}px`);
  medir();
  if (window.ResizeObserver) new ResizeObserver(medir).observe(cab);
  window.addEventListener("resize", medir);
  // Y cuánto mide de verdad el menú inferior, para que la hoja acabe justo
  // encima (en el iPhone la franja del indicador cambia según el modo).
  const menu = document.querySelector(".tabs-nav");

function fechaISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function cargarDatos() {
  const { data: salidas, error: errSalidas } = await supabase
    .from("salidas_pesca")
    .select("*")
    .order("fecha", { ascending: false });
  if (errSalidas) { console.error(errSalidas); return; }

  const idsSalidas = salidas.map((s) => s.id);
  let capturasPorSalida = {};
  if (idsSalidas.length) {
    const { data: capturas, error: errCapturas } = await supabase
      .from("capturas")
      .select("*")
      .in("salida_id", idsSalidas)
      .order("creado_en", { ascending: true });
    if (errCapturas) console.error(errCapturas);
    (capturas || []).forEach((c) => {
      (capturasPorSalida[c.salida_id] = capturasPorSalida[c.salida_id] || []).push(c);
    });
  }
  // "Comparte tu captura" (assets/js/compartir-captura.js).
  compartidas = await cargarCompartidas(supabase);

  // Varias entradas por día (pedido explícito del usuario: puede pescar
  // en varios spots el mismo día, o ir en barco por la mañana y de
  // costa por la tarde) — cada fecha guarda una LISTA de entradas, no
  // una sola. `salidas` ya viene ordenado por fecha desc; se mantiene
  // ese orden relativo dentro de cada día (más reciente primero según
  // se creó, gracias al orden de inserción del array).
  salidasPorFecha = {};
  salidas.forEach((s) => {
    (salidasPorFecha[s.fecha] = salidasPorFecha[s.fecha] || []).push({ salida: s, capturas: capturasPorSalida[s.id] || [] });
  });
}

function renderCalendario() {
  document.getElementById("nombreMes").textContent = `${MESES[cursor.getMonth()]} ${cursor.getFullYear()}`;
  const cont = document.getElementById("calendario");
  cont.innerHTML = "";
  DIAS_SEMANA.forEach((d) => {
    const el = document.createElement("div");
    el.className = "dia-semana";
    el.textContent = d;
    cont.appendChild(el);
  });

  const primerDia = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const ultimoDia = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
  const huecoInicial = (primerDia.getDay() + 6) % 7; // lunes = 0

  for (let i = 0; i < huecoInicial; i++) {
    const el = document.createElement("div");
    el.className = "dia vacio";
    cont.appendChild(el);
  }

  const hoyISO = fechaISO(new Date());
  for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
    const fecha = new Date(cursor.getFullYear(), cursor.getMonth(), dia);
    const iso = fechaISO(fecha);
    const el = document.createElement("div");
    el.className = "dia";
    if (iso === hoyISO) el.classList.add("hoy");
    const entradas = salidasPorFecha[iso];
    if (entradas && entradas.length) {
      el.classList.add(entradas.some((e) => e.capturas.length) ? "verde" : "rojo");
    }
    el.textContent = String(dia);
    el.addEventListener("click", () => abrirDia(iso, fecha));
    cont.appendChild(el);
  }
}

async function redimensionarImagen(file, maxAncho = 1600, calidad = 0.8) {
  const bitmap = await createImageBitmap(file);
  const escala = Math.min(1, maxAncho / bitmap.width);
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * escala);
  canvas.height = Math.round(bitmap.height * escala);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", calidad));
}

// Copia más pequeña SOLO para mandarla a identificar (2026-10-08, pedido de
// Mikel para bajar el coste de la IA): 1000 px en el lado más largo. La
// foto que se guarda con la captura sigue saliendo de redimensionarImagen()
// a 1600 px, sin cambios. Los tokens de una imagen crecen con sus píxeles y
// para reconocer la especie sobra con esto.
async function redimensionarParaIdentificar(file, ladoMax = 1000, calidad = 0.8) {
  const bitmap = await createImageBitmap(file);
  const escala = Math.min(1, ladoMax / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * escala);
  canvas.height = Math.round(bitmap.height * escala);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", calidad));
}

// Selector de hora: dos <select> nativos (hora, minuto) — sustituye a
// <input type="time"> (su desplegable nativo, en algunos navegadores/
// móviles, solo deja ver unas pocas horas a la vez) y a un primer
// intento con una rueda de scroll/snap hecha a mano, que en la práctica
// no se veía igual en todos los navegadores. El propio <select> del
// navegador ya trae scroll cuando tiene muchas opciones, así que es la
// forma más simple y fiable de tener "un desplegable con scroll".
// valorInicial null/undefined -> empieza sin nada elegido ("--" en
// ambos) — todas las horas de la app son opcionales: quien va en una
// embarcación moviéndose puede querer registrar una captura de un
// momento concreto sin rellenar nada más, o solo la hora de inicio sin
// la de fin si es una salida puntual.
function crearSelectorHora(idContenedor, valorInicial) {
  const cont = document.getElementById(idContenedor);
  const horas = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
  const minutos = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, "0"));
  const [hIni, mIni] = (valorInicial || "").split(":");

  const opciones = (valores, actual) =>
    `<option value="">--</option>` +
    valores.map((v) => `<option value="${v}" ${v === actual ? "selected" : ""}>${v}</option>`).join("");
  cont.innerHTML = `
    <select class="hora-select-h">${opciones(horas, hIni)}</select>
    <span class="hora-select-sep">:</span>
    <select class="hora-select-m">${opciones(minutos, mIni)}</select>
  `;
  const selH = cont.querySelector(".hora-select-h");
  const selM = cont.querySelector(".hora-select-m");

  return {
    valor() {
      if (!selH.value || !selM.value) return null;
      return `${selH.value}:${selM.value}`;
    },
  };
}

// Coeficiente de marea por spot (2026-09-13, ver el comentario largo en
// functions/prevision.js): el índice "nacional" por fase lunar (más
// abajo, coeficienteMarea) resultó ser el MISMO número en toda España y
// Portugal (verificado contra tides4fishing.com en 6 puertos distintos)
// — no aporta nada específico de cada spot. Este calcula uno real, a
// partir del propio rango de marea (pleamar menos bajamar) que
// Open-Meteo modela para ESE punto, normalizado contra el mínimo y
// máximo rango de ese mismo spot en una ventana de ~17 días alrededor
// de la fecha (cubre un ciclo vivas-muertas completo, ~14.77 días).
// Misma función que coeficientePorSpot() en functions/prevision.js,
// duplicada aquí porque no hay bundling entre archivos.
// Regla fija tras el bug real del 2026-09-13 (ver CLAUDE.md): Open-Meteo
// devuelve el array horario completo para toda la ventana pedida, pero
// el horizonte real de previsión de sea_level_height_msl es más corto —
// a partir de ~9 días vista, el día trae 1-2 horas válidas (el resto
// null), y eso basta para dar un rango de marea (max-min) falsamente
// pequeño que descoloca el rangoMin/rangoMax de TODA la ventana, no solo
// el de ese día. Cualquier copia de esta función (aquí y en
// functions/prevision.js) debe exigir este mínimo antes de dejar entrar
// un día en la normalización — nunca calcular con un día a medias.
const HORAS_MINIMAS_POR_DIA = 20;
function coeficientePorSpot(horas, alturas, idxReferencia) {
  const rangosPorDia = {};
  horas.forEach((h, i) => {
    const v = alturas[i];
    if (v === null || v === undefined) return;
    const dia = h.slice(0, 10);
    if (!rangosPorDia[dia]) rangosPorDia[dia] = { min: v, max: v, horas: 1 };
    else {
      rangosPorDia[dia].min = Math.min(rangosPorDia[dia].min, v);
      rangosPorDia[dia].max = Math.max(rangosPorDia[dia].max, v);
      rangosPorDia[dia].horas++;
    }
  });
  const dias = Object.keys(rangosPorDia).filter((d) => rangosPorDia[d].horas >= HORAS_MINIMAS_POR_DIA);
  if (dias.length < 10) return null;
  const rangos = dias.map((d) => rangosPorDia[d].max - rangosPorDia[d].min);
  const rangoMin = Math.min(...rangos);
  const rangoMax = Math.max(...rangos);
  if (rangoMax - rangoMin < 0.01) return null;
  const diaRef = horas[idxReferencia]?.slice(0, 10);
  const datosRef = rangosPorDia[diaRef];
  if (!datosRef || datosRef.horas < HORAS_MINIMAS_POR_DIA) return null;
  const rangoRef = datosRef.max - datosRef.min;
  const factor = Math.max(0, Math.min(1, (rangoRef - rangoMin) / (rangoMax - rangoMin)));
  return Math.round(20 + 100 * factor);
}

// Respaldo si la ventana amplia no trae datos suficientes (fallo puntual
// de Open-Meteo, spot casi sin marea, etc.) — aproximación astronómica
// por fase lunar, escala 20-120. No es un dato oficial de un servicio
// hidrográfico.
const RETRASO_MAREA_DIAS = 2;
const SINODICO_DIAS = 29.530588853;
const JD_LUNA_NUEVA_REF = 2451550.1; // 2000-01-06 18:14 UTC, luna nueva de referencia (J2000)
function coeficienteMarea(fecha) {
  const jd = fecha.getTime() / 86400000 + 2440587.5 - RETRASO_MAREA_DIAS;
  const edadDias = (((jd - JD_LUNA_NUEVA_REF) % SINODICO_DIAS) + SINODICO_DIAS) % SINODICO_DIAS;
  const fase = edadDias / SINODICO_DIAS;
  const factorVivas = Math.abs(Math.cos(2 * Math.PI * fase));
  return Math.round(45 + 75 * factorVivas);
}

// Busca, desde `desde` (sin incluirlo) hacia `hasta` (con paso ±1), el
// primer índice donde la serie de altura de marea cambia de dirección —
// un pico (pleamar) si venía subiendo, un valle (bajamar) si venía
// bajando. Necesita el punto anterior Y el siguiente a cada candidato
// para saber si de verdad es un giro, así que nunca comprueba los dos
// extremos de la serie.
function buscarGiroDeMarea(serie, desde, hasta, paso) {
  // Bug real encontrado 2026-09-19 backfilleando entradas existentes: con
  // "<"/">" (límite excluido) un giro que cae justo EN `hasta` (ej. la
  // bajamar exacta en la hora de fin de la salida) nunca se detectaba —
  // se colaba a la búsqueda "fuera del intervalo" y devolvía un pico
  // irrelevante de mucho antes de la sesión. "<="/">=" incluye el propio
  // límite como candidato válido.
  for (let i = desde + paso; paso > 0 ? i <= hasta : i >= hasta; i += paso) {
    const antes = serie[i - paso], actual = serie[i], despues = serie[i + paso];
    if (antes == null || actual == null || despues == null) continue;
    const subiendoAntes = actual - antes;
    const subiendoDespues = despues - actual;
    if (subiendoAntes !== 0 && subiendoDespues !== 0 && (subiendoAntes > 0) !== (subiendoDespues > 0)) {
      return { idx: i, tipo: subiendoAntes > 0 ? "pleamar" : "bajamar" };
    }
  }
  return null;
}

// Pico de marea (pleamar/bajamar) relevante para TODA la salida, no uno
// suelto por hora (2026-09-19, pedido explícito del usuario). Prioriza
// un giro real DENTRO de [idxInicio, idxFin]; si no hay ninguno ahí
// (sesión corta durante una sola subida o bajada, sin llegar a girar),
// coge el giro más cercano por FUERA del intervalo — mirando hacia atrás
// desde el inicio y hacia delante desde el fin, el que esté a menos
// horas de distancia del intervalo gana.
function picoDeMareaEnIntervalo(serieAltura, horas, idxInicio, idxFin) {
  if (idxInicio == null || idxInicio < 0) return null;
  const lo = Math.min(idxInicio, idxFin ?? idxInicio);
  const hi = Math.max(idxInicio, idxFin ?? idxInicio);
  let giro = buscarGiroDeMarea(serieAltura, lo, hi, 1);
  if (!giro) {
    // Ventana de sobra: un ciclo de marea completo son ~12.4h, con margen
    // hasta 18h para no quedarse corto si idx cae justo tras un giro.
    const atras = buscarGiroDeMarea(serieAltura, lo, Math.max(0, lo - 18), -1);
    const delante = buscarGiroDeMarea(serieAltura, hi, Math.min(serieAltura.length - 1, hi + 18), 1);
    const distAtras = atras ? lo - atras.idx : Infinity;
    const distDelante = delante ? delante.idx - hi : Infinity;
    giro = distAtras <= distDelante ? atras : delante;
  }
  if (!giro || !horas[giro.idx]) return null;
  return { tipo: giro.tipo, hora: horas[giro.idx].slice(11, 16) };
}

// Corrección de oleaje en Gipuzkoa — copia del mismo criterio de
// functions/prevision.js (el repo duplica helpers a propósito, no hay build
// step para compartir código). Ver el comentario largo de allí para el
// porqué: 22 puntos de calibración contra la boya 1101 Pasaia II, los 22 con
// la altura calculada por debajo de la medida, media −28.2%; factor = la
// MEDIANA de los 22 (1.381), no la media, por un valor suelto de 1.98.
// Se decide por coordenadas para que valga igual en spots fijos y en
// ubicaciones personalizadas. Ondarroa queda fuera a propósito (es Bizkaia,
// y por ese lado la boya de referencia no muestra sesgo).
const CAJA_OLEAJE_GIPUZKOA = { latMin: 43.20, latMax: 43.50, lonMin: -2.40, lonMax: -1.70 };
const FACTOR_OLEAJE_GIPUZKOA = 1.38;
function factorOleaje(lat, lon) {
  const c = CAJA_OLEAJE_GIPUZKOA;
  const dentro = lat >= c.latMin && lat <= c.latMax && lon >= c.lonMin && lon <= c.lonMax;
  return dentro ? FACTOR_OLEAJE_GIPUZKOA : 1;
}

async function contextoAmbiental(lat, lon, horaElegida, tipoSalida, fecha, horaFinSalida) {
  // Condiciones de la FECHA Y HORA de la salida, nunca las de hoy (Fase 0 del
  // índice v2, 2026-10-08; ver assets/js/condiciones-salida.js). Historia:
  // el 2026-09-13 se pasó de forecast_days=1 a start_date=end_date=fecha,
  // pero quedaban cuatro fugas de "hoy" en una entrada retroactiva: sin hora
  // de inicio se usaba la hora de AHORA (y la serie de mar, de ±8 días, sí
  // la contiene: oleaje/temp. agua/marea de hoy), la boya de embarcación era
  // la de ahora mismo, la luna era la de hoy, y 23:40 caía en las 00 del
  // mismo día. Ahora: la hora sale siempre de la fecha de la salida
  // (mediodía si no hay hora, marcado como estimado), boya y /luna solo si
  // la salida es de hoy (si no, luna calculada para esa fecha), y una fecha
  // fuera del alcance de Open-Meteo (más de 90 días atrás o más de 15
  // adelante) deja las condiciones a null con condiciones_estado diciendo
  // por qué, en vez de pedir y guardar otra cosa.
  // La Marine API pide una ventana más ancha (±8 días alrededor de la fecha,
  // ~17 días — un ciclo vivas-muertas completo, ~14.77 días) para calcular
  // coeficientePorSpot(); la atmósfera, de 5 días antes al día siguiente
  // (tendencias y retardos de las reglas expertas del índice).
  const zona = Regiones.zonaPorCoordenadas(lat, lon);
  const hoy = horaActualISO(zona).slice(0, 10);
  const plan = CondSalida.planCondiciones(fecha, hoy);
  const fechaRef = fecha || hoy;
  const resultado = { marea_altura: null, marea_tendencia: null, marea_altura_fin: null, marea_tendencia_fin: null,
    marea_pico_tipo: null, marea_pico_hora: null,
    marea_coeficiente: null, presion_valor: null, presion_tendencia: null,
    luna_fase: null, luna_iluminacion: null, viento_kmh: null, viento_dir: null,
    oleaje_altura_min: null, oleaje_altura_max: null, temp_agua: null,
    nubosidad: null, precipitacion: null, boya_usada: null,
    condiciones_estado: plan.estado || "ok",
    indice_version: VentanaActividad.INDICE_VERSION, indice_puntuacion: null, indice_especie: null, indice_factores: null };

  // La luna y el coeficiente astronómico valen para cualquier fecha.
  const lunaLocal = CondSalida.lunaDeFecha(fechaRef, horaElegida || "12:00", zona);
  resultado.luna_fase = lunaLocal.fase;
  resultado.luna_iluminacion = lunaLocal.iluminacion;
  if (!plan.pedir) {
    resultado.marea_coeficiente = coeficienteMarea(new Date(fechaRef + "T12:00:00"));
    return resultado;
  }

  const v = CondSalida.ventanasConsulta(fechaRef, hoy);
  const coord = `latitude=${lat}&longitude=${lon}&${Regiones.paramZona(zona)}`;
  const RUMBOS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
  try {
    const [marino, viento, luna, datosEspecies] = await Promise.all([
      pedirMeteo("marine", `${coord}&start_date=${v.mar.inicio}&end_date=${v.mar.fin}&hourly=wave_height,sea_level_height_msl,sea_surface_temperature`),
      pedirMeteo("forecast", `${coord}&start_date=${v.atmosfera.inicio}&end_date=${v.atmosfera.fin}&hourly=windspeed_10m,winddirection_10m,pressure_msl,cloudcover,precipitation&windspeed_unit=kmh`),
      // /luna calcula siempre la de hoy: solo sirve para salidas de hoy.
      plan.modo === "hoy" || plan.modo === "sin_fecha"
        ? fetch(`/luna?lat=${lat}&lon=${lon}`).then((r) => r.json()).catch(() => null)
        : Promise.resolve(null),
      cargarEspeciesIndice().catch(() => null),
    ]);
    if (marino?.error || viento?.error) resultado.condiciones_estado = "parcial";
    const horas = marino.hourly?.time || [];
    const horasViento = viento.hourly?.time || [];
    const opcionesHora = { hoy, horaActual: horaActualISO(zona) };
    // Bug real encontrado por el usuario 2026-09-15: las dos series tienen
    // longitudes distintas; cada una busca su propio índice por fecha+hora.
    const { i: idx, estimada } = CondSalida.indiceHoraSalida(horas, fechaRef, horaElegida, opcionesHora);
    const { i: idxViento } = CondSalida.indiceHoraSalida(horasViento, fechaRef, horaElegida, opcionesHora);
    if (idx < 0 && idxViento < 0) resultado.condiciones_estado = "sin_dato_hora";

    if (idx >= 0) {
      const alturaCruda = marino.hourly?.wave_height?.[idx];
      const alturaOla =
        alturaCruda === undefined || alturaCruda === null ? alturaCruda : alturaCruda * factorOleaje(lat, lon);
      if (alturaOla !== undefined && alturaOla !== null) {
        resultado.oleaje_altura_min = +(alturaOla * 0.9).toFixed(1);
        resultado.oleaje_altura_max = +(alturaOla * 1.1).toFixed(1);
      }
      resultado.temp_agua = marino.hourly?.sea_surface_temperature?.[idx] ?? null;
    }
    // sea_level_height_msl es una anomalía respecto al nivel medio del mar
    // (puede salir negativa): se re-referencia contra el mínimo de la propia
    // ventana para mostrar la altura de forma intuitiva (siempre ≥ 0). Mismo
    // criterio que functions/prevision.js (calcularMarea).
    const serieAltura = marino.hourly?.sea_level_height_msl || [];
    const validasAltura = serieAltura.filter((x) => x !== null && x !== undefined);
    const minAltura = validasAltura.length ? Math.min(...validasAltura) : 0;
    if (idx >= 0) {
      const alturaMarea = serieAltura[idx];
      const alturaMareaSig = serieAltura[idx + 1];
      resultado.marea_altura = alturaMarea != null ? +(alturaMarea - minAltura).toFixed(2) : null;
      resultado.marea_tendencia = alturaMarea != null && alturaMareaSig != null ? (alturaMareaSig > alturaMarea ? "subiendo" : "bajando") : null;
    }

    // Marea a la hora de FIN de la salida (2026-09-19): misma serie, otro
    // índice. Si hora_fin <= hora_inicio, la salida cruza medianoche y el
    // fin cae en el día siguiente.
    let idxFin = idx;
    if (horaFinSalida && idx >= 0) {
      const fechaFin = horaElegida && horaFinSalida <= horaElegida ? CondSalida.sumarDias(fechaRef, 1) : fechaRef;
      idxFin = CondSalida.indiceHoraSalida(horas, fechaFin, horaFinSalida, opcionesHora).i;
      if (idxFin >= 0) {
        const alturaMareaFin = serieAltura[idxFin];
        const alturaMareaFinSig = serieAltura[idxFin + 1];
        resultado.marea_altura_fin = alturaMareaFin != null ? +(alturaMareaFin - minAltura).toFixed(2) : null;
        resultado.marea_tendencia_fin = alturaMareaFin != null && alturaMareaFinSig != null
          ? (alturaMareaFinSig > alturaMareaFin ? "subiendo" : "bajando")
          : null;
      } else idxFin = idx;
    }

    // Pico de marea (pleamar/bajamar) de la salida: el que caiga dentro de
    // [hora_inicio, hora_fin], o el más cercano por fuera (2026-09-19).
    if (idx >= 0) {
      const picoMarea = picoDeMareaEnIntervalo(serieAltura, horas, idx, idxFin);
      resultado.marea_pico_tipo = picoMarea?.tipo ?? null;
      resultado.marea_pico_hora = picoMarea?.hora ?? null;
    }

    // Coeficiente real por spot con la fecha de la salida (bug del
    // 2026-09-13: usaba new Date()); sin datos, la fórmula astronómica.
    resultado.marea_coeficiente =
      (idx >= 0 ? coeficientePorSpot(horas, serieAltura, idx) : null) ??
      coeficienteMarea(new Date(fechaRef + "T12:00:00"));

    if (idxViento >= 0) {
      const hv = viento.hourly;
      resultado.viento_kmh = hv?.windspeed_10m?.[idxViento] != null ? Math.round(hv.windspeed_10m[idxViento]) : null;
      resultado.viento_dir = hv?.winddirection_10m?.[idxViento] != null ? RUMBOS[Math.round(hv.winddirection_10m[idxViento] / 22.5) % 16] : null;
      resultado.presion_valor = hv?.pressure_msl?.[idxViento] != null ? Math.round(hv.pressure_msl[idxViento]) : null;
      resultado.presion_tendencia = CondSalida.tendenciaPresion(hv?.pressure_msl || [], idxViento);
      resultado.nubosidad = hv?.cloudcover?.[idxViento] != null ? Math.round(hv.cloudcover[idxViento]) : null;
      resultado.precipitacion = hv?.precipitation?.[idxViento] != null ? hv.precipitation[idxViento] : null;
    }

    if (luna && !luna.error && luna.fase) {
      resultado.luna_fase = luna.fase;
      resultado.luna_iluminacion = luna.iluminacion ?? resultado.luna_iluminacion;
    }

    // Solo embarcación Y solo si la salida es de hoy: la boya real más
    // cercana (Puertos del Estado, vía /prevision) es un dato medido de mar
    // abierto, pero es el de AHORA: para otra fecha sería un dato falso. El
    // submarinismo se hace cerca de costa y sigue con el modelo.
    // Se lee ANTES del índice (2026-10-09): la ficha enseñaba la boya y el
    // índice usaba el modelo (17,2 °C en la ficha, "agua a 20,4 °C" en los
    // motivos). Ahora los dos usan el mismo dato.
    let boya = null;
    if (tipoSalida === "embarcacion" && (plan.modo === "hoy" || plan.modo === "sin_fecha")) {
      try {
        const prevision = await fetch("/prevision", { cache: "no-store" }).then((r) => r.json());
        boya = CondSalida.boyaMasCercana(prevision.boyas, lat, lon);
      } catch (e) {
        console.warn("No se pudo obtener la boya real:", e.message);
      }
    }
    if (boya) {
      if (Number.isFinite(boya.alturaSignificativa)) {
        resultado.oleaje_altura_min = boya.alturaSignificativa;
        resultado.oleaje_altura_max = boya.alturaSignificativa;
      }
      if (Number.isFinite(boya.tempAgua)) resultado.temp_agua = boya.tempAgua;
      resultado.boya_usada = boya.nombre;
    }

    // Índice de pesca v2 a la hora de la salida (para calibrarlo después con
    // lo que de verdad se pescó): mejor especie de temporada de esa modalidad,
    // con cada factor y regla guardados en indice_factores.
    if (datosEspecies) {
      try {
        let serie = CondSalida.serieHoraria(marino, viento, factorOleaje(lat, lon));
        const r = CondSalida.indiceHoraSalida(serie.map((h) => h.hora), fechaRef, horaElegida, opcionesHora);
        if (r.i >= 0) {
          serie = CondSalida.aplicarBoyaASerie(serie, r.i, boya);
          const modalidad = CondSalida.TIPO_SALIDA_A_MODALIDAD[tipoSalida] || "costa";
          const ind = VentanaActividad.indiceSpot(datosEspecies, serie, r.i, {
            lat, lon, zona, modalidad, horaActual: horaActualISO(zona),
          });
          Object.assign(resultado, CondSalida.resumenIndice(ind, { estimada: r.estimada }));
          if (boya && resultado.indice_factores) resultado.indice_factores.con_boya = true;
        }
      } catch (e) {
        console.warn("No se pudo calcular el índice de la salida:", e.message);
      }
    }
    if (estimada && resultado.indice_factores) resultado.indice_factores.hora_estimada = true;
  } catch (e) {
    console.warn("No se pudo obtener contexto ambiental:", e.message);
    resultado.condiciones_estado = "error";
  }
  return resultado;
}

// Nombre científico de una captura (2026-10-09, Mikel: "una vez
// identificado, debiera poner el nombre científico"). Solo por nombre
// exacto (sin mayúsculas ni tildes) contra la lista del desplegable, las
// especies de la comunidad y especies.json (nombres en todas las lenguas);
// si no casa, no se pone nada: nunca se adivina.
const normNombre = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
// Nombres locales confirmados por Mikel (Bizkaia, 2026-10-09): "cabra" es
// la cabrilla; "cabra de altura" y "gallineta" son Helicolenus dactylopterus.
const NOMBRES_LOCALES = {
  "cabra": "Serranus cabrilla",
  "cabra de altura": "Helicolenus dactylopterus",
  "gallineta": "Helicolenus dactylopterus",
};
async function cientificoDe(nombre) {
  const n = normNombre(nombre);
  if (!n || n === "otra") return null;
  if (NOMBRES_LOCALES[n]) return NOMBRES_LOCALES[n];
  const lista = todasLasEspecies().find((e) => e.cientifico && (normNombre(e.nombre) === n || e.nombre.split("/").some((p) => normNombre(p) === n)));
  if (lista) return lista.cientifico;
  try {
    const datos = await cargarEspeciesIndice();
    const especies = Array.isArray(datos) ? datos : datos.especies || [];
    const e = especies.find((x) => x.cientifico && Object.values(x.nombres || {}).some((v) => v && normNombre(v) === n));
    return e ? e.cientifico : null;
  } catch {
    return null;
  }
}
const escNombre = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// especies.json para el índice de la salida (una vez por página).
let especiesIndicePromesa = null;
function cargarEspeciesIndice() {
  especiesIndicePromesa ||= fetch("/assets/datos/especies.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(`especies.json HTTP ${r.status}`); return r.json(); })
    .catch((e) => { especiesIndicePromesa = null; throw e; });
  return especiesIndicePromesa;
}

// Marea suelta (altura + tendencia) en un momento concreto — versión
// ligera de la parte de marea de contextoAmbiental(), sin pedir viento/
// oleaje/luna/boya (2026-09-19, pedido explícito del usuario: guardar la
// marea de cada captura y de la hora de fin al concluir la jornada). Una
// sola llamada a la Marine API, ventana corta (un solo día, no hace
// falta la ventana ancha de ±8 días que solo usa el coeficiente de
// marea).
async function mareaEnMomento(lat, lon, hora, fecha) {
  if (!hora || !Number.isFinite(lat) || !Number.isFinite(lon)) return { altura: null, tendencia: null };
  try {
    // Dos días (fecha y la siguiente) por si la hora redondeada cruza medianoche.
    const rangoFechas = fecha ? `start_date=${fecha}&end_date=${CondSalida.sumarDias(fecha, 1)}` : "forecast_days=2";
    const marino = await pedirMeteo("marine", `latitude=${lat}&longitude=${lon}&${consultaZona(lat, lon)}&${rangoFechas}&hourly=sea_level_height_msl`);
    const horas = marino.hourly?.time || [];
    const serie = marino.hourly?.sea_level_height_msl || [];
    const validas = serie.filter((v) => v !== null && v !== undefined);
    const min = validas.length ? Math.min(...validas) : 0;
    // Hora de la FECHA de la captura (23:40 -> 00 del día siguiente); sin
    // esa hora en la serie, null antes que la marea de otra hora.
    const fechaRef = fecha || horaActualISO(Regiones.zonaPorCoordenadas(lat, lon)).slice(0, 10);
    const { i: idx } = CondSalida.indiceHoraSalida(horas, fechaRef, hora);
    if (idx < 0) return { altura: null, tendencia: null };
    const altura = serie[idx];
    const alturaSig = serie[idx + 1];
    return {
      altura: altura != null ? +(altura - min).toFixed(2) : null,
      tendencia: altura != null && alturaSig != null ? (alturaSig > altura ? "subiendo" : "bajando") : null,
    };
  } catch (e) {
    console.warn("No se pudo calcular la marea:", e.message);
    return { altura: null, tendencia: null };
  }
}

// Marea completa al concluir la jornada (2026-09-19, pedido explícito
// del usuario): altura+tendencia en hora_fin, y el pico de marea
// (pleamar/bajamar) de toda la sesión — ver picoDeMareaEnIntervalo() y
// el comentario largo en contextoAmbiental(). Ventana de 2 días (fecha y
// fecha+1) en vez de uno solo: si la salida cruza medianoche, hora_fin
// cae en el día siguiente y hace falta esa franja horaria en la serie.
async function mareaDeConclusion(lat, lon, horaInicio, horaFin, fecha) {
  const vacio = { alturaFin: null, tendenciaFin: null, picoTipo: null, picoHora: null };
  if (!horaInicio || !horaFin || !fecha || !Number.isFinite(lat) || !Number.isFinite(lon)) return vacio;
  try {
    const manana = (() => { const d = new Date(fecha + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); })();
    const marino = await pedirMeteo("marine", `latitude=${lat}&longitude=${lon}&${consultaZona(lat, lon)}&start_date=${fecha}&end_date=${CondSalida.sumarDias(fecha, 2)}&hourly=sea_level_height_msl`);
    const horas = marino.hourly?.time || [];
    const serie = marino.hourly?.sea_level_height_msl || [];
    const validas = serie.filter((v) => v !== null && v !== undefined);
    const min = validas.length ? Math.min(...validas) : 0;
    const indiceDe = (hora, fechaObjetivo) => {
      const { i } = CondSalida.indiceHoraSalida(horas, fechaObjetivo, hora);
      return i >= 0 ? i : Math.max(0, horas.findIndex((hs) => hs.startsWith(fechaObjetivo)));
    };
    const idxInicio = indiceDe(horaInicio, fecha);
    const fechaFin = horaFin <= horaInicio ? manana : fecha;
    const idxFin = indiceDe(horaFin, fechaFin);
    const alturaFin = serie[idxFin];
    const alturaFinSig = serie[idxFin + 1];
    const pico = picoDeMareaEnIntervalo(serie, horas, idxInicio, idxFin);
    return {
      alturaFin: alturaFin != null ? +(alturaFin - min).toFixed(2) : null,
      tendenciaFin: alturaFin != null && alturaFinSig != null ? (alturaFinSig > alturaFin ? "subiendo" : "bajando") : null,
      picoTipo: pico?.tipo ?? null,
      picoHora: pico?.hora ?? null,
    };
  } catch (e) {
    console.warn("No se pudo calcular la marea de conclusión:", e.message);
    return vacio;
  }
}

// Los spots encajan según el tipo de salida (los ~90 fijos son todos de
// costa; los personalizados llevan su propio tipo, ver
// spotEncajaConTipoSalida) — cambiar el tipo de salida cambia qué spots
// tiene sentido ofrecer, así que las <option> del Spot se regeneran cada
// vez que cambia el tipo, no una sola vez al abrir el formulario.
function opcionesSpotsPara(tipoSalida) {
  const todos = todosLosSpotsDiario().filter((s) => spotEncajaConTipoSalida(s, tipoSalida));
  const favoritos = todos.filter((s) => favoritosClaves.has(s.slug));
  const resto = todos.filter((s) => !favoritosClaves.has(s.slug));
  const opcion = (s) => `<option value="${s.slug}">${s.nombre}${s.esUsuario ? " 📍" : ""}</option>`;
  const bloqueFavoritos = favoritos.length ? `<optgroup label="★ Favoritos">${favoritos.map(opcion).join("")}</optgroup>` : "";
  const bloqueResto = resto.length
    ? `<optgroup label="Todos los spots">${resto.map(opcion).join("")}</optgroup>`
    : `<option value="" disabled>— sin spots de este tipo todavía, añade uno en el mapa —</option>`;
  return `<option value="">Mi ubicación actual</option>${bloqueFavoritos}${bloqueResto}`;
}

// Flecha de tendencia de marea (2026-09-19, pedido explícito del
// usuario): verde subiendo, roja bajando, nada si no hay dato. Mismos
// colores que ya usa el resto de la app para éxito/error
// (--ok-texto / --peligro de assets/css/costaviva.css).
function flechaMareaHtml(tendencia) {
  if (tendencia === "subiendo") return `<span style="color:var(--ok-texto);" title="Marea subiendo">▲</span>`;
  if (tendencia === "bajando") return `<span style="color:var(--peligro);" title="Marea bajando">▼</span>`;
  return "";
}

// horaRangoTexto: texto "🕐 08:00 ▲–12:00 ▼" / "🕐 desde 08:00 ▲" / "🕐
// hasta 12:00 ▼" / "" según qué horas tenga la entrada — usado tanto en
// el resumen de cada entrada como (antes) en detalleSalida. La flecha de
// marea va pegada a cada hora (subida al llegar, bajada al irse, o lo
// que sea real) — nunca se inventa si no hay marea_tendencia calculada.
function horaRangoTexto(salida) {
  const inicioHtml = salida.hora_inicio ? `${salida.hora_inicio.slice(0, 5)} ${flechaMareaHtml(salida.marea_tendencia)}` : "";
  const finHtml = salida.hora_fin ? `${salida.hora_fin.slice(0, 5)} ${flechaMareaHtml(salida.marea_tendencia_fin)}` : "";
  if (salida.hora_inicio && salida.hora_fin) return ` · 🕐 ${inicioHtml}–${finHtml}`;
  if (salida.hora_inicio) return ` · 🕐 desde ${inicioHtml}`;
  if (salida.hora_fin) return ` · 🕐 hasta ${finHtml}`;
  return "";
}

// idExistente null -> crea una entrada nueva ese día; con id -> actualiza
// la entrada existente (mismo formulario, ver formularioSalida).
async function guardarSalida(fecha, idExistente) {
  const btn = document.getElementById("btnGuardarSalida");
  const mensajeEl = document.getElementById("mensajeSalida");
  btn.disabled = true;
  const spotSlug = document.getElementById("salidaSpot").value;
  const notas = document.getElementById("salidaNotas").value;
  const horaInicio = selectorHoraInicio.valor();
  const horaFin = selectorHoraFin.valor();
  const tipoSalida = document.getElementById("salidaTipo").value;
  const spot = todosLosSpotsDiario().find((s) => s.slug === spotSlug);

  // Las dos horas son opcionales. Bug real reportado por el usuario
  // 2026-09-19: una salida de noche (ej. 23:00 a 02:00) se rechazaba
  // porque "la hora de fin debe ser posterior" no contemplaba que la
  // salida cruce medianoche — una pesca nocturna real y habitual. Ya no
  // se bloquea nunca por esto: si hora_fin <= hora_inicio se asume
  // sesión que cruza medianoche (mismo criterio que el resto de la app,
  // "un dato real de campo no se rechaza por no encajar en un formato
  // asumido" — ver también el aviso, no bloqueo, de hora de captura
  // fuera de rango más abajo). Limitación conocida que se mantiene: no
  // se puede distinguir esto de un despiste real (ej. escribir la hora
  // de fin antes que la de inicio del mismo día) — se prefiere aceptar
  // el dato tal cual antes que bloquear una salida nocturna real.

  let lat, lon;
  if (spot) {
    lat = spot.lat; lon = spot.lon;
  } else {
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 }));
      lat = pos.coords.latitude; lon = pos.coords.longitude;
    } catch (e) {
      mensajeEl.className = "mensaje error";
      mensajeEl.textContent = "No se pudo obtener tu ubicación — elige un spot de la lista.";
      btn.disabled = false;
      return;
    }
  }

  const contexto = await contextoAmbiental(lat, lon, horaInicio, tipoSalida, fecha, horaFin);
  const datos = {
    user_id: usuario.id, fecha, spot_slug: spot?.slug ?? null, spot_nombre: spot?.nombre ?? "Ubicación actual",
    lat, lon, notas, hora_inicio: horaInicio, hora_fin: horaFin, tipo_salida: tipoSalida, ...contexto,
  };
  // Una entrada nueva empieza "en curso" (pedido explícito del usuario:
  // abrirla al salir a pescar y dejarla así mientras dura la jornada,
  // añadiendo capturas/notas, hasta pulsar "Concluir jornada"). Al
  // editar una ya existente no se toca concluida — así corregir una
  // nota o el spot de una jornada ya cerrada no la vuelve a abrir.
  if (!idExistente) datos.concluida = false;
  const escribir = (d) => (idExistente
    ? supabase.from("salidas_pesca").update(d).eq("id", idExistente)
    : supabase.from("salidas_pesca").insert(d));
  let { error } = await escribir(datos);
  // Columnas del índice v2 (migración 20261008120000_indice_pesca_salida.sql):
  // hasta que se aplique en producción, PostgREST rechaza el insert entero
  // ("Could not find the 'indice_factores' column", PGRST204). Se reintenta
  // sin ellas para no perder la salida.
  if (error && (error.code === "PGRST204" || /indice_|condiciones_estado/.test(error.message || ""))) {
    const sinIndice = { ...datos };
    for (const k of ["indice_version", "indice_puntuacion", "indice_especie", "indice_factores", "condiciones_estado"]) delete sinIndice[k];
    ({ error } = await escribir(sinIndice));
  }
  if (error) {
    mensajeEl.className = "mensaje error";
    mensajeEl.textContent = traducirError(error, "No se ha podido guardar la salida. Inténtalo de nuevo.");
    btn.disabled = false;
    return;
  }
  if (!idExistente) registrarEvento("crear_salida", { tipo_salida: tipoSalida });
  await cargarDatos();
  renderCalendario();
  abrirDia(fecha, new Date(fecha + "T00:00:00"));
}

function contextoHTML(salida) {
  const filas = [
    // Pico de marea (pleamar/bajamar + hora), no una altura suelta —
    // pedido explícito del usuario 2026-09-19: "el dato de marea no tiene
    // mucha lógica tal cual", un número de altura relativo no dice nada
    // útil por sí solo. Ver picoDeMareaEnIntervalo().
    ["MAREA", salida.marea_pico_tipo != null
      ? `${salida.marea_pico_tipo === "pleamar" ? "🔺 Pleamar" : "🔻 Bajamar"} a las ${salida.marea_pico_hora}`
      : "—"],
    ["COEF. MAREA", salida.marea_coeficiente != null ? String(salida.marea_coeficiente) : "—"],
    ["VIENTO", salida.viento_kmh != null ? `${salida.viento_kmh} km/h` : "—"],
    ["OLEAJE", CondSalida.textoOleaje(salida.oleaje_altura_min, salida.oleaje_altura_max)],
    ["PRESIÓN", salida.presion_valor != null ? `${salida.presion_valor} hPa` : "—"],
    ["LUNA", salida.luna_fase ?? "—"],
    ["TEMP. AGUA", salida.temp_agua != null ? `${CondSalida.fmtDecimal(salida.temp_agua)} °C` : "—"],
    ["NUBOSIDAD", salida.nubosidad != null ? `${salida.nubosidad}%` : "—"],
    ["LLUVIA", salida.precipitacion != null ? `${CondSalida.fmtDecimal(salida.precipitacion)} mm/h` : "—"],
  ];
  // Una línea de fuente (2026-10-09). Las salidas guardadas antes de esa
  // fecha calcularon el índice con el modelo aunque la ficha enseñe la boya:
  // se dice para que los dos números no parezcan un error.
  const fIdx = salida.indice_factores;
  const notaBoya = salida.boya_usada
    ? `<div class="detalle nota-ficha">⚓ Oleaje y temp. del agua: boya ${salida.boya_usada.replace(/[&<>"']/g, "")}, Puertos del Estado${salida.indice_puntuacion != null && !fIdx?.con_boya ? "; el índice se calculó con el modelo de Open-Meteo" : ""}.</div>`
    : "";
  // Coeficiente real por spot, no el índice "nacional" de tides4fishing y
  // similares (ver CLAUDE.md, 2026-09-13): plegado tras un ⓘ (2026-10-09).
  const notaCoef = salida.marea_coeficiente != null
    ? `<details class="nota-ficha nota-plegada"><summary>ⓘ Coeficiente de marea</summary>Calculado con la marea de este sitio; puede no coincidir con el de otras webs de mareas.</details>`
    : "";
  // Índice de pesca v2 a la hora de la salida y, si no hay condiciones, por
  // qué (2026-10-08): nunca datos de otro día en su lugar.
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const f = salida.indice_factores;
  const notaIndice = salida.indice_puntuacion != null
    ? `<div class="detalle" style="font-size:11px; color:var(--tinta-3); margin-top:4px;">🎣 Índice de pesca a esa hora: <b class="nota-nivel" data-nivel="${window.NivelIndice ? NivelIndice.nivelPesca(salida.indice_puntuacion) : "sd"}">${esc(salida.indice_puntuacion)}</b>/100${f?.especie_nombre ? ` (mejor especie: ${esc(f.especie_nombre)})` : ""}${f?.hora_estimada ? ", estimado a mediodía (sin hora de inicio)" : ""}.`
      // Motivos con flechas (▲▲/▲/▼/▼▼), sin puntos ni fuentes (decisión de Mikel).
      // Solo motivos con flecha y nada interno ("pendiente de fuente", "no
      // cuenta"...): mismo filtro que la ficha (VentanaActividad.paraUsuario).
      + `<ul style="list-style:none; margin:2px 0 0; padding:0;">${(f?.razones || []).filter((x) => x.aporte && x.factor !== "legal" && x.factor !== "seguridad" && !/pendiente|no cuenta|fuente|por validar|fiabilidad|sin dato/i.test(x.texto || "")).sort((a, b) => Math.abs(b.aporte) - Math.abs(a.aporte)).slice(0, 4)
        .map((x) => `<li><span style="display:inline-block; min-width:20px; font-size:11px; color:${x.aporte > 0 ? "var(--ok-texto)" : "var(--peligro)"};">${x.aporte >= 6 ? "▲▲" : x.aporte > 0 ? "▲" : x.aporte <= -6 ? "▼▼" : "▼"}</span>${esc(x.texto)}</li>`).join("")}</ul>`
      // Ola peligrosa: nota aparte, no un motivo (decisión de Mikel, 2026-10-08).
      + `${f?.aviso_ola ? `<div class="aviso-ola" role="note">${esc(f.aviso_ola)}</div>` : ""}</div>`
    : "";
  const TEXTO_ESTADO = {
    sin_dato_fecha_antigua: "Sin condiciones guardadas: la fecha es de hace más de 90 días y la fuente de previsión no llega tan atrás (mejor vacío que datos de otro día).",
    sin_prevision_fecha_lejana: "Sin condiciones: todavía no hay previsión para esa fecha.",
    sin_dato_hora: "Sin condiciones para esa hora en la fuente de datos.",
    error: "No se pudieron obtener las condiciones de esa fecha.",
  };
  const notaEstado = TEXTO_ESTADO[salida.condiciones_estado]
    ? `<div class="detalle" style="font-size:11px; color:var(--peligro-texto); margin-top:4px;">⚠ ${TEXTO_ESTADO[salida.condiciones_estado]}</div>`
    : "";
  // Atribución obligatoria de Open-Meteo (CC BY 4.0) junto a sus datos.
  const notaMeteo = `<div class="atribucion-meteo">${window.ATRIBUCION_METEO_HTML || "Datos meteorológicos: Open-Meteo.com (CC BY 4.0)"}</div>`;
  return `<div class="contexto-ambiental">${filas.map(([e, v]) => `<div class="dato"><div class="etq">${e}</div><div class="val">${v}</div></div>`).join("")}</div>${notaEstado}${notaIndice}${notaBoya}${notaCoef}${notaMeteo}`;
}

// idExistente null -> añade una captura nueva a la entrada salidaId; con
// id -> actualiza esa captura (las fotos que ya tuviera se quedan, las
// nuevas del selector de fichero se suman detrás, nunca las reemplaza).
async function guardarCaptura(salidaId, fecha, idExistente, ordenFotoBase) {
  const btn = document.getElementById("btnGuardarCaptura");
  const mensajeEl = document.getElementById("mensajeCaptura");
  btn.disabled = true;
  const especieSel = document.getElementById("capturaEspecie").value;
  const especie = especieSel === "Otra" ? document.getElementById("capturaEspecieOtra").value.trim() : especieSel;
  if (!especie) {
    mensajeEl.className = "mensaje error";
    mensajeEl.textContent = "Indica la especie.";
    btn.disabled = false;
    return;
  }
  // Especie escrita a mano bajo "Otra": se da de alta para la comunidad
  // (si no existe ya) para que aparezca como opción real la próxima vez
  // — sin nombre científico, eso se revisa/añade aparte.
  if (especieSel === "Otra" && !todasLasEspecies().some((e) => e.nombre.toLowerCase() === especie.toLowerCase())) {
    const { error: errEspecie } = await supabase
      .from("especies_comunidad")
      .upsert({ nombre: especie, creado_por: usuario.id }, { onConflict: "nombre", ignoreDuplicates: true });
    if (errEspecie) console.warn("No se pudo dar de alta la especie para la comunidad:", errEspecie.message);
  }
  const hora = selectorHoraCaptura.valor();
  let avisoFueraDeRango = "";
  const entradaDelDia = (salidasPorFecha[fecha] || []).find((e) => e.salida.id === salidaId);
  const salidaDelDia = entradaDelDia?.salida;
  if (hora && salidaDelDia?.hora_inicio && salidaDelDia?.hora_fin) {
    const inicioHHMM = salidaDelDia.hora_inicio.slice(0, 5);
    const finHHMM = salidaDelDia.hora_fin.slice(0, 5);
    // Si fin <= inicio, la salida cruza medianoche (ver el mismo criterio
    // en guardarSalida()) — el rango "envuelve" la medianoche en vez de
    // ser un tramo normal del mismo día.
    const cruzaMedianoche = finHHMM <= inicioHHMM;
    const dentroDelRango = cruzaMedianoche
      ? (hora >= inicioHHMM || hora <= finHHMM)
      : (hora >= inicioHHMM && hora <= finHHMM);
    if (!dentroDelRango) {
      avisoFueraDeRango = ` (fuera del rango de la salida, ${inicioHHMM}–${finHHMM} — se guarda igual, es solo un aviso)`;
    }
  }
  const talla = document.getElementById("capturaTalla").value;
  const peso = document.getElementById("capturaPeso").value;
  const cebo = document.getElementById("capturaCebo").value;
  const tecnica = document.getElementById("capturaTecnica").value;
  const usaSenuelo = TECNICAS_CON_SENUELO.has(tecnica);
  const senuelo = usaSenuelo ? document.getElementById("capturaSenuelo").value : "";
  const aparejo = usaSenuelo ? "" : document.getElementById("capturaAparejo").value;
  const notas = document.getElementById("capturaNotas").value;
  const archivos = Array.from(document.getElementById("capturaFotos").files || []);

  // Marea en el momento exacto de la captura (2026-09-19, pedido
  // explícito del usuario) — reutiliza el lat/lon y la fecha ya
  // conocidos de la salida a la que pertenece esta captura.
  const marea = hora && salidaDelDia
    ? await mareaEnMomento(salidaDelDia.lat, salidaDelDia.lon, hora, fecha)
    : { altura: null, tendencia: null };

  const datos = {
    salida_id: salidaId, user_id: usuario.id, especie, hora, talla_cm: talla || null, peso_g: peso || null,
    cebo: cebo || null, tecnica: tecnica || null, senuelo: senuelo || null, aparejo: aparejo || null, notas: notas || null,
    marea_altura: marea.altura, marea_tendencia: marea.tendencia,
  };
  let capturaId = idExistente;
  if (idExistente) {
    const { error } = await supabase.from("capturas").update(datos).eq("id", idExistente);
    if (error) { mensajeEl.className = "mensaje error"; mensajeEl.textContent = traducirError(error, "No se ha podido guardar la captura. Inténtalo de nuevo."); btn.disabled = false; return; }
  } else {
    const { data: captura, error } = await supabase.from("capturas").insert(datos).select().single();
    if (error) { mensajeEl.className = "mensaje error"; mensajeEl.textContent = traducirError(error, "No se ha podido guardar la captura. Inténtalo de nuevo."); btn.disabled = false; return; }
    capturaId = captura.id;
    registrarEvento("crear_captura", { especie, tecnica: tecnica || null });
  }
  // El panel se repinta entero justo después de guardar (abrirDia más
  // abajo), así que un mensaje en mensajeEl no llegaría a verse — de ahí
  // el alert() para este aviso puntual (no bloquea nada, la captura ya
  // se guardó).
  if (avisoFueraDeRango) alert(`Captura guardada${avisoFueraDeRango}.`);

  const casillaCompartir = document.getElementById("capturaCompartir");
  if (casillaCompartir) {
    const res = await sincronizarCompartida(supabase, {
      capturaId, userId: usuario.id, compartir: casillaCompartir.checked, yaCompartida: compartidas.ids.has(capturaId),
    });
    if (!res.ok) { console.error(res.error); alert("La captura se guardó, pero no se pudo cambiar si se comparte. Inténtalo de nuevo desde Editar."); }
  }

  for (let i = 0; i < archivos.length; i++) {
    try {
      const blob = await redimensionarImagen(archivos[i]);
      const path = `${usuario.id}/${crypto.randomUUID()}.jpg`;
      const { error: errSubida } = await supabase.storage.from("capturas-fotos").upload(path, blob, { contentType: "image/jpeg" });
      if (errSubida) { console.error(errSubida); continue; }
      await supabase.from("captura_fotos").insert({ captura_id: capturaId, user_id: usuario.id, foto_path: path, orden: (ordenFotoBase || 0) + i });
    } catch (e) {
      console.error("Error subiendo foto:", e);
    }
  }

  await cargarDatos();
  renderCalendario();
  abrirDia(fecha, new Date(fecha + "T00:00:00"));
}

// Resumen de una entrada del día (siempre visible) — el spot/tipo/horas
// y sus capturas. Editar/añadir abren el formulario compartido de más
// abajo (#zonaFormulario), no se edita en línea sobre este resumen.
async function resumenEntradaHTML(entrada, idx) {
  const { salida, capturas } = entrada;
  const tarjetas = await Promise.all(capturas.map(tarjetaCapturaHTML));
  // "En curso" (pedido explícito del usuario): una entrada nueva empieza
  // abierta — se puede ir añadiendo capturas y notas mientras dura la
  // jornada, hasta pulsar "Concluir jornada". Estilo distinto (borde en
  // color de acento) para que se note de un vistazo cuál sigue abierta.
  const enCurso = salida.concluida === false;
  return `
    <div class="tarjeta-captura" style="margin-top:0; margin-bottom:14px; border:1px solid ${enCurso ? "var(--acento)" : "var(--linea)"};">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div class="detalle" style="font-size:12px; color:var(--tinta-2); flex:1;">
          ${enCurso ? `<span style="color:var(--acento); font-weight:600;">🟢 En curso</span> · ` : ""}📍 ${salida.spot_nombre || "Ubicación actual"}
          ${salida.tipo_salida ? ` · ${etiquetaTipoSalida[salida.tipo_salida] || salida.tipo_salida}` : ""}
          ${horaRangoTexto(salida)}
        </div>
        <div style="display:flex; gap:10px; flex-shrink:0;">
          <button class="editar-entrada" data-idx="${idx}" style="background:none; border:none; color:var(--tinta-2); font-size:11px; cursor:pointer; padding:0;">✏️ Editar</button>
          <button class="borrar-entrada" data-idx="${idx}" style="background:none; border:none; color:var(--peligro); font-size:11px; cursor:pointer; padding:0;">🗑 Borrar</button>
        </div>
      </div>
      ${salida.notas ? `<p style="font-size:13px; margin-top:8px;">${salida.notas}</p>` : ""}
      ${contextoHTML(salida)}
      <div style="margin-top:14px; font-family:var(--f-texto); font-weight:500; font-size:11px; color:var(--tinta-3);">CAPTURAS (${capturas.length})</div>
      ${tarjetas.join("") || `<p style="font-size:12px; color:var(--tinta-3);">Ninguna todavía.</p>`}
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="secundario anadir-captura" data-idx="${idx}" style="margin-top:0; flex:1;">➕ Añadir captura</button>
        ${enCurso ? `<button class="principal concluir-entrada" data-idx="${idx}" style="margin-top:0; flex:1;">✅ Concluir jornada</button>` : ""}
      </div>
    </div>
  `;
}

function cancelarFormulario() {
  document.getElementById("zonaFormulario").innerHTML = "";
}

// Concluir jornada (pedido explícito del usuario): marca la entrada como
// terminada y, si no se había puesto ya, rellena la hora de fin con la
// hora actual — igual que la hora de inicio, es hora LOCAL del punto
// (horaActualISO(zona) da fecha+hora, aquí solo hace falta HH:MM).
function horaActualHHMM(zona = Regiones.ZONA_POR_DEFECTO) {
  return new Intl.DateTimeFormat("es-ES", { timeZone: zona, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date());
}
async function concluirEntrada(iso, fechaObj, salida) {
  // Hora de fin obligatoria para concluir (pedido explícito del usuario
  // 2026-09-19, para poder calcular estadísticas de marea/duración más
  // adelante) — ya no se rellena sola con la hora actual en silencio,
  // hay que ponerla a mano editando la entrada antes de concluir.
  if (!salida.hora_fin) {
    alert("Para concluir la jornada hace falta la hora de fin — edítala (✏️) y ponla antes de concluir.");
    return;
  }
  if (!confirm("¿Concluir esta jornada? Podrás seguir editándola después si hace falta.")) return;
  const marea = await mareaDeConclusion(salida.lat, salida.lon, salida.hora_inicio?.slice(0, 5), salida.hora_fin.slice(0, 5), salida.fecha);
  const { error } = await supabase
    .from("salidas_pesca")
    .update({
      concluida: true,
      marea_altura_fin: marea.alturaFin, marea_tendencia_fin: marea.tendenciaFin,
      marea_pico_tipo: marea.picoTipo, marea_pico_hora: marea.picoHora,
    })
    .eq("id", salida.id);
  if (error) { alert(traducirError(error, "No se ha podido concluir la salida. Inténtalo de nuevo.")); return; }
  await cargarDatos();
  renderCalendario();
  abrirDia(iso, fechaObj);
}

function archivoABase64(blob) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = () => resolve(lector.result.split(",")[1]);
    lector.onerror = reject;
    lector.readAsDataURL(blob);
  });
}

// Añade el archivo al <input type="file"> de fotos sin perder los que ya
// hubiera elegidos — así la foto usada para identificar se sube también
// como foto de la captura, sin tener que elegirla dos veces.
function anadirArchivoAInputFotos(file) {
  const inputFotos = document.getElementById("capturaFotos");
  if (!inputFotos) return;
  const dt = new DataTransfer();
  Array.from(inputFotos.files || []).forEach((f) => dt.items.add(f));
  dt.items.add(file);
  inputFotos.files = dt.files;
}

// Pone la especie identificada en el desplegable si coincide con una
// conocida (ESPECIES + especies_comunidad); si no, cae en "Otra" con el
// nombre en el campo de texto libre — mismo criterio que
// mostrarFormularioEditarCaptura().
function aplicarEspecieIdentificada(nombreEspecie) {
  const especieSel = document.getElementById("capturaEspecie");
  const especieConocida = todasLasEspecies().some((e) => e.nombre.toLowerCase() === nombreEspecie.toLowerCase());
  if (especieConocida) {
    especieSel.value = todasLasEspecies().find((e) => e.nombre.toLowerCase() === nombreEspecie.toLowerCase()).nombre;
    document.getElementById("capturaEspecieOtraBox").style.display = "none";
  } else {
    especieSel.value = "Otra";
    document.getElementById("capturaEspecieOtraBox").style.display = "block";
    document.getElementById("capturaEspecieOtra").value = nombreEspecie;
  }
}

// Aviso suave del cupo mensual de identificaciones: solo desde 80 usadas
// (quedan 20 o menos). null = el servidor no pudo contarlo: no se dice nada.
function avisoCupoMes(restantes) {
  if (typeof restantes !== "number" || restantes > 20) return "";
  if (restantes === 0) return " ℹ️ Era tu última identificación automática de este mes; el día 1 vuelves a tenerlas.";
  return ` ℹ️ Te ${restantes === 1 ? "queda 1 identificación" : `quedan ${restantes} identificaciones`} automáticas este mes.`;
}

async function identificarFotoDesdeArchivo(file) {
  const mensajeEl = document.getElementById("mensajeIdentificarFoto");
  mensajeEl.className = "mensaje info";
  mensajeEl.textContent = "🤖 Analizando la foto…";
  try {
    const blob = await redimensionarImagen(file);
    anadirArchivoAInputFotos(new File([blob], "captura.jpg", { type: "image/jpeg" }));
    const imagenBase64 = await archivoABase64(await redimensionarParaIdentificar(file));
    const { data: sesion } = await supabase.auth.getSession();
    const resp = await fetch("/identificar-captura", {
      method: "POST",
      headers: { "content-type": "application/json", Authorization: `Bearer ${sesion.session.access_token}` },
      body: JSON.stringify({ imagenBase64, tipoMime: "image/jpeg" }),
    });
    const resultado = await resp.json();

    // La identificación por IA es una AYUDA opcional, no un requisito para
    // registrar una captura — la foto ya está añadida al formulario unas
    // líneas más arriba. Así que cuando el servicio no está disponible
    // (sin saldo, saturado o sin configurar; ver clasificarFalloProveedor()
    // en functions/identificar-captura.js) esto NO es un error de la app:
    // se avisa en tono neutro y se invita a rellenar a mano. Añadido
    // 2026-09-25 tras el incidente real del 2026-09-24, en el que se
    // mostraba el error de facturación del proveedor en crudo.
    //
    // Topes (2026-10-08): 30 al día y 100 al mes por usuario. Al llegar al
    // del mes se dice claro y con el mismo recordatorio de que la captura se
    // guarda a mano igual. "rechazada" = el filtro de seguridad del modelo
    // no ha querido analizar esa foto; "sin_suscripcion" no debería verse
    // (la página ya manda a suscripcion.html), pero si pasa, en tono neutro.
    const NO_DISPONIBLE = ["sin_credito", "saturado", "sin_configurar", "limite_diario", "limite_mensual", "rechazada", "sin_suscripcion"];
    if (!resp.ok && resultado.codigo === "limite_mensual") {
      mensajeEl.className = "mensaje info";
      mensajeEl.textContent = `ℹ️ Has usado las ${resultado.limite_mes || 100} identificaciones automáticas de este mes; el día 1 vuelves a tenerlas. La foto ya está añadida: escribe la especie y la talla a mano y guarda la captura con normalidad.`;
      return;
    }
    if (!resp.ok && NO_DISPONIBLE.includes(resultado.codigo)) {
      // "info" (ámbar), no "error" (rojo): las únicas clases reales son
      // error/ok/info, y .mensaje es display:none sin una de ellas.
      mensajeEl.className = "mensaje info";
      mensajeEl.textContent = `ℹ️ ${resultado.error || "La identificación automática no está disponible ahora mismo."} La foto ya está añadida: escribe la especie y la talla a mano y guarda la captura con normalidad.`;
      return;
    }
    if (!resp.ok) throw new Error(resultado.error || `HTTP ${resp.status}`);

    if (resultado.especie) aplicarEspecieIdentificada(resultado.especie);
    if (resultado.talla_cm != null) document.getElementById("capturaTalla").value = resultado.talla_cm;
    if (resultado.peso_g != null) document.getElementById("capturaPeso").value = resultado.peso_g;

    const partes = [];
    if (!resultado.especie) partes.push("no se identificó la especie con seguridad");
    let sugerencia = "";
    if (resultado.talla_cm == null) {
      // Pedido explícito del usuario: si no hay nada en la foto con lo
      // que comparar el tamaño, proponer explícitamente qué hacer la
      // próxima vez, no solo constatar que faltan datos.
      sugerencia = " 💡 No se detectó ninguna referencia de tamaño en la foto (una mano, un aparejo, una cinta métrica…) — inclúyela la próxima vez para poder estimar también talla y peso.";
    }
    mensajeEl.className = "mensaje info";
    mensajeEl.textContent = `🤖 Estimado por IA a partir de la foto (confianza: ${resultado.confianza || "desconocida"}) — revisa y corrige antes de guardar.` +
      (partes.length ? ` (${partes.join("; ")})` : "") + sugerencia + avisoCupoMes(resultado.restantes_mes);
  } catch (e) {
    mensajeEl.className = "mensaje error";
    mensajeEl.textContent = `No se ha podido identificar la foto: ${e.message}`;
  }
}

async function abrirDia(iso, fechaObj) {
  const panel = document.getElementById("panelDia");
  const tituloEl = document.getElementById("panelDiaFecha");
  const contEl = document.getElementById("panelDiaContenido");
  tituloEl.textContent = fechaObj.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  const entradas = salidasPorFecha[iso] || [];
  const resumenes = await Promise.all(entradas.map((e, idx) => resumenEntradaHTML(e, idx)));
  contEl.innerHTML =
    (resumenes.join("") || `<p style="font-size:12px; color:var(--tinta-2);">Todavía no hay nada registrado este día.</p>`) +
    `<div id="zonaFormulario"></div>` +
    `<button class="secundario" id="btnAnadirEntrada">➕ Añadir ${entradas.length ? "otra " : ""}entrada este día</button>`;

  document.getElementById("btnAnadirEntrada").addEventListener("click", () => mostrarFormularioNuevaEntrada(iso));

  contEl.querySelectorAll(".editar-entrada").forEach((btn) => {
    btn.addEventListener("click", () => mostrarFormularioEditarEntrada(iso, entradas[+btn.dataset.idx].salida));
  });
  contEl.querySelectorAll(".borrar-entrada").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("¿Borrar esta entrada y todas sus capturas y fotos?")) return;
      await supabase.from("salidas_pesca").delete().eq("id", entradas[+btn.dataset.idx].salida.id);
      await cargarDatos();
      renderCalendario();
      abrirDia(iso, fechaObj);
    });
  });
  contEl.querySelectorAll(".anadir-captura").forEach((btn) => {
    btn.addEventListener("click", () => mostrarFormularioNuevaCaptura(iso, entradas[+btn.dataset.idx].salida.id));
  });
  contEl.querySelectorAll(".concluir-entrada").forEach((btn) => {
    btn.addEventListener("click", () => concluirEntrada(iso, fechaObj, entradas[+btn.dataset.idx].salida));
  });
  contEl.querySelectorAll(".editar-captura").forEach((btn) => {
    btn.addEventListener("click", () => {
      for (const e of entradas) {
        const captura = e.capturas.find((c) => c.id === btn.dataset.id);
        if (captura) { mostrarFormularioEditarCaptura(iso, e.salida.id, captura); break; }
      }
    });
  });
  contEl.querySelectorAll(".borrar-captura").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("¿Borrar esta captura?")) return;
      await supabase.from("capturas").delete().eq("id", btn.dataset.id);
      await cargarDatos();
      renderCalendario();
      abrirDia(iso, fechaObj);
    });
  });

  panel.classList.add("visible");
}

await cargarDatos();
await cargarSpotsUsuario();
await cargarEspeciesComunidad();
renderCalendario();
</script>

</body>
</html>
