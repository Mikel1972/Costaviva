  .dia {
    aspect-ratio: 1; border-radius: 8px; background: #0F2C38; border: 1px solid #1C3F4F;

    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9FB8BF; cursor: pointer; position: relative;

  .dia.rojo { background: rgba(163,74,53,0.28); border-color: #A34A35; color: #F5D9D2; }

    display: none; position: fixed; left: 0; right: 0; bottom: 54px; max-height: 78vh;

// a las de arriba en el desplegable, para que a partir de la siguiente
// vez ya aparezcan como opción real. "Otra" se queda siempre la última.
let especiesComunidad = [];
async function cargarEspeciesComunidad() {
  const { data, error } = await supabase.from("especies_comunidad").select("nombre, nombre_cientifico").order("nombre");
  if (error) { console.warn("No se pudieron cargar las especies de la comunidad:", error.message); return; }
  especiesComunidad = (data || []).map((e) => ({ nombre: e.nombre, cientifico: e.nombre_cientifico }));
}
function todasLasEspecies() {
  return [...ESPECIES, ...especiesComunidad, { nombre: "Otra", cientifico: null }];
}

async function cargarSpotsUsuario() {
  const [{ data: filas, error: errSpots }, { data: favs, error: errFav }] = await Promise.all([

    supabase.from("spots_favoritos").select("*").eq("user_id", usuario.id),

  favoritosClaves = new Set((favs || []).map((f) => f.spot_slug || f.spot_usuario_id));
}

  // personalizados sí llevan su tipo (costa/embarcacion/buceo, elegido
  // al crearlos en el mapa, ver index.html).
  const fijos = SPOTS.map((s) => ({ ...s, esUsuario: false, tipo: "costa" }));
  const personalizados = spotsUsuario.map((f) => ({ slug: f.id, nombre: f.nombre, lat: f.lat, lon: f.lon, esUsuario: true, tipo: f.tipo }));
  return [...fijos, ...personalizados];
}

// tipo_salida (costa/embarcacion/submarinismo) -> qué tipo de spot encaja.
// "submarinismo" usa spots de tipo "buceo" (nombre de columna heredado de
// cuando solo eran ubicaciones de mar abierto para embarcación/buceo, ver
// migración 20260912180000_tipo_ubicacion_usuario.sql).
const TIPO_SALIDA_A_TIPO_SPOT = { costa: "costa", embarcacion: "embarcacion", submarinismo: "buceo" };
function spotEncajaConTipoSalida(spot, tipoSalida) {
  return spot.tipo === TIPO_SALIDA_A_TIPO_SPOT[tipoSalida];
}

function fechaISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function cargarDatos() {
  const { data: salidas, error: errSalidas } = await supabase
    .from("salidas_pesca")
    .select("*")
    .order("fecha", { ascending: false });
  if (errSalidas) { console.error(errSalidas); return; }

  const idsSalidas = salidas.map((s) => s.id);
  let capturasPorSalida = {};
  if (idsSalidas.length) {
    const { data: capturas, error: errCapturas } = await supabase
      .from("capturas")
      .select("*")
      .in("salida_id", idsSalidas)
      .order("creado_en", { ascending: true });
    if (errCapturas) console.error(errCapturas);
    (capturas || []).forEach((c) => {
      (capturasPorSalida[c.salida_id] = capturasPorSalida[c.salida_id] || []).push(c);
    });
  }

  // Varias entradas por día (pedido explícito del usuario: puede pescar
  // en varios spots el mismo día, o ir en barco por la mañana y de
  // costa por la tarde) — cada fecha guarda una LISTA de entradas, no
  // una sola. `salidas` ya viene ordenado por fecha desc; se mantiene
  // ese orden relativo dentro de cada día (más reciente primero según
  // se creó, gracias al orden de inserción del array).
  salidasPorFecha = {};
  salidas.forEach((s) => {
    (salidasPorFecha[s.fecha] = salidasPorFecha[s.fecha] || []).push({ salida: s, capturas: capturasPorSalida[s.id] || [] });
  });
}

function renderCalendario() {
  document.getElementById("nombreMes").textContent = `${MESES[cursor.getMonth()]} ${cursor.getFullYear()}`;
  const cont = document.getElementById("calendario");
  cont.innerHTML = "";
  DIAS_SEMANA.forEach((d) => {
    const el = document.createElement("div");
    el.className = "dia-semana";
    el.textContent = d;
    cont.appendChild(el);
  });

  const primerDia = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const ultimoDia = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
  const huecoInicial = (primerDia.getDay() + 6) % 7; // lunes = 0

  for (let i = 0; i < huecoInicial; i++) {
    const el = document.createElement("div");
    el.className = "dia vacio";
    cont.appendChild(el);
  }

  const hoyISO = fechaISO(new Date());
  for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
    const fecha = new Date(cursor.getFullYear(), cursor.getMonth(), dia);
    const iso = fechaISO(fecha);
    const el = document.createElement("div");
    el.className = "dia";
    if (iso === hoyISO) el.classList.add("hoy");
    const entradas = salidasPorFecha[iso];
    if (entradas && entradas.length) {
      el.classList.add(entradas.some((e) => e.capturas.length) ? "verde" : "rojo");
    }
    el.textContent = String(dia);
    el.addEventListener("click", () => abrirDia(iso, fecha));
    cont.appendChild(el);
  }
}

async function redimensionarImagen(file, maxAncho = 1600, calidad = 0.8) {
  const bitmap = await createImageBitmap(file);
  const escala = Math.min(1, maxAncho / bitmap.width);
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * escala);
  canvas.height = Math.round(bitmap.height * escala);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", calidad));
}

// Selector de hora: dos <select> nativos (hora, minuto) — sustituye a
// <input type="time"> (su desplegable nativo, en algunos navegadores/
// móviles, solo deja ver unas pocas horas a la vez) y a un primer
// intento con una rueda de scroll/snap hecha a mano, que en la práctica
// no se veía igual en todos los navegadores. El propio <select> del
// navegador ya trae scroll cuando tiene muchas opciones, así que es la
// forma más simple y fiable de tener "un desplegable con scroll".
// valorInicial null/undefined -> empieza sin nada elegido ("--" en
// ambos) — todas las horas de la app son opcionales: quien va en una
// embarcación moviéndose puede querer registrar una captura de un
// momento concreto sin rellenar nada más, o solo la hora de inicio sin
// la de fin si es una salida puntual.
function crearSelectorHora(idContenedor, valorInicial) {
  const cont = document.getElementById(idContenedor);
  const horas = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
  const minutos = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, "0"));
  const [hIni, mIni] = (valorInicial || "").split(":");

  const opciones = (valores, actual) =>
    `<option value="">--</option>` +
    valores.map((v) => `<option value="${v}" ${v === actual ? "selected" : ""}>${v}</option>`).join("");
  cont.innerHTML = `
    <select class="hora-select-h">${opciones(horas, hIni)}</select>
    <span class="hora-select-sep">:</span>
    <select class="hora-select-m">${opciones(minutos, mIni)}</select>
  `;
  const selH = cont.querySelector(".hora-select-h");
  const selM = cont.querySelector(".hora-select-m");

  return {
    valor() {
      if (!selH.value || !selM.value) return null;
      return `${selH.value}:${selM.value}`;
    },
  };
}

// Bug real encontrado 2026-09-12 (el usuario vio nubosidad 100% cuando en
// realidad no pasaba del 20%): Open-Meteo (timezone=Europe/Madrid)
// etiqueta sus horas en local, no en UTC — new Date().toISOString() es
// UTC y comparado tal cual desplazaba el "ahora" 1-2h según CET/CEST.
// Mismo fallo corregido a la vez en functions/prevision.js e index.html.
function horaActualMadridISO() {
  const partes = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Madrid", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date());
  const val = (t) => partes.find((p) => p.type === t).value;
  return `${val("year")}-${val("month")}-${val("day")}T${val("hour")}`;
}

// Coeficiente de marea por spot (2026-09-13, ver el comentario largo en
// functions/prevision.js): el índice "nacional" por fase lunar (más
// abajo, coeficienteMarea) resultó ser el MISMO número en toda España y
// Portugal (verificado contra tides4fishing.com en 6 puertos distintos)
// — no aporta nada específico de cada spot. Este calcula uno real, a
// partir del propio rango de marea (pleamar menos bajamar) que
// Open-Meteo modela para ESE punto, normalizado contra el mínimo y
// máximo rango de ese mismo spot en una ventana de ~17 días alrededor
// de la fecha (cubre un ciclo vivas-muertas completo, ~14.77 días).
// Misma función que coeficientePorSpot() en functions/prevision.js,
// duplicada aquí porque no hay bundling entre archivos.
function coeficientePorSpot(horas, alturas, idxReferencia) {
  const rangosPorDia = {};
  horas.forEach((h, i) => {
    const v = alturas[i];
    if (v === null || v === undefined) return;
    const dia = h.slice(0, 10);
    if (!rangosPorDia[dia]) rangosPorDia[dia] = { min: v, max: v };
    else {
      rangosPorDia[dia].min = Math.min(rangosPorDia[dia].min, v);
      rangosPorDia[dia].max = Math.max(rangosPorDia[dia].max, v);
    }
  });
  const dias = Object.keys(rangosPorDia);
  if (dias.length < 10) return null;
  const rangos = dias.map((d) => rangosPorDia[d].max - rangosPorDia[d].min);
  const rangoMin = Math.min(...rangos);
  const rangoMax = Math.max(...rangos);
  if (rangoMax - rangoMin < 0.01) return null;
  const diaRef = horas[idxReferencia]?.slice(0, 10);
  const rangoRef = rangosPorDia[diaRef] ? rangosPorDia[diaRef].max - rangosPorDia[diaRef].min : null;
  if (rangoRef === null) return null;
  const factor = Math.max(0, Math.min(1, (rangoRef - rangoMin) / (rangoMax - rangoMin)));
  return Math.round(20 + 100 * factor);
}

// Respaldo si la ventana amplia no trae datos suficientes (fallo puntual
// de Open-Meteo, spot casi sin marea, etc.) — aproximación astronómica
// por fase lunar, escala 20-120. No es un dato oficial de un servicio
// hidrográfico.
const RETRASO_MAREA_DIAS = 2;
const SINODICO_DIAS = 29.530588853;
const JD_LUNA_NUEVA_REF = 2451550.1; // 2000-01-06 18:14 UTC, luna nueva de referencia (J2000)
function coeficienteMarea(fecha) {
  const jd = fecha.getTime() / 86400000 + 2440587.5 - RETRASO_MAREA_DIAS;
  const edadDias = (((jd - JD_LUNA_NUEVA_REF) % SINODICO_DIAS) + SINODICO_DIAS) % SINODICO_DIAS;
  const fase = edadDias / SINODICO_DIAS;
  const factorVivas = Math.abs(Math.cos(2 * Math.PI * fase));
  return Math.round(45 + 75 * factorVivas);
}

async function contextoAmbiental(lat, lon, horaElegida, tipoSalida, fecha) {
  // Bug real encontrado 2026-09-13 (el usuario cazó el del coeficiente
  // de marea y llevó a revisar el resto): con forecast_days=1 esto
  // pedía siempre el pronóstico de "ahora mismo", sin importar la fecha
  // real de la salida — una entrada guardada/editada un día distinto al
  // que ocurrió (registro retroactivo) se guardaba con el oleaje/
  // viento/presión/nubosidad/temperatura de HOY, no de su propia fecha.
  // start_date=end_date=fecha lo pide para el día correcto (verificado
  // en real que Open-Meteo lo sirve así para fechas pasadas recientes);
  // sin fecha (no debería pasar, pero por si acaso) cae de vuelta al
  // comportamiento de siempre.
  const rangoFechas = fecha ? `start_date=${fecha}&end_date=${fecha}` : "forecast_days=1";
  const paramsComunes = `latitude=${lat}&longitude=${lon}&timezone=Europe%2FMadrid&${rangoFechas}`;
  // La Marine API pide una ventana más ancha que el resto (±8 días
  // alrededor de la fecha, ~17 días — cubre un ciclo vivas-muertas
  // completo, ~14.77 días) para poder calcular coeficientePorSpot(): el
  // rango de marea de esa fecha en concreto normalizado contra el
  // mínimo/máximo rango real de ese mismo spot. Sin fecha, cae de vuelta
  // a la ventana corta de siempre.
  const sumarDias = (iso, dias) => {
    const d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + dias);
    return d.toISOString().slice(0, 10);
  };
  const paramsMarea = fecha
    ? `latitude=${lat}&longitude=${lon}&timezone=Europe%2FMadrid&start_date=${sumarDias(fecha, -8)}&end_date=${sumarDias(fecha, 8)}`
    : paramsComunes;
  const resultado = { marea_altura: null, marea_tendencia: null, marea_coeficiente: null, presion_valor: null, presion_tendencia: null,
    luna_fase: null, luna_iluminacion: null, viento_kmh: null, viento_dir: null,
    oleaje_altura_min: null, oleaje_altura_max: null, temp_agua: null,
    nubosidad: null, precipitacion: null, boya_usada: null };
  try {
    const [marino, viento, luna] = await Promise.all([
      fetch(`https://marine-api.open-meteo.com/v1/marine?${paramsMarea}&hourly=wave_height,sea_level_height_msl,sea_surface_temperature`).then((r) => r.json()),
      fetch(`https://api.open-meteo.com/v1/forecast?${paramsComunes}&hourly=windspeed_10m,winddirection_10m,pressure_msl,cloudcover,precipitation&windspeed_unit=kmh`).then((r) => r.json()),
      fetch(`/luna?lat=${lat}&lon=${lon}`).then((r) => r.json()),
    ]);
    const horas = marino.hourly?.time || [];
    // Sin hora elegida: la hora de ahora (comportamiento de siempre). Con
    // hora elegida (HH:MM, de la hora de inicio del selector de rueda): la hora en punto
    // más cercana — Open-Meteo da el dato por hora, no por minuto, así
    // que los minutos son solo para el registro, no cambian qué bloque
    // horario se usa. Redondea a la hora más cercana (no trunca hacia
    // abajo) para que 07:40 use el bloque de las 8h, más representativo
    // que el de las 7h. `horas` ahora puede traer ±8 días de más (por la
    // ventana ancha del coeficiente) — hay que exigir también que la
    // FECHA coincida con la de la salida, no solo la hora del día, o se
    // colaría la primera de los ±8 días que tenga esa misma hora.
    let idx = -1;
    if (horaElegida) {
      const [h, m] = horaElegida.split(":").map(Number);
      const horaObjetivo = m >= 30 ? (h + 1) % 24 : h;
      idx = horas.findIndex((hs) => (!fecha || hs.startsWith(fecha)) && +hs.slice(11, 13) === horaObjetivo);
    }
    if (idx === -1) {
      idx = horas.findIndex((h) => h.slice(0, 13) === horaActualMadridISO());
    }
    // Sin hora elegida y la fecha no es hoy (registro retroactivo): la
    // hora de ahora no significa nada para un día distinto — mediodía
    // es una referencia más representativa de la jornada que
    // medianoche (el índice 0 al que caería si no se afina esto).
    if (idx === -1) idx = horas.findIndex((hs) => (!fecha || hs.startsWith(fecha)) && +hs.slice(11, 13) === 12);
    if (idx === -1) idx = fecha ? Math.max(0, horas.findIndex((hs) => hs.startsWith(fecha))) : 0;

    const alturaOla = marino.hourly?.wave_height?.[idx];
    if (alturaOla !== undefined && alturaOla !== null) {
      resultado.oleaje_altura_min = +(alturaOla * 0.9).toFixed(1);
      resultado.oleaje_altura_max = +(alturaOla * 1.1).toFixed(1);
    }
    resultado.temp_agua = marino.hourly?.sea_surface_temperature?.[idx] ?? null;
    // sea_level_height_msl es una anomalía respecto al nivel medio del
    // mar (puede salir negativa) — se re-referencia contra el mínimo de
    // la propia ventana de datos para mostrar la altura de marea de
    // forma intuitiva (siempre ≥ 0), no un dato oceanográfico confuso.
    // Mismo criterio que functions/prevision.js (calcularMarea).
    const serieAltura = marino.hourly?.sea_level_height_msl || [];
    const validasAltura = serieAltura.filter((v) => v !== null && v !== undefined);
    const minAltura = validasAltura.length ? Math.min(...validasAltura) : 0;
    const alturaMarea = serieAltura[idx];
    const alturaMareaSig = serieAltura[idx + 1];
    resultado.marea_altura = alturaMarea != null ? +(alturaMarea - minAltura).toFixed(2) : null;
    resultado.marea_tendencia = alturaMarea != null && alturaMareaSig != null ? (alturaMareaSig > alturaMarea ? "subiendo" : "bajando") : null;
    // Bug real reportado por el usuario (2026-09-13): esto usaba
    // new Date() (el momento de guardar), no la fecha real de la
    // salida — una salida del 7 de septiembre guardada/editada más
    // tarde mostraba el coeficiente de HOY, no el del 7 de septiembre.
    // Ahora usa coeficientePorSpot() (real, por spot — ver el comentario
    // largo más arriba) con la fecha real, y solo si esa ventana no trae
    // datos suficientes cae de vuelta a la fórmula astronómica genérica.
    resultado.marea_coeficiente =
      coeficientePorSpot(horas, serieAltura, idx) ??
      coeficienteMarea(fecha ? new Date(fecha + "T12:00:00") : new Date());

    resultado.viento_kmh = viento.hourly?.windspeed_10m?.[idx] != null ? Math.round(viento.hourly.windspeed_10m[idx]) : null;
    resultado.presion_valor = viento.hourly?.pressure_msl?.[idx] != null ? Math.round(viento.hourly.pressure_msl[idx]) : null;
    resultado.nubosidad = viento.hourly?.cloudcover?.[idx] != null ? Math.round(viento.hourly.cloudcover[idx]) : null;
    resultado.precipitacion = viento.hourly?.precipitation?.[idx] != null ? viento.hourly.precipitation[idx] : null;

    resultado.luna_fase = luna?.fase ?? null;
    resultado.luna_iluminacion = luna?.iluminacion ?? null;

    // Solo embarcación: la boya real más cercana (Puertos del Estado, vía
    // /prevision) es un dato medido de mar abierto, mejor que el modelo
    // por coordenadas ahí — pero el submarinismo se hace cerca de costa
    // (igual que "costa"), donde la boya de mar abierto no es
    // representativa, así que sigue usando el modelo por coordenadas.
    if (tipoSalida === "embarcacion") {
      try {
        const prevision = await fetch("/prevision", { cache: "no-store" }).then((r) => r.json());
        const boyas = (prevision.boyas || []).filter(
          (b) => !b.error && Number.isFinite(b.lat) && Number.isFinite(b.lon)
        );
        if (boyas.length) {
          const distancia = (b) => Math.hypot(b.lat - lat, b.lon - lon);
          const masCercana = boyas.reduce((mejor, b) => (distancia(b) < distancia(mejor) ? b : mejor));
          if (Number.isFinite(masCercana.alturaSignificativa)) {
            resultado.oleaje_altura_min = masCercana.alturaSignificativa;
            resultado.oleaje_altura_max = masCercana.alturaSignificativa;
          }
          if (Number.isFinite(masCercana.tempAgua)) resultado.temp_agua = masCercana.tempAgua;
          resultado.boya_usada = masCercana.nombre;
        }
      } catch (e) {
        console.warn("No se pudo obtener la boya real:", e.message);
      }
    }
  } catch (e) {
    console.warn("No se pudo obtener contexto ambiental:", e.message);
  }
  return resultado;
}

const etiquetaTipoSalida = { costa: "🪨 Costa", embarcacion: "🚤 Embarcación", submarinismo: "🤿 Submarinismo" };

// Los spots encajan según el tipo de salida (los ~90 fijos son todos de
// costa; los personalizados llevan su propio tipo, ver
// spotEncajaConTipoSalida) — cambiar el tipo de salida cambia qué spots
// tiene sentido ofrecer, así que las <option> del Spot se regeneran cada
// vez que cambia el tipo, no una sola vez al abrir el formulario.
function opcionesSpotsPara(tipoSalida) {
  const todos = todosLosSpotsDiario().filter((s) => spotEncajaConTipoSalida(s, tipoSalida));
  const favoritos = todos.filter((s) => favoritosClaves.has(s.slug));
  const resto = todos.filter((s) => !favoritosClaves.has(s.slug));
  const opcion = (s) => `<option value="${s.slug}">${s.nombre}${s.esUsuario ? " 📍" : ""}</option>`;
  const bloqueFavoritos = favoritos.length ? `<optgroup label="★ Favoritos">${favoritos.map(opcion).join("")}</optgroup>` : "";
  const bloqueResto = resto.length
    ? `<optgroup label="Todos los spots">${resto.map(opcion).join("")}</optgroup>`
    : `<option value="" disabled>— sin spots de este tipo todavía, añade uno en el mapa —</option>`;
  return `<option value="">Mi ubicación actual</option>${bloqueFavoritos}${bloqueResto}`;
}

// horaRangoTexto: texto "🕐 08:00–12:00" / "🕐 desde 08:00" / "🕐 hasta
// 12:00" / "" según qué horas tenga la entrada — usado tanto en el
// resumen de cada entrada como (antes) en detalleSalida.
function horaRangoTexto(salida) {
  if (salida.hora_inicio && salida.hora_fin) return ` · 🕐 ${salida.hora_inicio.slice(0, 5)}–${salida.hora_fin.slice(0, 5)}`;
  if (salida.hora_inicio) return ` · 🕐 desde ${salida.hora_inicio.slice(0, 5)}`;
  if (salida.hora_fin) return ` · 🕐 hasta ${salida.hora_fin.slice(0, 5)}`;
  return "";
}

// idExistente null -> crea una entrada nueva ese día; con id -> actualiza
// la entrada existente (mismo formulario, ver formularioSalida).
async function guardarSalida(fecha, idExistente) {
  const btn = document.getElementById("btnGuardarSalida");
  const mensajeEl = document.getElementById("mensajeSalida");
  btn.disabled = true;
  const spotSlug = document.getElementById("salidaSpot").value;
  const notas = document.getElementById("salidaNotas").value;
  const horaInicio = selectorHoraInicio.valor();
  const horaFin = selectorHoraFin.valor();
  const tipoSalida = document.getElementById("salidaTipo").value;
  const spot = todosLosSpotsDiario().find((s) => s.slug === spotSlug);

  // Las dos horas son opcionales — solo se valida el orden cuando están
  // las dos puestas. Asume que la salida no cruza medianoche (limitación
  // conocida, no contemplada aún).
  if (horaInicio && horaFin && horaFin <= horaInicio) {
    mensajeEl.className = "mensaje error";
    mensajeEl.textContent = "La hora de fin debe ser posterior a la hora de inicio.";
    btn.disabled = false;
    return;
  }

  let lat, lon;
  if (spot) {
    lat = spot.lat; lon = spot.lon;
  } else {
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 }));
      lat = pos.coords.latitude; lon = pos.coords.longitude;
    } catch (e) {
      mensajeEl.className = "mensaje error";
      mensajeEl.textContent = "No se pudo obtener tu ubicación — elige un spot de la lista.";
      btn.disabled = false;
      return;
    }
  }

  const contexto = await contextoAmbiental(lat, lon, horaInicio, tipoSalida, fecha);
  const datos = {
    user_id: usuario.id, fecha, spot_slug: spot?.slug ?? null, spot_nombre: spot?.nombre ?? "Ubicación actual",
    lat, lon, notas, hora_inicio: horaInicio, hora_fin: horaFin, tipo_salida: tipoSalida, ...contexto,
  };
  const { error } = idExistente
    ? await supabase.from("salidas_pesca").update(datos).eq("id", idExistente)
    : await supabase.from("salidas_pesca").insert(datos);
  if (error) {
    mensajeEl.className = "mensaje error";
    mensajeEl.textContent = error.message;
    btn.disabled = false;
    return;
  }
  await cargarDatos();
  renderCalendario();
  abrirDia(fecha, new Date(fecha + "T00:00:00"));
}

function contextoHTML(salida) {
  const filas = [
    ["MAREA", salida.marea_altura != null ? `${salida.marea_altura.toFixed?.(2) ?? salida.marea_altura}m ${salida.marea_tendencia === "subiendo" ? "↑" : salida.marea_tendencia === "bajando" ? "↓" : ""}` : "—"],
    ["COEF. MAREA", salida.marea_coeficiente != null ? String(salida.marea_coeficiente) : "—"],
    ["VIENTO", salida.viento_kmh != null ? `${salida.viento_kmh} km/h` : "—"],
    ["OLEAJE", salida.oleaje_altura_min != null ? `${salida.oleaje_altura_min}–${salida.oleaje_altura_max}m` : "—"],
    ["PRESIÓN", salida.presion_valor != null ? `${salida.presion_valor} hPa` : "—"],
    ["LUNA", salida.luna_fase ?? "—"],
    ["TEMP. AGUA", salida.temp_agua != null ? `${salida.temp_agua}°C` : "—"],
    ["NUBOSIDAD", salida.nubosidad != null ? `${salida.nubosidad}%` : "—"],
    ["LLUVIA", salida.precipitacion != null ? `${salida.precipitacion} mm/h` : "—"],
  ];
  const notaBoya = salida.boya_usada
    ? `<div class="detalle" style="font-size:11px; color:#6C8890; margin-top:4px;">⚓ Oleaje y temperatura de la boya real de ${salida.boya_usada} (Puertos del Estado), no del modelo por coordenadas.</div>`
    : "";
  return `<div class="contexto-ambiental">${filas.map(([e, v]) => `<div class="dato"><div class="etq">${e}</div><div class="val">${v}</div></div>`).join("")}</div>${notaBoya}`;
}

async function tarjetaCapturaHTML(captura) {
  const { data: fotos } = await supabase.from("captura_fotos").select("*").eq("captura_id", captura.id).order("orden");
  const urls = await Promise.all((fotos || []).map((f) => urlFirmada(f.foto_path)));
  return `
    <div class="tarjeta-captura" data-captura-id="${captura.id}">
      <div class="fila-titulo"><span class="especie">🐟 ${captura.especie}</span><span class="detalle">${captura.hora ? "🕐 " + captura.hora.slice(0, 5) + " " : ""}${captura.talla_cm ? captura.talla_cm + " cm" : ""} ${captura.peso_g ? "· " + captura.peso_g + " g" : ""}</span></div>
      ${captura.tecnica ? `<div class="detalle">🎣 ${captura.tecnica}</div>` : ""}
      ${captura.cebo || captura.aparejo || captura.senuelo ? `<div class="detalle">${captura.cebo ? "Cebo: " + captura.cebo : ""} ${captura.aparejo ? "· Aparejo: " + captura.aparejo : ""} ${captura.senuelo ? "· Señuelo: " + captura.senuelo : ""}</div>` : ""}
      ${captura.notas ? `<div class="detalle">${captura.notas}</div>` : ""}
      ${urls.length ? `<div class="galeria-fotos">${urls.map((u) => `<img src="${u}" alt="Foto de ${captura.especie}" />`).join("")}</div>` : ""}
      <div style="display:flex; gap:12px; margin-top:6px;">
        <button class="editar-captura" data-id="${captura.id}" style="background:none; border:none; color:#9FB8BF; font-size:11px; cursor:pointer; padding:0;">✏️ Editar</button>
        <button class="borrar-captura" data-id="${captura.id}" style="background:none; border:none; color:#E8907A; font-size:11px; cursor:pointer; padding:0;">🗑 Borrar</button>
      </div>
    </div>
  `;
}

    <div class="tarjeta-captura" style="border:1px dashed #1C3F4F;">

      <label>Hora</label>

      <label for="capturaTalla">Talla (cm)</label>

      <label for="capturaPeso">Peso (g)</label>

        <label for="capturaAparejo">Aparejo</label>
        <select id="capturaAparejo">
          <option value="">Sin especificar</option>
          <option value="Plomo">Plomo</option>
          <option value="Corcho">Corcho</option>
          <option value="Otro">Otro</option>
        </select>

      <label for="capturaCebo">Cebo</label>

// idExistente null -> añade una captura nueva a la entrada salidaId; con
// id -> actualiza esa captura (las fotos que ya tuviera se quedan, las
// nuevas del selector de fichero se suman detrás, nunca las reemplaza).
async function guardarCaptura(salidaId, fecha, idExistente, ordenFotoBase) {
  const btn = document.getElementById("btnGuardarCaptura");
  const mensajeEl = document.getElementById("mensajeCaptura");
  btn.disabled = true;
  const especieSel = document.getElementById("capturaEspecie").value;
  const especie = especieSel === "Otra" ? document.getElementById("capturaEspecieOtra").value.trim() : especieSel;
  if (!especie) {
    mensajeEl.className = "mensaje error";
    mensajeEl.textContent = "Indica la especie.";
    btn.disabled = false;
    return;
  }
  // Especie escrita a mano bajo "Otra": se da de alta para la comunidad
  // (si no existe ya) para que aparezca como opción real la próxima vez
  // — sin nombre científico, eso se revisa/añade aparte.
  if (especieSel === "Otra" && !todasLasEspecies().some((e) => e.nombre.toLowerCase() === especie.toLowerCase())) {
    const { error: errEspecie } = await supabase
      .from("especies_comunidad")
      .upsert({ nombre: especie, creado_por: usuario.id }, { onConflict: "nombre", ignoreDuplicates: true });
    if (errEspecie) console.warn("No se pudo dar de alta la especie para la comunidad:", errEspecie.message);
  }
  const hora = selectorHoraCaptura.valor();
  let avisoFueraDeRango = "";
  const entradaDelDia = (salidasPorFecha[fecha] || []).find((e) => e.salida.id === salidaId);
  const salidaDelDia = entradaDelDia?.salida;
  if (hora && salidaDelDia?.hora_inicio && salidaDelDia?.hora_fin &&
      (hora < salidaDelDia.hora_inicio.slice(0, 5) || hora > salidaDelDia.hora_fin.slice(0, 5))) {
    avisoFueraDeRango = ` (fuera del rango de la salida, ${salidaDelDia.hora_inicio.slice(0, 5)}–${salidaDelDia.hora_fin.slice(0, 5)} — se guarda igual, es solo un aviso)`;
  }
  const talla = document.getElementById("capturaTalla").value;
  const peso = document.getElementById("capturaPeso").value;
  const cebo = document.getElementById("capturaCebo").value;
  const tecnica = document.getElementById("capturaTecnica").value;
  const usaSenuelo = TECNICAS_CON_SENUELO.has(tecnica);
  const senuelo = usaSenuelo ? document.getElementById("capturaSenuelo").value : "";
  const aparejo = usaSenuelo ? "" : document.getElementById("capturaAparejo").value;
  const notas = document.getElementById("capturaNotas").value;
  const archivos = Array.from(document.getElementById("capturaFotos").files || []);

  const datos = {
    salida_id: salidaId, user_id: usuario.id, especie, hora, talla_cm: talla || null, peso_g: peso || null,
    cebo: cebo || null, tecnica: tecnica || null, senuelo: senuelo || null, aparejo: aparejo || null, notas: notas || null,
  };
  let capturaId = idExistente;
  if (idExistente) {
    const { error } = await supabase.from("capturas").update(datos).eq("id", idExistente);
    if (error) { mensajeEl.className = "mensaje error"; mensajeEl.textContent = error.message; btn.disabled = false; return; }
  } else {
    const { data: captura, error } = await supabase.from("capturas").insert(datos).select().single();
    if (error) { mensajeEl.className = "mensaje error"; mensajeEl.textContent = error.message; btn.disabled = false; return; }
    capturaId = captura.id;
  }
  // El panel se repinta entero justo después de guardar (abrirDia más
  // abajo), así que un mensaje en mensajeEl no llegaría a verse — de ahí
  // el alert() para este aviso puntual (no bloquea nada, la captura ya
  // se guardó).
  if (avisoFueraDeRango) alert(`Captura guardada${avisoFueraDeRango}.`);

  for (let i = 0; i < archivos.length; i++) {
    try {
      const blob = await redimensionarImagen(archivos[i]);
      const path = `${usuario.id}/${crypto.randomUUID()}.jpg`;
      const { error: errSubida } = await supabase.storage.from("capturas-fotos").upload(path, blob, { contentType: "image/jpeg" });
      if (errSubida) { console.error(errSubida); continue; }
      await supabase.from("captura_fotos").insert({ captura_id: capturaId, user_id: usuario.id, foto_path: path, orden: (ordenFotoBase || 0) + i });
    } catch (e) {
      console.error("Error subiendo foto:", e);
    }
  }

  await cargarDatos();
  renderCalendario();
  abrirDia(fecha, new Date(fecha + "T00:00:00"));
}

// Resumen de una entrada del día (siempre visible) — el spot/tipo/horas
// y sus capturas. Editar/añadir abren el formulario compartido de más
// abajo (#zonaFormulario), no se edita en línea sobre este resumen.
async function resumenEntradaHTML(entrada, idx) {
  const { salida, capturas } = entrada;
  const tarjetas = await Promise.all(capturas.map(tarjetaCapturaHTML));
  return `
    <div class="tarjeta-captura" style="margin-top:0; margin-bottom:14px; border:1px solid #1C3F4F;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div class="detalle" style="font-size:12px; color:#9FB8BF; flex:1;">
          📍 ${salida.spot_nombre || "Ubicación actual"}
          ${salida.tipo_salida ? ` · ${etiquetaTipoSalida[salida.tipo_salida] || salida.tipo_salida}` : ""}
          ${horaRangoTexto(salida)}
        </div>
        <div style="display:flex; gap:10px; flex-shrink:0;">
          <button class="editar-entrada" data-idx="${idx}" style="background:none; border:none; color:#9FB8BF; font-size:11px; cursor:pointer; padding:0;">✏️ Editar</button>
          <button class="borrar-entrada" data-idx="${idx}" style="background:none; border:none; color:#E8907A; font-size:11px; cursor:pointer; padding:0;">🗑 Borrar</button>
        </div>
      </div>
      ${salida.notas ? `<p style="font-size:13px; margin-top:8px;">${salida.notas}</p>` : ""}
      ${contextoHTML(salida)}
      <div style="margin-top:14px; font-family:'Inter',sans-serif; font-weight:500; font-size:11px; color:#6C8890;">CAPTURAS (${capturas.length})</div>
      ${tarjetas.join("") || `<p style="font-size:12px; color:#6C8890;">Ninguna todavía.</p>`}
      <button class="secundario anadir-captura" data-idx="${idx}" style="margin-top:10px;">➕ Añadir captura</button>
    </div>
  `;
}

function cancelarFormulario() {
  document.getElementById("zonaFormulario").innerHTML = "";
}

function engancharFormularioSalida(iso, idExistente) {
  document.getElementById("salidaTipo").addEventListener("change", (e) => {
    document.getElementById("salidaSpot").innerHTML = opcionesSpotsPara(e.target.value);
  });
  document.getElementById("btnCancelarSalida").addEventListener("click", cancelarFormulario);
  document.getElementById("btnGuardarSalida").addEventListener("click", () => guardarSalida(iso, idExistente));
}

function mostrarFormularioNuevaEntrada(iso) {
  const zona = document.getElementById("zonaFormulario");
  zona.innerHTML = formularioSalida();
  selectorHoraInicio = crearSelectorHora("ruedaSalidaInicio", null);
  selectorHoraFin = crearSelectorHora("ruedaSalidaFin", null);
  engancharFormularioSalida(iso, null);
  zona.scrollIntoView({ behavior: "smooth", block: "end" });
}

function mostrarFormularioEditarEntrada(iso, salida) {
  const zona = document.getElementById("zonaFormulario");
  zona.innerHTML = formularioSalida();
  document.getElementById("salidaTipo").value = salida.tipo_salida || "costa";
  document.getElementById("salidaSpot").innerHTML = opcionesSpotsPara(document.getElementById("salidaTipo").value);
  document.getElementById("salidaSpot").value = salida.spot_slug || "";
  selectorHoraInicio = crearSelectorHora("ruedaSalidaInicio", salida.hora_inicio ? salida.hora_inicio.slice(0, 5) : null);
  selectorHoraFin = crearSelectorHora("ruedaSalidaFin", salida.hora_fin ? salida.hora_fin.slice(0, 5) : null);
  document.getElementById("salidaNotas").value = salida.notas || "";
  document.getElementById("btnGuardarSalida").textContent = "Guardar cambios";
  engancharFormularioSalida(iso, salida.id);
  zona.scrollIntoView({ behavior: "smooth", block: "end" });
}

function engancharFormularioCaptura(iso, salidaId, idExistente, ordenFotoBase) {
  const especieSel = document.getElementById("capturaEspecie");
  especieSel.addEventListener("change", () => {
    document.getElementById("capturaEspecieOtraBox").style.display = especieSel.value === "Otra" ? "block" : "none";
  });
  const tecnicaSel = document.getElementById("capturaTecnica");
  tecnicaSel.addEventListener("change", () => {
    const conSenuelo = TECNICAS_CON_SENUELO.has(tecnicaSel.value);
    document.getElementById("capturaSenueloBox").style.display = conSenuelo ? "block" : "none";
    document.getElementById("capturaAparejoBox").style.display = conSenuelo ? "none" : "block";
  });
  document.getElementById("btnCancelarCaptura").addEventListener("click", cancelarFormulario);
  document.getElementById("btnGuardarCaptura").addEventListener("click", () => guardarCaptura(salidaId, iso, idExistente, ordenFotoBase));
}

function mostrarFormularioNuevaCaptura(iso, salidaId) {
  const zona = document.getElementById("zonaFormulario");
  zona.innerHTML = formularioCaptura();
  selectorHoraCaptura = crearSelectorHora("ruedaCapturaHora", null);
  engancharFormularioCaptura(iso, salidaId, null, 0);
  zona.scrollIntoView({ behavior: "smooth", block: "end" });
}

async function mostrarFormularioEditarCaptura(iso, salidaId, captura) {
  const zona = document.getElementById("zonaFormulario");
  zona.innerHTML = formularioCaptura();
  const especieConocida = todasLasEspecies().some((e) => e.nombre === captura.especie);
  document.getElementById("capturaEspecie").value = especieConocida ? captura.especie : "Otra";
  if (!especieConocida) {
    document.getElementById("capturaEspecieOtraBox").style.display = "block";
    document.getElementById("capturaEspecieOtra").value = captura.especie;
  }
  selectorHoraCaptura = crearSelectorHora("ruedaCapturaHora", captura.hora ? captura.hora.slice(0, 5) : null);
  document.getElementById("capturaTalla").value = captura.talla_cm ?? "";
  document.getElementById("capturaPeso").value = captura.peso_g ?? "";
  document.getElementById("capturaTecnica").value = captura.tecnica || "";
  const conSenuelo = TECNICAS_CON_SENUELO.has(captura.tecnica || "");
  document.getElementById("capturaSenueloBox").style.display = conSenuelo ? "block" : "none";
  document.getElementById("capturaAparejoBox").style.display = conSenuelo ? "none" : "block";
  if (conSenuelo) document.getElementById("capturaSenuelo").value = captura.senuelo || "";
  else document.getElementById("capturaAparejo").value = captura.aparejo || "";
  document.getElementById("capturaCebo").value = captura.cebo || "";
  document.getElementById("capturaNotas").value = captura.notas || "";
  document.getElementById("btnGuardarCaptura").textContent = "Guardar cambios";
  const { count } = await supabase.from("captura_fotos").select("id", { count: "exact", head: true }).eq("captura_id", captura.id);
  engancharFormularioCaptura(iso, salidaId, captura.id, count || 0);
  zona.scrollIntoView({ behavior: "smooth", block: "end" });
}

async function abrirDia(iso, fechaObj) {
  const panel = document.getElementById("panelDia");
  const tituloEl = document.getElementById("panelDiaFecha");
  const contEl = document.getElementById("panelDiaContenido");
  tituloEl.textContent = fechaObj.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  const entradas = salidasPorFecha[iso] || [];
  const resumenes = await Promise.all(entradas.map((e, idx) => resumenEntradaHTML(e, idx)));
  contEl.innerHTML =
    (resumenes.join("") || `<p style="font-size:12px; color:#9FB8BF;">Todavía no hay nada registrado este día.</p>`) +
    `<div id="zonaFormulario"></div>` +
    `<button class="secundario" id="btnAnadirEntrada">➕ Añadir ${entradas.length ? "otra " : ""}entrada este día</button>`;

  document.getElementById("btnAnadirEntrada").addEventListener("click", () => mostrarFormularioNuevaEntrada(iso));

  contEl.querySelectorAll(".editar-entrada").forEach((btn) => {
    btn.addEventListener("click", () => mostrarFormularioEditarEntrada(iso, entradas[+btn.dataset.idx].salida));
  });
  contEl.querySelectorAll(".borrar-entrada").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("¿Borrar esta entrada y todas sus capturas y fotos?")) return;
      await supabase.from("salidas_pesca").delete().eq("id", entradas[+btn.dataset.idx].salida.id);
      await cargarDatos();
      renderCalendario();
      abrirDia(iso, fechaObj);
    });
  });
  contEl.querySelectorAll(".anadir-captura").forEach((btn) => {
    btn.addEventListener("click", () => mostrarFormularioNuevaCaptura(iso, entradas[+btn.dataset.idx].salida.id));
  });
  contEl.querySelectorAll(".editar-captura").forEach((btn) => {
    btn.addEventListener("click", () => {
      for (const e of entradas) {
        const captura = e.capturas.find((c) => c.id === btn.dataset.id);
        if (captura) { mostrarFormularioEditarCaptura(iso, e.salida.id, captura); break; }
      }
    });
  });
  contEl.querySelectorAll(".borrar-captura").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("¿Borrar esta captura?")) return;
      await supabase.from("capturas").delete().eq("id", btn.dataset.id);
      await cargarDatos();
      renderCalendario();
      abrirDia(iso, fechaObj);
    });
  });

  panel.classList.add("visible");
}

await cargarDatos();
await cargarSpotsUsuario();
await cargarEspeciesComunidad();
renderCalendario();
</script>
