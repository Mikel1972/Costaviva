name: Diagnóstico EUMETSAT rayos (temporal)
on:
  push:
    branches: ["diag/eumetsat"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          npm i --no-save playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          curl -sS "https://view.eumetsat.int/geoserver/mtg_fd/li_afa/ows?service=WMS&version=1.3.0&request=GetLegendGraphic&format=image/png&width=640&height=80&layer=li_afa&style=mtg_li_afa" -o diag/leyenda.png -w "leyenda %{http_code}\n"
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 900, height: 700 } });
          const pedidas = [];
          p.on("request", (r) => { if (r.url().includes("eumetsat")) pedidas.push(r.url()); });
          p.on("console", (m) => console.log("consola:", m.text()));
          await p.goto("file://" + process.cwd() + "/diag/prueba-rayos.html");
          await p.waitForFunction(() => window.listo, null, { timeout: 30000 });
          await p.waitForTimeout(6000);
          console.log("nota:", await p.textContent("#notaRayosSatelite"));
          console.log("peticiones eumetsat:", pedidas.length, "\n", pedidas.slice(0, 2).join("\n "));
          await p.screenshot({ path: "diag/rayos-satelite.png" });
          await b.close();
          JS
          node shot.mjs
          git config user.name diag; git config user.email actions@github.com
          git add diag/*.png && git commit -qm "diag: capturas" && git push -q
