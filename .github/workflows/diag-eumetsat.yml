name: Diagnóstico temporal (estaciones AEMET)
on:
  push:
    branches: ["diag/eumetsat"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for url in "https://costaviva.org/prevision" "https://costaviva.org/prevision?diag=$(date +%s)"; do
            echo "===== $url"
            curl -sS "$url" -o p.json -D h.txt -w "HTTP %{http_code} %{size_download}B %{time_total}s\n"
            grep -i -E "^(age|cf-cache-status|cache-control|date):" h.txt || true
            python3 - <<'PY'
          import json
          d=json.load(open("p.json"))
          e=d.get("estacionesAemet")
          if isinstance(e,dict) and "error" in e:
              print("ERROR estacionesAemet:", e["error"])
          elif isinstance(e,dict):
              print("estaciones con dato:", len(e))
              for k,v in list(e.items())[:5]:
                  print(" ", k, {x:v.get(x) for x in ("pres","prec","ta","actualizado")})
          else:
              print("estacionesAemet:", repr(e)[:300])
          print("spots:", len(d.get("spots",[])), "| boyas:", len(d.get("boyas",[])))
          PY
          done
