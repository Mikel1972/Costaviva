name: Informe diario

# ACTUALIZADO 2026-09-15 (pedido explícito del usuario, "tipo el que
# hacemos en polizas-ai"): añade una síntesis con Claude Code (mismo
# patrón que robot-buscador-fuentes.yml) de TODO el trabajo interno y
# externo de las últimas 24h: la calibración nocturna + las pasadas del
# robot buscador de fuentes (ROBOT.md) más el resultado del smoke test
# (external, ver smoke-test.yml). Sección obligatoria aparte: "Nuevas
# fuentes encontradas, pendientes de validar" — un resumen breve + la
# opinión del propio Claude sobre cada fuente nueva mencionada en las
# últimas 24h, para que el usuario pueda validarlas de un vistazo sin
# tener que leer todo ROBOT.md.
#
# Qué hace, en orden: comprueba salud básica (fuentes externas
# respondiendo, test de autenticación en verde), el conteo real de
# alarmas SOS de las últimas 24h (agregado, nunca filas ni datos
# personales), el resultado del último smoke-test.yml, reúne lo que se
# añadió a ROBOT.md en las últimas 24h y pide a Claude Code que lo
# sintetice. Todo se añade como una fila nueva al mismo Issue "Informe
# diario" de siempre (uno que crece con el tiempo, no uno nuevo cada
# día) — GitHub ya avisa por email de la actividad en Issues que sigues,
# y además se manda un email real aparte (ver el paso final del job).
#
# ACTUALIZADO 2026-09-20 (pedido explícito del usuario): tras notar que
# le llegaba "el informe" varias veces al día, se quitó la publicación
# suelta al Issue que hacían robot-buscador-fuentes.yml (4x/día),
# robot-experiencia-usuario.yml (1x/día) y robot-patrones-uso.yml
# (1x/semana) — los tres siguen escribiendo en ROBOT.md igual que
# siempre, pero ya NO tocan el Issue por su cuenta. Este workflow es
# ahora el ÚNICO que actualiza el Issue "Informe diario", y su síntesis
# se amplió para incluir también lo que aportan esos otros dos robots
# (ver el prompt del paso "Síntesis del día" más abajo), para no perder
# esa información al dejar de publicarse aparte. Además, la hora pasa de
# "siempre 08:00 UTC" a "siempre 08:00 hora de España" (con el cambio de
# hora correctamente gestionado — ver el comentario junto a "on:
# schedule:" más abajo, y el job "decidir_hora" nuevo).
#
# Necesita el secret ANTHROPIC_API_KEY (el mismo que ya usa
# robot-buscador-fuentes.yml) para el paso de síntesis — si falta o no
# tiene crédito, ese paso se salta con continue-on-error y el resto del
# informe (los chequeos deterministas) se publica igual.

on:
  schedule:
    # Corregido 2026-09-19: estaba en "0 8 * * *", justo en la hora exacta —
    # la peor opción posible, porque miles de workflows de GitHub Actions
    # de todo el mundo disparan también justo a esa hora y compiten por
    # runners. Desplazado a un minuto suelto (mismo criterio que ya usan el
    # resto de workflows del repo, ej. "47 8 * * *" en
    # robot-buscador-fuentes.yml) para evitar la hora en punto — aun así
    # las pasadas reales han seguido saliendo con 4-5h de retraso (ver
    # historial de ejecuciones); es un retraso de GitHub Actions a nivel de
    # su propio planificador, no algo que un ajuste de minuto pueda
    # arreglar del todo — el runner puede tardar en asignarse en horas de
    # mucha carga global. No hay garantía de entrega exacta a la hora.
    #
    # Cambiado 2026-09-20 (pedido explícito del usuario) de "siempre a las
    # 08:00 UTC" a "siempre a las 08:00 hora de España" — con el cambio de
    # hora de por medio, eso son horas UTC DISTINTAS según la época del
    # año (06:00 UTC en verano/CEST, 07:00 UTC en invierno/CET), y el cron
    # de GitHub Actions no entiende zonas horarias. Se declaran las DOS
    # horas UTC candidatas (una para cada régimen) y el job "decidir_hora"
    # de abajo, usando la zona horaria real de España (con DST correcto,
    # vía tzdata), decide cuál de las dos pasadas de hoy es la que
    # corresponde de verdad — la otra se salta sin hacer nada (sin gastar
    # ninguna llamada a Claude Code ni tocar el Issue), así nunca salen
    # dos informes el mismo día.
    - cron: "13 6 * * *" # 08:13 hora de España cuando rige CEST (verano)
    - cron: "13 7 * * *" # 08:13 hora de España cuando rige CET (invierno)
  workflow_dispatch: {}

jobs:
  decidir_hora:
    # Job corto y barato (unos segundos, sin llamar a ninguna API de pago)
    # que decide si la pasada programada de ahora mismo es la que
    # corresponde de verdad a las 08:00 hora de España hoy, dado el cambio
    # de hora — ver el comentario junto a "on: schedule:" más arriba. Con
    # workflow_dispatch (prueba manual) se ejecuta siempre, sin filtrar por
    # hora.
    runs-on: ubuntu-latest
    outputs:
      ejecutar: ${{ steps.check.outputs.ejecutar }}
    steps:
      - name: Comprobar si esta pasada corresponde a las 08:00 hora de España hoy
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # +0200 = CEST (verano), +0100 = CET (invierno) — tzdata en el
          # runner de Ubuntu ya conoce las fechas reales de cambio de hora
          # de España, no hace falta calcularlas a mano.
          offset_hoy=$(TZ="Europe/Madrid" date +%z)
          if { [ "$offset_hoy" = "+0200" ] && [ "${{ github.event.schedule }}" = "13 6 * * *" ]; } || \
             { [ "$offset_hoy" = "+0100" ] && [ "${{ github.event.schedule }}" = "13 7 * * *" ]; }; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          fi

  informe:
    needs: decidir_hora
    if: needs.decidir_hora.outputs.ejecutar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
      # Necesario para google-github-actions/auth (Workload Identity
      # Federation, ver el paso "Autenticarse en Google Cloud" más abajo)
      # -- sin esto GitHub no emite el token OIDC que Google Cloud necesita
      # para verificar que la llamada viene de verdad de este repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo (no el shallow clone por defecto) — hace
          # falta para poder contar TODOS los commits del robot autónomo
          # en el paso de KPIs de evolución autónoma, más abajo.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test de autenticación
        id: auth_test
        run: |
          if node test/endpoints-auth.test.js; then
            echo "resultado=✅ en verde" >> "$GITHUB_OUTPUT"
          else
            echo "resultado=❌ FALLO — revisar" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Fuentes externas (vía producción real, nunca inventado)
        id: fuentes
        run: |
          check() {
            local nombre="$1" url="$2"
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            if [ "$code" = "200" ]; then echo "  - $nombre: ✅ ($code)"; else echo "  - $nombre: ❌ ($code)"; fi
          }
          {
            echo "resultado<<EOF"
            check "/prevision (Open-Meteo + boyas Puertos del Estado)" "https://costaviva.org/prevision"
            check "/rayos-imagen (AEMET)" "https://costaviva.org/rayos-imagen"
            check "/webcam/mundaka" "https://costaviva.org/webcam/mundaka"
            check "/luna" "https://costaviva.org/luna?lat=43.4&lon=-2.7"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: SEO -- páginas públicas (comprobación técnica, solo HTTP 200)
        # Añadido 2026-09-19, pedido explícito del usuario ("avísame en
        # los informes diarios") tras publicar las páginas públicas de
        # SEO (índice /mareas, 8 regiones, 105 spots). Esto sigue siendo
        # solo una comprobación de que las páginas responden -- desde el
        # 2026-09-20 los datos reales de indexación/tráfico de Google SÍ
        # existen, ver el paso "Search Console" más abajo (Workload
        # Identity Federation, sin clave descargable -- la política de la
        # organización de Google del usuario lo bloqueaba, ver
        # CLAUDE.md).
        id: seo
        run: |
          check() {
            local nombre="$1" url="$2"
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            if [ "$code" = "200" ]; then echo "  - $nombre: ✅ ($code)"; else echo "  - $nombre: ❌ ($code)"; fi
          }
          {
            echo "resultado<<EOF"
            check "/mareas (índice)" "https://costaviva.org/mareas"
            check "/mareas/region/pais-vasco" "https://costaviva.org/mareas/region/pais-vasco"
            check "/mareas/mundaka (spot de ejemplo)" "https://costaviva.org/mareas/mundaka"
            check "/sitemap.xml" "https://costaviva.org/sitemap.xml"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Autenticarse en Google Cloud (Workload Identity Federation, sin clave)
        # Añadido 2026-09-20, pedido explícito del usuario: datos reales
        # de Search Console en el informe diario. La política de la
        # organización de Google del usuario bloquea la creación de
        # claves JSON descargables para cuentas de servicio
        # (iam.disableServiceAccountKeyCreation) -- en vez de eso, este
        # job pide directamente un token de corta duración a Google Cloud
        # usando su propio token OIDC de GitHub Actions (google-github-
        # actions/auth), sin ningún secreto guardado en ningún sitio.
        # Cuenta de servicio con acceso "Restringido" (solo lectura) dado
        # de alta a mano en Search Console -> Configuración -> Usuarios y
        # permisos.
        id: auth_google
        uses: google-github-actions/auth@v2
        with:
          # OJO: el ID real del proveedor lleva un guion delante
          # ("-github-actions-provider", no "github-actions-provider") --
          # confirmado en real 2026-09-20 comparando contra el "público
          # predeterminado" que la propia consola de Google Cloud mostró
          # al configurarlo. El "nombre visible" en la lista de
          # proveedores SÍ es "github-actions-provider" sin guion -- son
          # dos campos distintos, no te fíes solo del nombre visible.
          workload_identity_provider: "projects/1029831673189/locations/global/workloadIdentityPools/github-actions-pool/providers/-github-actions-provider"
          service_account: "costaviva-search-console-reade@project-5a5d60f4-a099-4065-a23.iam.gserviceaccount.com"
        continue-on-error: true

      - name: Search Console -- rendimiento real de búsqueda (últimos 7 días)
        # Usa google-auth-library (no el paquete googleapis completo,
        # mucho más pesado) para obtener un token de acceso vía las
        # credenciales que dejó el paso anterior, y llama directo a la
        # API REST de Search Console con fetch -- mismo patrón que el
        # resto de endpoints externos de este repo (prevision.js,
        # sos-alerta.js), sin SDK de más.
        id: searchconsole
        run: |
          npm install google-auth-library --no-save
          node -e '
            const { GoogleAuth } = require("google-auth-library");
            const fs = require("fs");
            (async () => {
              try {
                const auth = new GoogleAuth({ scopes: ["https://www.googleapis.com/auth/webmasters.readonly"] });
                const client = await auth.getClient();
                const token = (await client.getAccessToken()).token;
                const cabecera = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
                const sitesResp = await fetch("https://www.googleapis.com/webmasters/v3/sites", { headers: cabecera });
                const sitesData = await sitesResp.json();
                const sitio = sitesData.siteEntry && sitesData.siteEntry[0] && sitesData.siteEntry[0].siteUrl;
                if (!sitio) throw new Error("la cuenta de servicio no ve ninguna propiedad todavía -- revisar el alta en Search Console");
                const haceNDias = (n) => new Date(Date.now() - n * 86400000).toISOString().slice(0, 10);
                async function periodo(desde, hasta, dimensions, rowLimit) {
                  const resp = await fetch(
                    `https://www.googleapis.com/webmasters/v3/sites/${encodeURIComponent(sitio)}/searchAnalytics/query`,
                    { method: "POST", headers: cabecera, body: JSON.stringify({ startDate: desde, endDate: hasta, dimensions, rowLimit }) }
                  );
                  return resp.json();
                }
                const totalesActual = await periodo(haceNDias(7), haceNDias(1), [], 1);
                const totalesAnterior = await periodo(haceNDias(14), haceNDias(8), [], 1);
                const a = (totalesActual.rows || [])[0] || { clicks: 0, impressions: 0, ctr: 0, position: 0 };
                const b = (totalesAnterior.rows || [])[0] || { clicks: 0, impressions: 0, ctr: 0, position: 0 };
                const variacion = (actual, previo) => (previo > 0 ? ` (${actual - previo >= 0 ? "+" : ""}${Math.round(((actual - previo) / previo) * 100)}% vs 7 días antes)` : "");
                const topData = await periodo(haceNDias(7), haceNDias(1), ["query"], 5);
                const top = (topData.rows || []).map((r) => `    - "${r.keys[0]}": ${r.clicks} clics, ${r.impressions} impresiones`);
                const lineas = [
                  `  - Propiedad: ${sitio}`,
                  `  - Últimos 7 días: ${a.clicks} clics${variacion(a.clicks, b.clicks)}, ${a.impressions} impresiones${variacion(a.impressions, b.impressions)}, CTR medio ${(a.ctr * 100).toFixed(1)}%, posición media ${a.position.toFixed(1)}`,
                  top.length
                    ? "  - Top búsquedas (7 días):"
                    : (a.clicks > 0 || a.impressions > 0
                        ? "  - Google no desglosa búsquedas concretas con tan poco volumen (umbral de privacidad)."
                        : "  - Sin búsquedas registradas en los últimos 7 días."),
                  ...top,
                ];
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "resultado<<EOF\n" + lineas.join("\n") + "\nEOF\n");
              } catch (e) {
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "resultado<<EOF\n  - No se pudo consultar Search Console (" + String((e && e.message) || e) + ")\nEOF\n");
              }
            })();
          '
        continue-on-error: true

      - name: Estado de las webcams (camara_estado, tabla pública)
        # Añadido 2026-09-19, pedido explícito del usuario: un informe
        # diario de qué cámaras están fallando (sin señal de verdad, o
        # funcionando solo gracias a una fuente de reserva — ver
        # functions/webcam/[slug].js y ROBOT_REGLAS.md, "Fallos correlados
        # por proveedor"). Lectura pública, sin necesidad de ningún secreto
        # (RLS de camara_estado ya permite select a cualquiera).
        id: camaras
        run: |
          node -e '
            fetch("https://imncbmizxkorotpeisic.supabase.co/rest/v1/camara_estado?select=spot_slug,sin_senal,motivo,fuente_usada,ultima_senal_en&order=spot_slug", {
              headers: {
                apikey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltbmNibWl6eGtvcm90cGVpc2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzczMTQsImV4cCI6MjEwNDUxMzMxNH0.QYvtoHQyFRo1SploGPCUyWZqeHNwy6Qdd6IsAbmvHnc",
              },
            })
              .then((r) => r.json())
              .then((filas) => {
                const caidas = filas.filter((f) => f.sin_senal);
                const conReserva = filas.filter((f) => !f.sin_senal && f.fuente_usada > 0);
                const total = filas.length;
                const funcionanBien = total - caidas.length - conReserva.length;
                // Conteo agregado (pedido explícito del usuario, 2026-09-20:
                // "cuántas cámaras funcionan correctamente y cuántas no") —
                // antes solo se listaban las caídas/con reserva, sin un
                // total con el que compararlas.
                const lineas = [`  - ${funcionanBien} de ${total} cámaras funcionan correctamente (fuente principal, sin fallos).`];
                if (caidas.length || conReserva.length) {
                  for (const f of caidas) lineas.push(`  - ❌ ${f.spot_slug}: sin señal (${f.motivo})`);
                  for (const f of conReserva) lineas.push(`  - ⚠️ ${f.spot_slug}: funcionando con fuente de reserva #${f.fuente_usada} (la principal está fallando)`);
                }
                const fs = require("fs");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "resultado<<EOF\n" + lineas.join("\n") + "\nEOF\n");
              })
              .catch((e) => {
                const fs = require("fs");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "resultado<<EOF\n  - No se pudo comprobar (" + String(e) + ")\nEOF\n");
              });
          '
        continue-on-error: true

      - name: Último smoke test (external, ver smoke-test.yml)
        # Simplificado 2026-09-20, pedido explícito del usuario: antes
        # mostraba el "conclusion" técnico de GitHub Actions tal cual
        # ("success"/"failure") más fecha y enlace -- ahora dice
        # directamente si fue todo bien o si encontró problemas, en
        # lenguaje llano, con el enlace solo cuando hace falta revisar
        # algo.
        id: smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          datos=$(gh run list --workflow=smoke-test.yml --limit 1 --json conclusion,createdAt,url 2>/dev/null || echo "[]")
          conclusion=$(echo "$datos" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const r=JSON.parse(d)[0];console.log(r?(r.conclusion||"en_curso"):"");})')
          fecha=$(echo "$datos" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const r=JSON.parse(d)[0];console.log(r?r.createdAt:"");})')
          url=$(echo "$datos" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const r=JSON.parse(d)[0];console.log(r?r.url:"");})')
          if [ -z "$conclusion" ]; then
            echo "resultado=no se pudo consultar" >> "$GITHUB_OUTPUT"
          elif [ "$conclusion" = "success" ]; then
            echo "resultado=✅ todo bien ($fecha)" >> "$GITHUB_OUTPUT"
          else
            echo "resultado=❌ encontró problemas ($conclusion, $fecha) — revisar: $url" >> "$GITHUB_OUTPUT"
          fi

      - name: Actividad del robot de datos (ROBOT.md)
        id: robot
        run: |
          ultima=$(grep -oE '^### [0-9]{4}-[0-9]{2}-[0-9]{2}' ROBOT.md | tail -1 | sed 's/### //')
          if [ -z "$ultima" ]; then
            echo "resultado=sin entradas fechadas encontradas" >> "$GITHUB_OUTPUT"
          else
            dias=$(( ( $(date +%s) - $(date -d "$ultima" +%s) ) / 86400 ))
            echo "resultado=última pasada: $ultima (hace $dias días)" >> "$GITHUB_OUTPUT"
          fi

      - name: KPIs de evolución autónoma del algoritmo
        # Añadido 2026-09-19, pedido explícito del usuario: cuánto ha
        # crecido el sistema por su cuenta, sin que él tenga que pedirlo
        # cada vez — cifras deterministas, sacadas del propio repo, no de
        # la síntesis de Claude (para que sean exactas y reproducibles).
        # La comparación con el día anterior se calcula en el paso
        # siguiente, parseando la línea equivalente ya guardada en el
        # propio Issue (marcador HTML invisible KPI_AUTONOMO) — así no
        # hace falta ninguna tabla nueva en Supabase para guardar el
        # histórico, el Issue ya lo es.
        id: kpi
        run: |
          commits=$(git log --author="Claude (robot Costaviva)" --oneline | wc -l | tr -d ' ')
          calibracion=$(grep -c . CALIBRACION.jsonl 2>/dev/null || echo 0)
          reglas=$(grep -c '^## ' ROBOT_REGLAS.md || echo 0)
          camaras=$(node -e '
            // No usa require/import (functions/webcam/[slug].js es un módulo
            // ES con "export const" -- no lo carga require de Node en CommonJS)
            // -- extrae el objeto como texto y lo evalúa, mismo truco que ya
            // se usa en otros sitios de este repo para leer WEBCAMS_HLS.
            const fs = require("fs");
            function objetoDesde(ruta, patron) {
              const txt = fs.readFileSync(ruta, "utf8");
              const m = txt.match(patron);
              if (!m) return {};
              const obj = {};
              eval(m[0].replace(/^(export )?const \w+/, "var _o") + "\nObject.assign(obj, _o);");
              return obj;
            }
            const webcams = objetoDesde("functions/webcam/[slug].js", /export const WEBCAMS = \{[\s\S]*?\n\};/);
            const hls = objetoDesde("index.html", /const WEBCAMS_HLS = \{[\s\S]*?\n\};/);
            const spots = new Set([...Object.keys(webcams), ...Object.keys(hls)]);
            console.log(spots.size);
          ' 2>/dev/null || echo "?")
          {
            echo "commits=$commits"
            echo "calibracion=$calibracion"
            echo "reglas=$reglas"
            echo "camaras=$camaras"
          } >> "$GITHUB_OUTPUT"

      - name: Conteo de alarmas SOS (24h, agregado, sin datos personales)
        id: sos
        run: |
          resp=$(curl -sS --max-time 15 \
            "https://imncbmizxkorotpeisic.supabase.co/rest/v1/rpc/contar_alertas_sos_24h" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltbmNibWl6eGtvcm90cGVpc2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzczMTQsImV4cCI6MjEwNDUxMzMxNH0.QYvtoHQyFRo1SploGPCUyWZqeHNwy6Qdd6IsAbmvHnc" \
            -H "Content-Type: application/json" -X POST -d '{}')
          if [[ "$resp" =~ ^[0-9]+$ ]]; then
            echo "resultado=$resp" >> "$GITHUB_OUTPUT"
          else
            echo "resultado=N/D (¿falta aplicar supabase/schema_conteo_sos.sql?)" >> "$GITHUB_OUTPUT"
          fi

      - name: Actividad de marketing (Instagram)
        # Añadido 2026-09-19, pedido explícito del usuario: "des ponerlo
        # como parte de resumen diario. Un apartado que reúna la
        # actividad de los post" -- tras montar el robot de marketing
        # (robot-marketing-instagram.yml + publicar-post-instagram.yml +
        # metricas-instagram.yml). Reúne, siempre de datos ya reales del
        # propio repo (nunca inventado): posts publicados de verdad en
        # las últimas 24h, borradores todavía esperando aprobación
        # (Issues con label "marketing" abiertos), y métricas de alcance/
        # impresiones que se hayan medido en las últimas 24h.
        id: marketing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLICADOS_24H=$(node -e '
            const fs = require("fs");
            const ruta = "scripts/marketing/posts-publicados.jsonl";
            if (!fs.existsSync(ruta)) { console.log(0); process.exit(0); }
            const lineas = fs.readFileSync(ruta, "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l));
            const ahora = Date.now();
            const recientes = lineas.filter((l) => ahora - new Date(l.fecha).getTime() < 24 * 60 * 60 * 1000);
            console.log(recientes.length);
          ')
          PENDIENTES=$(gh issue list --label marketing --state open --json number --jq 'length' 2>/dev/null || echo "?")
          METRICAS_24H=$(node -e '
            const fs = require("fs");
            const ruta = "CALIBRACION.jsonl";
            if (!fs.existsSync(ruta)) { console.log(""); process.exit(0); }
            const lineas = fs.readFileSync(ruta, "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l));
            const ahora = Date.now();
            const recientes = lineas.filter((l) => l.tipo === "instagram_metricas" && ahora - new Date(l.fecha).getTime() < 24 * 60 * 60 * 1000);
            const textos = recientes.map((m) => `    - post ${m.postId}: alcance ${m.alcance ?? "N/D"}, impresiones ${m.impresiones ?? "N/D"}, likes ${m.likes ?? "N/D"}, comentarios ${m.comentarios ?? "N/D"}, guardados ${m.guardados ?? "N/D"}`);
            console.log(textos.join("\n"));
          ')
          {
            echo "resultado<<EOF"
            echo "  - Posts publicados (24h): $PUBLICADOS_24H"
            echo "  - Borradores esperando aprobación: $PENDIENTES"
            if [ -n "$METRICAS_24H" ]; then
              echo "  - Métricas medidas (24h):"
              echo "$METRICAS_24H"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Reunir lo añadido a ROBOT.md en las últimas 24h
        id: robot24h
        run: |
          git log --since="24 hours ago" -p -- ROBOT.md \
            | grep -E '^\+' | grep -vE '^\+\+\+' | sed 's/^\+//' \
            > /tmp/robot-ultimas-24h.txt || true
          echo "lineas=$(wc -l < /tmp/robot-ultimas-24h.txt)" >> "$GITHUB_OUTPUT"

      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Síntesis del día (Claude Code, sesión no interactiva)
        id: sintesis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: |
          SALIDA_CLAUDE=/tmp/claude-salida.log
          rm -f /tmp/informe-sintesis.txt
          claude -p "Eres el redactor del informe diario de Costaviva (repo Costaviva). Tienes en /tmp/robot-ultimas-24h.txt todo lo que se añadió a ROBOT.md en las últimas 24 horas (mezcla de la rutina de calibración nocturna, las distintas pasadas del robot buscador de fuentes — cámaras, mareas/oleaje, corrientes, presión, caudal de ríos, buenas prácticas de otras apps, migración/cría de especies, estudios institucionales tipo DIGIPESCA —, el robot de experiencia de usuario y, los sábados, el robot de patrones de uso; estos dos últimos ya NO publican nada por su cuenta desde el 2026-09-20, así que esta síntesis es la única vía por la que sus hallazgos llegan al dueño del proyecto — no los omitas). Léelo con Read y escribe un informe en español, sin jerga, para el dueño del proyecto (no técnico en detalle), estructurado EXACTAMENTE con estos 4 encabezados markdown, en este orden: (1) '## 🛠 Trabajo interno (calibración y datos)' seguido de 2-4 frases resumiendo qué hizo la calibración nocturna y las pasadas de datos en tiempo real (cámaras/mareas/corrientes/presión/caudal) de las últimas 24h — solo lo que pasó, sin repetir cifras que ya vienen aparte en el informe (SOS, salud de endpoints); dentro de esta sección incluye SIEMPRE una línea aparte empezando por '**Cámaras nuevas encontradas:**' con el número exacto de cámaras nuevas que el robot buscador de fuentes propuso o encontró en las últimas 24h (0 si no hubo ninguna esa pasada), y justo debajo otra línea empezando por '**Términos de búsqueda:**' mencionando qué términos de búsqueda de webcams (el diccionario de tipos de entidad -- surf/ayuntamiento/pesca/puerto/cofradía/etc, ver ROBOT_REGLAS.md) se probaron hoy y en qué población/zona, si el fichero lo indica, y si alguno resultó productivo por primera vez o si algún tipo de entidad nuevo (no listado todavía en el diccionario) apareció como dueño de una cámara nueva -- si el fichero no menciona nada de esto hoy, dilo explícitamente en vez de inventarlo; (2) '## 🧪 Experiencia de usuario y patrones de uso' con una línea aparte empezando por '**Robot de experiencia de usuario:**' resumiendo en 2-4 frases qué probó ese robot hoy (corre a diario) y, MUY IMPORTANTE, si encontró algún bug/hallazgo real cópialo con el mismo nivel de detalle y valores concretos que use ROBOT.md — nunca lo diluyas a una frase vaga tipo 'todo bien' si hay un hallazgo real detrás, y si no encontró nada raro dilo así de claro; y, solo si el fichero trae una entrada del robot de patrones de uso de esta semana (corre solo los sábados, así que entre semana toca decir explícitamente 'no le tocaba pasar esta semana' salvo que hoy sea sábado o domingo justo después), otra línea aparte empezando por '**Robot de patrones de uso:**' con sus propuestas concretas (con los números reales que haya usado para justificarlas) o 'sin propuestas esta semana' si no tuvo ninguna; (3) '## 🔎 Trabajo externo (investigación de contenido)' con 1-2 frases sobre buenas prácticas de otras apps y estudios institucionales de las últimas 24h, y después una línea aparte empezando por '**Robot de especies:**' resumiendo específicamente la pasada de migración/cría de especies (esa pasada solo corre los jueves, así que la mayoría de días toca decir explícitamente 'no le tocaba pasar hoy' en vez de inventar que no hubo novedades) — qué se investigó, si se propuso algo o si no hubo novedades esa vez; (4) '## 🆕 Nuevas fuentes encontradas, pendientes de validar' seguido, para CADA fuente de datos nueva (no ya integrada) que aparezca mencionada en el fichero, de un sub-apartado con el nombre de la fuente, 2-3 frases de resumen de qué es y qué aportaría, y tu propia opinión honesta y breve sobre si los datos parecen sólidos/utilizables para Costaviva o si tienes dudas (cobertura geográfica limitada, fuente sin verificar del todo, requeriría más trabajo, etc) — si no se encontró ninguna fuente nueva en las últimas 24h, escribe solo 'Ninguna fuente nueva en las últimas 24h.' bajo ese encabezado, nada más. Reglas: nunca inventes nada que no esté en el fichero — si el fichero está vacío o no tiene información útil, dilo explícitamente en cada sección en vez de rellenar con generalidades. Sé conciso, no reescribas ROBOT.md entero. Guarda el resultado en /tmp/informe-sintesis.txt (usa Write), nada más — no toques ningún otro fichero del repo, no hagas commits." \
            --dangerously-skip-permissions \
            --allowedTools "Bash,Read,Write,Grep" > "$SALIDA_CLAUDE" 2>&1 || CODIGO=$?
          # Guardarraíl de saldo (añadido 2026-09-25, pedido explícito del
          # usuario: "asegúrate que cuando no hay saldo nada se rompe"). El
          # 2026-09-24 la cuenta de Anthropic se quedó sin saldo y cada
          # workflow lo manifestó de una forma distinta y engañosa: este tipo
          # de pasada moría en ~20s con un rojo indistinguible de un bug real,
          # y las que llevan continue-on-error salían en VERDE sin haber hecho
          # nada. Un problema de facturación no es un fallo del repo: se avisa
          # con ::warning:: nombrando la causa, se deja dicho en el fichero de
          # informe, y se sale en verde para no disparar falsas alarmas.
          CODIGO=${CODIGO:-0}
          cat "$SALIDA_CLAUDE" || true
          if [ "$CODIGO" -ne 0 ] && grep -qiE "credit balance is too low|purchase credits" "$SALIDA_CLAUDE"; then
            echo "::warning::Sin saldo en ANTHROPIC_API_KEY: esta pasada no se ha ejecutado. No es un fallo del repo ni de la tarea — recargar saldo en Plans & Billing de Anthropic."
            echo "_(sin síntesis hoy: la ANTHROPIC_API_KEY se ha quedado sin saldo. El resto del informe de arriba es real y está completo — solo falta el resumen redactado. Nada que arreglar en el repo: recargar saldo en Plans y Billing de Anthropic.)_" > /tmp/informe-sintesis.txt
            {
              echo "### Pasada no ejecutada: sin saldo de API"
              echo "La \`ANTHROPIC_API_KEY\` no tiene saldo, así que esta pasada no ha hecho nada."
              echo "Nada que arreglar en el repo — hay que recargar saldo en Plans & Billing de Anthropic."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$CODIGO"

      - name: Publicar/actualizar el Issue "Informe diario"
        id: publicar
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let sintesis = "_(síntesis no disponible esta pasada — revisar ANTHROPIC_API_KEY/crédito, o mirar ROBOT.md directamente)_";
            try {
              const contenido = fs.readFileSync("/tmp/informe-sintesis.txt", "utf8").trim();
              if (contenido) sintesis = contenido;
            } catch (e) {}

            const titulo = "Informe diario — Costaviva";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "informe-diario", sort: "updated", direction: "desc",
            });
            // Coger el más reciente por LABEL, no por coincidencia exacta de
            // título (bug real 2026-09-19: el título cambió de "Informe
            // diario — Costa Viva" a "— Costaviva" en algún punto y el match
            // exacto abrió un Issue nuevo cada vez en vez de seguir en el
            // mismo — se fragmentó en 3 Issues distintos, #2/#6/#9. El
            // título se sigue usando solo para crear uno nuevo si de verdad
            // no existe ninguno abierto con esta label.
            let issue = issues[0];

            // KPIs de evolución autónoma (pedido explícito del usuario,
            // 2026-09-19): la comparación con el día anterior se saca del
            // marcador invisible <!-- KPI_AUTONOMO ... --> que esta misma
            // línea deja en el Issue cada día -- así no hace falta guardar
            // el histórico en ningún otro sitio, el propio Issue ya lo es.
            const hoy = {
              commits: parseInt("${{ steps.kpi.outputs.commits }}", 10) || 0,
              calibracion: parseInt("${{ steps.kpi.outputs.calibracion }}", 10) || 0,
              reglas: parseInt("${{ steps.kpi.outputs.reglas }}", 10) || 0,
              camaras: parseInt("${{ steps.kpi.outputs.camaras }}", 10) || 0,
            };
            const matchAnterior = issue
              ? issue.body.match(/<!-- KPI_AUTONOMO commits=(\d+) calibracion=(\d+) reglas=(\d+) camaras=(\d+) -->/)
              : null;
            const anterior = matchAnterior
              ? { commits: +matchAnterior[1], calibracion: +matchAnterior[2], reglas: +matchAnterior[3], camaras: +matchAnterior[4] }
              : null;
            const conSigno = (n) => (n > 0 ? `+${n}` : `${n}`);
            const variacion = (clave) => (anterior ? ` (${conSigno(hoy[clave] - anterior[clave])})` : " (primer día con este KPI)");
            const lineaKpi = [
              `- 🤖 Evolución autónoma del algoritmo: ${hoy.commits} commits del robot${variacion("commits")}, `
                + `${hoy.calibracion} puntos de calibración${variacion("calibracion")}, `
                + `${hoy.reglas} reglas en ROBOT_REGLAS.md${variacion("reglas")}, `
                + `${hoy.camaras} cámaras activas${variacion("camaras")}`,
              `<!-- KPI_AUTONOMO commits=${hoy.commits} calibracion=${hoy.calibracion} reglas=${hoy.reglas} camaras=${hoy.camaras} -->`,
            ].join("\n");

            const fecha = new Date().toISOString().slice(0, 10);
            const fila = [
              `### ${fecha}`,
              `- Test de autenticación: ${{ steps.auth_test.outputs.resultado }}`,
              `- Smoke test: ${{ steps.smoke.outputs.resultado }}`,
              `- Robot de datos: ${{ steps.robot.outputs.resultado }}`,
              `- Alarmas SOS (24h): ${{ steps.sos.outputs.resultado }}`,
              `- Fuentes externas:`,
              `${{ steps.fuentes.outputs.resultado }}`,
              `- Cámaras/webcams:`,
              `${{ steps.camaras.outputs.resultado }}`,
              `- SEO (páginas públicas):`,
              `${{ steps.seo.outputs.resultado }}`,
              `- Search Console (rendimiento real de búsqueda):`,
              `${{ steps.searchconsole.outputs.resultado }}`,
              `- Marketing (Instagram):`,
              `${{ steps.marketing.outputs.resultado }}`,
              lineaKpi,
              "",
              sintesis,
              "",
            ].join("\n");

            if (!issue) {
              const creado = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, labels: ["informe-diario"],
                body: "Informe diario de salud + síntesis de trabajo interno/externo de Costaviva — una entrada nueva cada día, la más reciente arriba.\n\n" + fila,
              });
              issue = creado.data;
            } else {
              const cabecera = issue.body.split("\n").slice(0, 2).join("\n");
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: cabecera + "\n\n" + fila + "\n" + issue.body.split("\n").slice(2).join("\n"),
              });
            }

            // Se manda también por email (ver el paso siguiente) además de
            // quedar en el Issue — el Issue solo avisa por email si el
            // usuario está "Watching" ese repo/Issue en GitHub, cosa que no
            // se puede garantizar ni activar desde aquí.
            core.setOutput("texto_email", fila);

      - name: Mandar también por email (Resend, vía functions/informe-diario-email.js)
        # Añadido 2026-09-19 — hallazgo real: en Pólizas.ai este informe
        # llega solo porque se manda por email de verdad (avisar.js/Resend),
        # no por depender de las notificaciones de GitHub. El Issue de
        # arriba se queda como histórico, pero esto es lo que garantiza que
        # de verdad llegue cada día sin que el usuario tenga que configurar
        # nada en GitHub. continue-on-error: un fallo de email nunca debe
        # tumbar el resto del informe (que ya quedó bien en el Issue).
        continue-on-error: true
        env:
          TEXTO: ${{ steps.publicar.outputs.texto_email }}
          CRON_SECRET: ${{ secrets.PRESION_CRON_SECRET }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({texto: process.env.TEXTO}))' > /tmp/informe-email.json
          curl -sS -X POST "https://costaviva.org/informe-diario-email" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --fail-with-body \
            --data-binary @/tmp/informe-email.json
