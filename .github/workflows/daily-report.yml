name: Informe diario

# ACTIVADO 2026-09-12: 06:00 UTC = 08:00 en verano (CEST) / 07:00 en
# invierno (CET) — GitHub Actions no ajusta el cron por DST, así que en
# invierno llegará una hora más pronto. Cambiar el minuto/hora aquí si se
# quiere afinar.
#
# Qué hace: comprueba salud básica (fuentes externas respondiendo,
# ROBOT.md con actividad reciente, test de autenticación en verde) y el
# conteo real de alarmas SOS de las últimas 24h (agregado, nunca filas ni
# datos personales — vía contar_alertas_sos_24h(), ya aplicada en
# producción). Añade una fila a un único Issue "Informe diario" (uno
# crece con el tiempo, no un Issue nuevo cada día) — GitHub ya avisa por
# email de la actividad en Issues que sigues.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  informe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test de autenticación
        id: auth_test
        run: |
          if node test/endpoints-auth.test.js; then
            echo "resultado=✅ en verde" >> "$GITHUB_OUTPUT"
          else
            echo "resultado=❌ FALLO — revisar" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Fuentes externas (vía producción real, nunca inventado)
        id: fuentes
        run: |
          check() {
            local nombre="$1" url="$2"
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            if [ "$code" = "200" ]; then echo "  - $nombre: ✅ ($code)"; else echo "  - $nombre: ❌ ($code)"; fi
          }
          {
            echo "resultado<<EOF"
            check "/prevision (Open-Meteo + boyas Puertos del Estado)" "https://fishnow-59u.pages.dev/prevision"
            check "/rayos-imagen (AEMET)" "https://fishnow-59u.pages.dev/rayos-imagen"
            check "/webcam/mundaka" "https://fishnow-59u.pages.dev/webcam/mundaka"
            check "/luna" "https://fishnow-59u.pages.dev/luna?lat=43.4&lon=-2.7"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Actividad del robot de datos (ROBOT.md)
        id: robot
        run: |
          ultima=$(grep -oE '^### [0-9]{4}-[0-9]{2}-[0-9]{2}' ROBOT.md | tail -1 | sed 's/### //')
          if [ -z "$ultima" ]; then
            echo "resultado=sin entradas fechadas encontradas" >> "$GITHUB_OUTPUT"
          else
            dias=$(( ( $(date +%s) - $(date -d "$ultima" +%s) ) / 86400 ))
            echo "resultado=última pasada: $ultima (hace $dias días)" >> "$GITHUB_OUTPUT"
          fi

      - name: Conteo de alarmas SOS (24h, agregado, sin datos personales)
        id: sos
        run: |
          resp=$(curl -sS --max-time 15 \
            "https://imncbmizxkorotpeisic.supabase.co/rest/v1/rpc/contar_alertas_sos_24h" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltbmNibWl6eGtvcm90cGVpc2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzczMTQsImV4cCI6MjEwNDUxMzMxNH0.QYvtoHQyFRo1SploGPCUyWZqeHNwy6Qdd6IsAbmvHnc" \
            -H "Content-Type: application/json" -X POST -d '{}')
          if [[ "$resp" =~ ^[0-9]+$ ]]; then
            echo "resultado=$resp" >> "$GITHUB_OUTPUT"
          else
            echo "resultado=N/D (¿falta aplicar supabase/schema_conteo_sos.sql?)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar/actualizar el Issue "Informe diario"
        uses: actions/github-script@v7
        with:
          script: |
            const fecha = new Date().toISOString().slice(0, 10);
            const fila = [
              `### ${fecha}`,
              `- Test de autenticación: ${{ steps.auth_test.outputs.resultado }}`,
              `- Robot de datos: ${{ steps.robot.outputs.resultado }}`,
              `- Alarmas SOS (24h): ${{ steps.sos.outputs.resultado }}`,
              `- Fuentes externas:`,
              `${{ steps.fuentes.outputs.resultado }}`,
              "",
            ].join("\n");

            const titulo = "Informe diario — Costa Viva";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "informe-diario",
            });
            let issue = issues.find((i) => i.title === titulo);
            if (!issue) {
              const creado = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, labels: ["informe-diario"],
                body: "Informe diario de salud de Costa Viva — una entrada nueva cada día, la más reciente arriba.\n\n" + fila,
              });
              issue = creado.data;
            } else {
              const cabecera = issue.body.split("\n").slice(0, 2).join("\n");
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: cabecera + "\n\n" + fila + "\n" + issue.body.split("\n").slice(2).join("\n"),
              });
            }
