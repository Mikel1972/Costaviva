name: Aplicar migraciones a producción

# Pedido explícito del usuario (2026-09-25) tras comprobar que una sesión de
# Claude Code NO puede aplicar migraciones: el clasificador de modo
# automático bloquea en duro cualquier comando que escriba en la base de
# datos de producción, y no es un permiso que se pueda aprobar en el chat.
# Hasta ahora eso obligaba a pegar el comando a mano en una terminal.
#
# ESTO ES UN BOTÓN QUE CAMBIA EL ESQUEMA DE PRODUCCIÓN. Se avisó al usuario
# del matiz antes de montarlo: queda disponible para cualquiera con acceso de
# escritura al repo. Por eso lleva tres guardas deliberadas:
#
#   1. SOLO a mano (workflow_dispatch). Nunca un cron, nunca al hacer push.
#      Una migración no debe aplicarse sola jamás.
#   2. HAY QUE ESCRIBIR "aplicar" para que haga nada. Evita el disparo
#      accidental desde el móvil, que es donde más fácil es darle a un botón
#      sin querer.
#   3. ENSEÑA EL PLAN ANTES. El primer paso lista qué migraciones constan
#      aplicadas y cuáles no, y eso queda en el resumen del run aunque luego
#      falle. Si algo no cuadra, se ve antes de tocar nada.
#
# Sobre el desfase de historial: el 2026-09-20 se descubrió que ~13
# migraciones se habían pegado a mano en el SQL Editor y la CLI no se había
# enterado, así que un `db push` a ciegas habría intentado reaplicarlas. Por
# eso el plan se imprime siempre: es la misma comprobación que
# `supabase migration list` hace a mano, delante de los ojos de quien lanza.
# El vigía de esquema (vigia-esquema.yml) avisa a diario de ese mismo
# desfase, así que en condiciones normales no debería aparecer nunca.
#
#   4. SOLO LA MIGRACIÓN APROBADA (incidente del 2026-10-11). Mikel aprobó
#      una migración y `db push` aplicó también otras dos que otros agentes
#      habían fusionado en main sin su sí. Ahora hay que decir cuál
#      (input `migracion`, nombre exacto del fichero) y, antes de aplicar,
#      se comprueba contra supabase_migrations.schema_migrations que lo
#      pendiente es EXACTAMENTE esa. Si hay otra pendiente, falla sin tocar
#      nada y las lista. Lógica en .github/scripts/migraciones.mjs.

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe "aplicar" para confirmar que quieres tocar la base de datos de producción'
        required: true
        default: ""
      migracion:
        description: 'Nombre exacto del fichero aprobado por Mikel (p. ej. 20261011230000_cobro_prueba_14_dias_plan_gratis.sql). Si hay otra pendiente, no se aplica nada.'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la confirmación
        run: |
          if [ "${{ github.event.inputs.confirmacion }}" != "aplicar" ]; then
            echo "::error::Para lanzar esto hay que escribir exactamente 'aplicar' en el campo de confirmación. No se ha tocado nada."
            exit 1
          fi
          # Solo desde main: lo que llega a producción es lo que está
          # fusionado (Mikel1972/comun, estandares/supabase.md D2).
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Las migraciones solo se aplican desde main (lanzado desde $GITHUB_REF). Fusiona primero la PR. No se ha tocado nada."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar que solo está pendiente la migración aprobada
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRACION: ${{ github.event.inputs.migracion }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL (cadena de Connection Pooling)."
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc \
            "select version from supabase_migrations.schema_migrations order by version" > /tmp/aplicadas.txt
          if node .github/scripts/migraciones.mjs pendientes "$MIGRACION" /tmp/aplicadas.txt | tee /tmp/filtro.txt; then
            resultado="Se aplica solo la aprobada"
          else
            resultado="NO se aplica nada"
          fi
          {
            echo "### Filtro de la migración aprobada: $resultado"
            echo '```'
            cat /tmp/filtro.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$resultado" = "Se aplica solo la aprobada" ]

      - name: Enseñar el plan (qué está aplicado y qué no)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL (cadena de Connection Pooling)."
            exit 1
          fi
          echo "Migraciones en el repo:"
          ls supabase/migrations/*.sql | xargs -n1 basename

          echo ""
          echo "Estado según la CLI (local vs producción):"
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee /tmp/plan.txt

          {
            echo "### Plan de migración"
            echo '```'
            cat /tmp/plan.txt
            echo '```'
            echo "Si alguna aparece en local pero no en remoto, es la que se va a aplicar."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Aplicar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # --include-all: aplica todas las pendientes, no solo la última. El
          # paso anterior ya garantiza que la única pendiente es la aprobada.
          # --yes: sin preguntar, porque la confirmación ya se pidió arriba y
          # aquí no hay nadie para contestar.
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Confirmar el estado final
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Se vuelve a listar DESPUÉS de aplicar: es la prueba de que lo que
          # se pretendía aplicar está aplicado de verdad, no solo que el
          # comando no dio error.
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee /tmp/final.txt
          {
            echo "### Estado final"
            echo '```'
            cat /tmp/final.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
