name: Escaneo de seguridad (OWASP ZAP baseline)

# ACTIVADO 2026-09-12, probado a mano primero (pasó en verde, abrió el
# Issue "ZAP Scan Baseline Report"). Semanal, lunes 04:30 UTC — antes que
# el resto de rutinas diarias, para no competir por runners.
#
# Modo baseline = pasivo (spidering + comprobaciones de cabeceras/cookies/
# CSP/rutas expuestas), NUNCA "full scan" con payloads activos contra
# producción real. Objetivo: costaviva.org (dominio propio, verificado
# y apuntando al mismo despliegue de Cloudflare Pages desde 2026-09-13
# — antes era fishnow-59u.pages.dev, que sigue funcionando igual pero
# ya no es la URL canónica).
#
# Aviso de hallazgos: la propia action abre/actualiza un Issue en este
# repo con el resultado — GitHub ya te avisa por email de los Issues
# nuevos en tu propio repo (Settings > Notifications), así que esto
# funciona sin decidir todavía un destinatario/mecanismo de email aparte.

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch: {}

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://costaviva.org/"
          cmd_options: "-a" # incluye también las páginas enlazadas (alarma, diario, login)
          allow_issue_writing: true
          fail_action: false # no bloquea el workflow por hallazgos; el Issue es el aviso
