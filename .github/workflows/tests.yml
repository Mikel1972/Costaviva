name: Tests

# Tests de lógica pura: sin red, sin Supabase, sin secretos. Corren en
# segundos y por eso pueden correr en CADA push y en cada pull request, que
# es donde está su valor — una regresión se ve antes de mergear, no al día
# siguiente en el informe.
#
# Deliberadamente NO incluye test/endpoints-auth.test.js: ese sí habla con
# Supabase y con producción, necesita secretos y tarda. Tiene su propio
# workflow diario (auth-test.yml) y ahí debe quedarse — mezclarlos haría que
# un fallo de red tumbara el check de cada commit, y un check que falla por
# motivos ajenos se acaba ignorando.
#
# Añadido 2026-09-25, propuesto por el robot de mejores prácticas: Pólizas.ai
# ya tenía este patrón (tests.yml allí) y Costaviva no tenía ningún test
# corriendo en CI, solo el diario contra producción.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tests de lógica pura
        run: node --test test/rutas-publicas.test.js test/webcam-ipcamlive.test.js test/rayos-cerca.test.js test/estaciones-respaldo.test.js test/uso-claude.test.js test/secreto.test.js test/csp.test.js test/ventana-actividad.test.js test/especie-post.test.js test/open-meteo.test.js test/caudal-cantabrico.test.js test/modalidades.test.js test/fuentes-gratuitas.test.js test/indice-pesca-v2.test.js test/oleaje-costero.test.js test/observaciones.test.js test/rayos-resumen.test.js test/lluvia-animada.test.js test/camaras-externas.test.js test/nivel-indice.test.js test/pieza-datos.test.js test/batimetria.test.js test/invitaciones.test.js test/oleaje-camaras.test.js test/mapa-base.test.js test/tipo-fondo.test.js test/fuentes-fase2.test.js test/selector-fondo.test.js test/creditos-mapa.test.js test/sos-whatsapp.test.js test/tarjetas-mapa.test.js test/camara-referencia.test.js test/agenda-contactos.test.js test/robots-sin-api.test.js test/seo-paginas.test.js test/seo-extra.test.js test/rendimiento-publico.test.js test/captacion.test.js test/calendario-marketing.test.js test/aprendizaje.test.js test/frentes.test.js test/corriente.test.js test/plegar-tarjeta.test.js test/frentes-indice.test.js
