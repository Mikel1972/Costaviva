name: KPIs de facturación

# KPIs de facturación (CLAUDE.md, "KPIs de facturación"). SIN IA.
# Los KPIs son PRIVADOS (decisión de Mikel, 2026-10-11): este repo es público,
# así que aquí solo vive el código. Los datos y el informe van a
# Mikel1972/comun, carpeta kpis/costaviva/, con APRENDIZAJE_TOKEN (Contents RW
# en comun).
#   - Cada día: scripts/kpis/recoger.mjs lee producción SOLO en lectura
#     (Supabase por REST con la service_role; Stripe con STRIPE_SECRET_KEY, la
#     clave restringida única de Costaviva, solo con GET) y AÑADE a
#     kpis/costaviva/historico.jsonl de comun una línea por día cerrado.
#   - Los lunes (o a mano con "informe"): scripts/kpis/informe.mjs escribe en
#     esa carpeta KPIS.md, mrr.svg y resumen.json.
# Sin clave de Stripe no falla: avisa y saca el MRR de public.suscripciones a
# precio de lista. Sin la service_role o sin APRENDIZAJE_TOKEN, rojo.
# Pausa: variable de repositorio AUTOMATION_PAUSED=true.

on:
  schedule:
    - cron: "37 5 * * *" # diario, ~07:37 en Madrid; los lunes además el informe
  workflow_dispatch:
    inputs:
      informe:
        description: "Generar también KPIS.md (normalmente solo los lunes)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kpis
  cancel-in-progress: false

jobs:
  kpis:
    if: ${{ vars.AUTOMATION_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KPIS_DIR: comun/kpis/costaviva
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar el token de comun
        env:
          TOKEN: ${{ secrets.APRENDIZAJE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Falta APRENDIZAJE_TOKEN: los KPIs se guardan en comun (privado)."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: Mikel1972/comun
          token: ${{ secrets.APRENDIZAJE_TOKEN }}
          path: comun
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recoger las métricas del día (solo lectura)
        env:
          SUPABASE_URL: https://imncbmizxkorotpeisic.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_KPI_KEY: ${{ secrets.STRIPE_KPI_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
        run: node scripts/kpis/recoger.mjs
      - name: Informe de los lunes (KPIS.md y gráfico, en comun)
        run: |
          # El cron es diario: el informe solo los lunes en hora de España
          # (a propósito: el negocio va en Madrid), salvo lanzado a mano.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Madrid date +%u)" != "1" ]; then
            echo "Hoy no es lunes: sin informe."; exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.informe }}" != "true" ]; then
            echo "Sin informe (input)."; exit 0
          fi
          node scripts/kpis/informe.mjs
      - name: Guardar en comun
        working-directory: comun
        run: |
          git config user.name "Costaviva (KPIs)"
          git config user.email "noreply@anthropic.com"
          git add kpis/costaviva/
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -qm "KPIs de Costaviva: métricas del día [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::error::No se pudieron subir los KPIs a comun"; exit 1
