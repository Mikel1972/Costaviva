name: Abrir PR de las propuestas de diseño del robot

# Pedido explícito del usuario (2026-09-28): el robot de SEO y diseño
# (rutina en la nube "Costaviva - Robot de SEO y diseño") aplica solo las
# mejoras de SEO invisibles, pero los cambios de diseño VISIBLES tienen que
# pasar por un PR que el usuario apruebe. Las rutinas no pueden abrir PR
# (no tienen gh ni el conector de GitHub), así que suben una rama
# robot/diseno-AAAA-MM-DD-<tema> y este workflow abre el PR por ellas. Sin
# IA: solo gh.
#
# Cloudflare Pages genera un preview de cada rama; el enlace aparece en el
# propio PR (comentario del bot de Cloudflare) para ver el cambio antes de
# aprobarlo.

on:
  push:
    branches:
      - "robot/diseno-**"
      # Fichas de especies (assets/datos/especies.json), rutina de los jueves
      # (ver ROBOT_REGLAS.md, "Fichas de especies"). Añadido 2026-10-07.
      - "robot/especies-**"
      # Etiquetas de olas de Claude mirando las cámaras (rutina diaria, ver
      # scripts/oleaje-camaras/RUTINA_ETIQUETADO.md). Añadido 2026-10-08.
      - "robot/etiquetas-olas-**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  abrir-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abrir el PR si no existe ya
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: ${{ github.ref_name }}
        run: |
          if [ -n "$(gh pr list --head "$RAMA" --state open --json number --jq '.[0].number')" ]; then
            echo "Ya hay un PR abierto para $RAMA."
            exit 0
          fi
          TITULO=$(git log -1 --format=%s)
          case "$RAMA" in
            robot/especies-*-factores) TIPO="Factores"; INTRO="Propuestas de la rutina de los viernes: reglas o pesos del índice de pesca sacados de estudios (cada uno con su fuente), contrastes con tus reglas locales (confirma/refuta/matiza, sin cambiarlas) y, si los hay, concursos con resultados reutilizables. Revisa la evidencia y la confianza de cada regla antes de aprobar." ;;
            robot/etiquetas-olas-*) TIPO="Etiquetas de olas"; INTRO="Etiquetas de la rutina diaria de Claude mirando las cámaras (datos-robots/oleaje-camaras/etiquetas-claude.jsonl) y la calibración recalculada. Revisa qué cámaras pasan a sustituir al modelo en el panel y las cámaras movidas o ROIs que la rutina haya visto mal." ;;
            robot/especies-*) TIPO="Especies"; INTRO="Actualización de las fichas de especies (assets/datos/especies.json) de la rutina de los jueves. Revisa sobre todo las tallas y vedas: cada una debe llevar su URL oficial." ;;
            *) TIPO="Diseño"; INTRO="Propuesta de diseño del robot de SEO y diseño (rutina en la nube)." ;;
          esac
          {
            echo "$INTRO"
            echo
            echo "**Nada de esto llega a costaviva.org hasta que apruebes y mergees este PR.**"
            echo "Para verlo antes: abre el enlace de *Preview* del comentario de Cloudflare de más abajo (tarda un par de minutos)."
            echo
            echo "## Qué cambia y por qué"
            echo
            git log origin/main..HEAD --format='%B' | sed 's/^Co-Authored-By.*//; s/^Claude-Session.*//'
          } > /tmp/cuerpo.md
          # GitHub solo deja a un workflow abrir PR si está activado Settings →
          # Actions → General → "Allow GitHub Actions to create and approve
          # pull requests". Si no lo está, se abre un Issue con el enlace para
          # crear el PR con un clic, en vez de perder la propuesta en silencio.
          if ! gh pr create --base main --head "$RAMA" --title "$TIPO (robot): $TITULO" --body-file /tmp/cuerpo.md; then
            {
              echo "Un robot ha subido la rama \`$RAMA\`, pero este workflow no ha podido abrir el PR (falta activar Settings → Actions → General → *Allow GitHub Actions to create and approve pull requests*)."
              echo
              echo "Créalo con un clic: https://github.com/${{ github.repository }}/compare/main...$RAMA?expand=1"
              echo
              cat /tmp/cuerpo.md
            } > /tmp/issue.md
            gh issue create --title "Propuesta del robot ($TIPO): $TITULO" --body-file /tmp/issue.md
          fi
