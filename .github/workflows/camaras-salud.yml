name: Salud de las webcams

# Pedido explícito del usuario (2026-09-18): un punto rojo automático
# cuando se detecta que una webcam no está devolviendo imagen real. Ver
# supabase/migrations/20260918120000_camara_estado.sql y
# scripts/camaras/comprobar-camaras.mjs para el razonamiento completo
# (por qué no se distingue "de noche" de "cámara caída" — decisión
# explícita del usuario, no un descuido).
#
# Cada 30 min: coincide con el max-age de la caché de /prevision
# (functions/prevision.js) y con el intervalo real de refresco del
# frontend (cada hora, ver VIGENCIA_MAX_MS en index.html) — comprobar más
# a menudo no adelantaría nada porque el cliente no volvería a leerlo
# antes igualmente. A diferencia de robot-buscador-fuentes.yml (que sí se
# recortó por gasto real de la API de Claude, ver CLAUDE.md 2026-09-16),
# esto es solo `sharp`/`ffmpeg` en el runner — no llama a ningún LLM, así
# que subir la frecuencia no tiene el mismo coste.
#
# Necesita el secret PRESION_CRON_SECRET (Settings → Secrets → Actions de
# este repo) — el MISMO que ya usan presion-historico.yml y turbidez.yml,
# porque /registrar-estado-camaras comprueba la misma variable de entorno
# CRON_SECRET en Cloudflare Pages. No hace falta crear un secreto nuevo.
#
# Probar a mano (workflow_dispatch) antes de fiarse del schedule, mismo
# criterio que el resto de rutinas programadas de este repo — esta en
# concreto nunca se ha corrido de verdad todavía.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Desde 2026-09-28 también la lanza pg_cron cada 30 min vía la API de GitHub
# (supabase/migrations/20260928160000_programador_workflows_github.sql),
# porque GitHub solo cumplía el schedule unas 7 veces al día. El schedule se
# queda de respaldo; esto evita que dos ejecuciones se solapen (la segunda
# espera a que acabe la primera, no se cancela nada).
# contents: write solo para el volcado diario de datos-robots/camaras-estado.json.
permissions:
  contents: write

concurrency:
  group: camaras-salud
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar/instalar ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Instalar dependencias del script
        working-directory: scripts/camaras
        run: npm ci --no-audit --no-fund

      - name: Comprobar cámaras y guardar
        working-directory: scripts/camaras
        env:
          CRON_SECRET: ${{ secrets.PRESION_CRON_SECRET }}
        run: node comprobar-camaras.mjs

      # Una vez al día (la primera pasada desde las 03:00 UTC) deja el estado de
      # las cámaras en el repo para la rutina "Cámaras caídas", que corre en la
      # nube con la suscripción y no tiene acceso a Supabase (Mikel1972/comun,
      # claude-api.md "Dónde va cada cosa"). Sin IA. camara_estado es pública:
      # el estado de unas webcams, no datos de nadie.
      - name: Volcar el estado de las cámaras para la rutina
        env:
          SUPABASE_URL: https://imncbmizxkorotpeisic.supabase.co
        run: |
          F=datos-robots/camaras-estado.json
          HOY=$(date -u +%F)
          if [ "$(date -u +%H)" -lt 3 ]; then echo "Antes de las 03:00 UTC: no toca."; exit 0; fi
          if [ -f "$F" ] && grep -q "\"generado_en\": *\"$HOY" "$F"; then echo "Ya volcado hoy."; exit 0; fi
          KEY=$(grep -oE "eyJ[A-Za-z0-9_.-]{40,}" scripts/camaras/comprobar-camaras.mjs | head -1)
          curl -sSf -G "$SUPABASE_URL/rest/v1/camara_estado" \
            --data-urlencode "select=spot_slug,sin_senal,motivo,fallos_seguidos,ultima_senal_en,fuente_usada" \
            --data-urlencode "order=fallos_seguidos.desc" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /tmp/camaras.json
          mkdir -p datos-robots
          node -e '
            const fs = require("fs");
            const camaras = JSON.parse(fs.readFileSync("/tmp/camaras.json", "utf8"));
            if (!Array.isArray(camaras)) throw new Error("respuesta inesperada");
            fs.writeFileSync(process.argv[1], JSON.stringify({ generado_en: new Date().toISOString(), fuente: "camara_estado", camaras }, null, 1) + "\n");
          ' "$F"
          git config user.name "Costaviva (volcado)"
          git config user.email "noreply@anthropic.com"
          git add "$F"
          git commit -qm "Estado de las cámaras para la rutina [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::warning::No se pudo subir $F"; exit 1
