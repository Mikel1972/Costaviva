name: Robot de patrones de uso

# Pedido explícito del usuario (2026-09-17), mismo día que se montó la
# analítica de uso (eventos_uso, ver CLAUDE.md y la migración
# 20260917104826_eventos_uso.sql): "debiera haber un robot analizando
# patrones de uso, información añadida, etc... para proponer cambios y
# mejoras" — para (1) entender qué usa de verdad la gente y (2) poder
# rediseñar/quitar lo que nadie usa, en vez de decidir a ojo.
#
# Semanal (no diario) a propósito: con pocos usuarios, los patrones de
# una sola semana ya dicen más que los de un día, y evita gastar cuota
# de API en pasadas sin nada nuevo que aportar — mismo criterio de
# ahorro que llevó a mover varias áreas de robot-buscador-fuentes.yml de
# diario a semanal el 2026-09-16.
#
# Usa SUPABASE_SERVICE_ROLE_KEY (secret ya compartido con
# smoke-test.yml/auth-test.yml) para leer eventos_uso/capturas/
# salidas_pesca directamente por REST, bypassando RLS — las funciones
# admin_resumen_eventos_uso()/admin_eventos_uso_usuario() no sirven aquí
# porque comprueban es_admin() vía auth.email(), que no existe en un
# token de service_role ni en ningún token de este runner.
#
# SOLO PROPONE, NUNCA IMPLEMENTA — esto es doblemente cierto aquí
# que en el resto de robots (ver ROBOT_REGLAS.md): decidir qué función
# quitar o rediseñar es una decisión de producto, nunca automática. Todo
# lo que encuentre va a ROBOT.md como propuesta a revisar a mano.
#
# IMPORTANTE — probar a mano (workflow_dispatch) antes de fiarse del
# schedule, mismo criterio que el resto de rutinas de este repo.

on:
  schedule:
    - cron: "12 9 * * 6" # semanal, sábado
  workflow_dispatch: {}

jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configurar git para el commit del robot
        run: |
          git config user.name "Claude (robot Costaviva)"
          git config user.email "noreply@anthropic.com"

      - name: Ejecutar el robot de patrones de uso (Claude Code, sesión no interactiva)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          rm -f /tmp/robot-informe.txt
          claude -p "Eres el robot de patrones de uso de Costaviva (repo Costaviva), pasada semanal. Objetivo, pedido explícito del usuario: entender qué usa de verdad la gente de la app para poder ofrecer mejor servicio y para decidir qué rediseñar/simplificar/quitar en base a uso real, nunca a intuición. Sigue ESTRICTAMENTE ROBOT_REGLAS.md antes de tocar nada: nunca inventes un dato; si existe un fichero ROBOT_PAUSADO en la raíz del repo, no escribas nada, solo lee y para ahí. REGLA ESPECIAL PARA ESTE ROBOT, más estricta que las demás: NUNCA implementes ningún cambio de producto/UI/frontend por tu cuenta, bajo ningún argumento — tu único trabajo es proponer en ROBOT.md, la decisión es siempre del usuario. No tienes Edit ni Write sobre ficheros del repo salvo ROBOT.md al final, como se indica abajo. Cómo consultar los datos: usa Bash con curl contra \$SUPABASE_URL (https://imncbmizxkorotpeisic.supabase.co), cabeceras 'apikey: \$SUPABASE_SERVICE_ROLE_KEY' y 'Authorization: Bearer \$SUPABASE_SERVICE_ROLE_KEY' (bypassa RLS, target de LECTURA únicamente, nunca escribas ni borres nada con esta key) — por ejemplo: /rest/v1/eventos_uso?select=tipo,user_id,creado_en, /rest/v1/capturas?select=especie,tecnica,creado_en, /rest/v1/salidas_pesca?select=tipo_salida,spot_slug,creado_en, /rest/v1/spots_favoritos?select=spot_slug,spot_usuario_id, /rest/v1/perfiles?select=id,creado_en,aprobado (cuenta cuántos hay, no leas nada más sensible de esa tabla). Usa jq o node para agregar (cuántos eventos de cada tipo, cuántos usuarios DISTINTOS por tipo, especies/técnicas más comunes, spots más visitados/favoritos, cuántos perfiles llevan más de 7 días sin ninguna fila en eventos_uso ni capturas ni salidas_pesca — señal de abandono real). Compara con qué funciones existen de verdad en el código (Grep sobre index.html/diario.html/alarma.html/grupos.html/suscripcion.html si hace falta ver qué hace cada tipo de evento) antes de proponer nada, para no proponer quitar algo que ya no existe o mal etiquetar una función. Si eventos_uso tiene muy pocos datos todavía (es nuevo, se añadió el 2026-09-17), dilo explícitamente y no inventes patrones de una muestra minúscula — en ese caso limítate a confirmar que los datos que hay tienen pinta correcta y que la recogida funciona. Añade siempre una entrada nueva fechada (fecha y hora UTC de hoy) a ROBOT.md (nueva sección 'Robot de patrones de uso' si no existe todavía) con: qué datos miraste (números concretos, nunca vagos), 2-4 propuestas concretas y justificadas con esos números (ej. 'la capa de batimetría la ha usado 1 de 40 usuarios activos en 4 semanas, considerar quitarla del menú principal y dejarla en un submenú avanzado' — nunca una propuesta sin el dato real detrás), y qué NO te dio tiempo a mirar esta pasada. Si de verdad no hay nada que proponer (muy pronto, datos insuficientes, todo parece sano), dilo así de claro, no rellenes con propuestas débiles. Haz commit y push tú mismo a main con git SOLO de ese cambio a ROBOT.md (el remoto y las credenciales ya están configurados en este runner) — nunca cambies ningún otro fichero del repo. Al terminar, escribe un resumen de 2 a 4 frases en español, sin jerga, de qué encontraste en esta pasada en el fichero /tmp/robot-informe.txt — se usa para el informe diario del repo." \
            --dangerously-skip-permissions \
            --model claude-sonnet-5 \
            --max-turns 30 \
            --allowedTools "Bash,Read,Write,Grep,Glob"

      - name: Publicar el resumen en el Issue "Informe diario"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let resumen = "⚠️ El robot no dejó resumen esta pasada (revisar el log del workflow).";
            try { resumen = fs.readFileSync("/tmp/robot-informe.txt", "utf8").trim() || resumen; } catch (e) {}

            const ahora = new Date().toISOString().replace("T", " ").slice(0, 16) + " UTC";
            const fila = [
              `#### 📊 Robot de patrones de uso — ${ahora}`,
              resumen,
              "",
            ].join("\n");

            const titulo = "Informe diario — Costaviva";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "informe-diario",
            });
            let issue = issues.find((i) => i.title === titulo);
            if (!issue) {
              const creado = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, labels: ["informe-diario"],
                body: "Informe diario de salud de Costaviva — una entrada nueva cada día, la más reciente arriba.\n\n" + fila,
              });
              issue = creado.data;
            } else {
              const cabecera = issue.body.split("\n").slice(0, 2).join("\n");
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: cabecera + "\n\n" + fila + "\n" + issue.body.split("\n").slice(2).join("\n"),
              });
            }
