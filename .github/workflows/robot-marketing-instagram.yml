name: Robot de marketing — Instagram

# Pedido explícito del usuario (2026-09-19): marketing orgánico en
# Instagram para captar usuarios, sin anuncios de pago. Desde el 2026-10-08
# genera post (1080x1350) y story (1080x1920) en estilo "Amanecer", sin
# fotos de webcams de terceros. Los reels van en robot-reel-instagram.yml. Alterna
# condiciones reales de un spot (lunes/viernes) y especies de temporada
# (miércoles) -- ver scripts/marketing/generar-post-instagram.mjs para el
# criterio exacto, siempre a partir de datos ya reales del propio repo,
# nunca inventados.
#
# Este workflow NUNCA publica nada en Instagram por su cuenta -- solo crea
# un borrador (contenedor de la Content Publishing API, sin publicar) y
# abre un Issue para que el usuario decida. La publicación real es un
# segundo workflow aparte: publicar-post-instagram.yml (a mano) o, desde el
# 2026-10-11, publicar-con-veto.yml, que la publica sola a su hora si Mikel
# no la veta en las 12 h de aviso (y solo con PUBLICACION_AUTOMATICA=true).
# Sustituye a la regla anterior ("nada sin su publica").
#
# Necesita los secrets/variables ya configurados en este repo (Settings →
# Secrets and variables → Actions):
#   - META_PAGE_ACCESS_TOKEN (secret) -- token de la Página de Facebook
#     Costaviva, de larga duración, con acceso a la cuenta de Instagram
#     Business vinculada.
#   - META_IG_BUSINESS_ACCOUNT_ID (variable, no secreta) -- id de la
#     cuenta de Instagram Business.
#
# Probar a mano (workflow_dispatch) antes de fiarse del schedule, mismo
# criterio que el resto de rutinas programadas de este repo.

# Calendario (2026-10-09, fase de captación): la víspera por la tarde se
# prepara el post del día siguiente (martes especie, jueves función de la
# app, viernes condiciones; scripts/marketing/calendario.mjs) para que Mikel
# solo tenga que aprobarlo por la mañana, en Instagram y en Facebook. Lo
# lanza pg_cron (migración 20261009130000_programador_marketing.sql, lunes,
# miércoles y jueves 17:30 UTC); este `schedule:` es el respaldo una hora
# después: si la pieza ya está hecha, no hace nada (calendario-estado.json).
#
# Nueva Zelanda (2026-10-11, pedido de Mikel): posts en inglés para las 07:00
# de NZ (martes especie, viernes condiciones; calendario.mjs, mercado "nz").
# Se preparan la víspera por la tarde de NZ: pg_cron a las 05:40 UTC (L/J,
# 20261012090000_programador_marketing_nz.sql, lanzar_marketing_nz() manda
# mercado=nz) y este segundo `schedule:` de respaldo a las 06:40 UTC. A mano:
# input `mercado`.
on:
  schedule:
    - cron: "40 18 * * 1,3,4"
    - cron: "40 6 * * 1,4"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha de publicación AAAA-MM-DD (vacío = mañana)"
        required: false
        type: string
      tipo:
        description: "Forzar tipo: condiciones, especie, funcion, diario, grupos o alarma (vacío = el del calendario; en NZ solo condiciones o especie)"
        required: false
        type: string
      mercado:
        description: "es (España, en español) o nz (Nueva Zelanda, en inglés, 07:00 hora de NZ)"
        required: false
        default: "es"
        type: choice
        options: ["es", "nz"]

permissions:
  contents: write
  issues: write
  # Para lanzar el robot de reels (vídeo de peces, ver abajo).
  actions: write

# Mismo grupo que el robot de reels: los dos comitean y suben a main.
concurrency:
  group: robot-marketing-instagram
  cancel-in-progress: false

jobs:
  generar-y-proponer:
    # Interruptor de pausa (comun pruebas-y-alertas.md P8): con la variable de
    # repositorio AUTOMATION_PAUSED=true este job no se ejecuta.
    if: ${{ vars.AUTOMATION_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Desde el 2026-10-29 todas las piezas de España van en vídeo, el reel de
      # peces (Mikel: "con el formato vídeo [...] como el que publicamos al
      # principio [...] hazlo así a partir de hoy"). Si mañana toca post en
      # España y no se ha forzado un tipo, se lanza el robot de reels con
      # tipo "peces" para esa fecha y este no genera nada. El robot de reels
      # no repite (calendario-estado.json), así que el respaldo de una hora
      # después no duplica. NZ y los tipos forzados a mano siguen como antes.
      - name: España en vídeo (reel de peces)
        id: video
        env:
          GH_TOKEN: ${{ github.token }}
          FECHA_PIEZA: ${{ inputs.fecha }}
          TIPO_PIEZA: ${{ inputs.tipo }}
          MERCADO: ${{ inputs.mercado || (github.event.schedule == '40 6 * * 1,4' && 'nz') || 'es' }}
        run: |
          if [ "$MERCADO" != "es" ] || [ -n "$TIPO_PIEZA" ]; then exit 0; fi
          FECHA=$(node --input-type=module -e '
            import { hoyMadrid, sumarDias, huecoDe } from "./scripts/marketing/calendario.mjs";
            const f = /^\d{4}-\d{2}-\d{2}$/.test(process.env.FECHA_PIEZA || "") ? process.env.FECHA_PIEZA : sumarDias(hoyMadrid(), 1);
            if (huecoDe(f, "post", "es")) console.log(f);
          ')
          if [ -z "$FECHA" ]; then echo "Mañana no toca post en España."; exit 0; fi
          gh workflow run robot-reel-instagram.yml --ref "${GITHUB_REF_NAME}" -f fecha="$FECHA" -f tipo=peces -f mercado=es
          echo "lanzado=true" >> "$GITHUB_OUTPUT"
          echo "Pieza del $FECHA en vídeo: lanzado el robot de reels (tipo peces)." >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar dependencias del script
        if: steps.video.outputs.lanzado != 'true'
        working-directory: scripts/marketing
        run: npm ci --no-audit --no-fund

      # Las piezas se pintan con Chromium (plantillas/pieza.html, estilo
      # "Amanecer", 2026-10-08). Las letras van dentro del repo
      # (assets/fonts); los emoji solo en el texto del post.
      - name: Instalar Chromium para Playwright
        if: steps.video.outputs.lanzado != 'true'
        working-directory: scripts/marketing
        run: npx playwright install --with-deps chromium

      - name: Generar imagen y texto del post
        id: generar
        if: steps.video.outputs.lanzado != 'true'
        working-directory: scripts/marketing
        env:
          FECHA_PIEZA: ${{ inputs.fecha }}
          TIPO_PIEZA: ${{ inputs.tipo }}
          MERCADO: ${{ inputs.mercado || (github.event.schedule == '40 6 * * 1,4' && 'nz') || 'es' }}
        run: node generar-post-instagram.mjs

      - name: Comitear y subir la imagen generada
        if: steps.generar.outputs.generada == 'true'
        run: |
          git config user.name "Claude (robot Costaviva)"
          git config user.email "actions@github.com"
          # rotacion-zonas.json es el estado que hace que los ciclos de zona
          # sean COMPLETOS (ver ZONAS en generar-post-instagram.mjs). Sin
          # comitearlo, cada pasada empezaría de cero y publicaría siempre la
          # primera zona. Añadido 2026-09-25 junto con la rotación.
          git add assets/marketing/
          # Con spot forzado no se escriben todos los ficheros de estado:
          # añadir solo los que existen (si no, git add falla).
          for f in scripts/marketing/rotacion-zonas.json scripts/marketing/rotacion-zonas-nz.json scripts/marketing/calendario-estado.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          # Bug real visto en producción 2026-09-19: si se relanza el robot
          # el mismo día para el mismo spot/especie y los datos no han
          # cambiado (p.ej. una prueba manual poco después de la pasada
          # normal), la imagen sale byte a byte idéntica y no hay nada que
          # comitear -- `git commit` fallaría entero por eso. Se salta el
          # commit+push en ese caso en vez de romper el resto del workflow.
          if git diff --cached --quiet; then
            echo "La imagen ya existía sin cambios, no hace falta comitear."
          else
            git commit -m "Robot de marketing: nueva pieza para Instagram y Facebook"
            git pull --rebase --quiet
            git push
          fi

      - name: Asegurar que existe la etiqueta "marketing"
        if: steps.generar.outputs.generada == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create marketing --color FFD700 --description "Propuestas de marketing (Instagram, etc.)" --force
          # Publicación automática con veto (2026-10-11): "veto" la para;
          # "revisar-publicacion" la deja para Mikel tras un fallo.
          gh label create veto --color B60205 --description "No publicar esta pieza (publicación automática con veto)" --force
          gh label create revisar-publicacion --color FBCA04 --description "La publicación automática no la publica: decide Mikel" --force

      - name: Crear borrador en Instagram y abrir Issue de revisión (Instagram + Facebook)
        if: steps.generar.outputs.generada == 'true'
        working-directory: scripts/marketing
        env:
          GH_TOKEN: ${{ github.token }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_BUSINESS_ACCOUNT_ID: ${{ vars.META_IG_BUSINESS_ACCOUNT_ID }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          # Solo cambia el texto del Issue ("se publica sola el ... si no la
          # vetas"); quien publica es publicar-con-veto.yml.
          PUBLICACION_AUTOMATICA: ${{ vars.PUBLICACION_AUTOMATICA }}
        run: |
          # Guardarraíl de credencial (añadido 2026-09-25). El script sale con
          # código 3 cuando Meta responde que el token no vale (error 190). Un
          # token caducado no es un fallo del repo: se avisa con ::warning::
          # nombrando la causa y se sale en verde, para que no se confunda con
          # un bug y, sobre todo, para que no pase desapercibido 6 días como
          # ocurrió entre el 2026-09-19 y el 2026-09-25. Cualquier otro fallo
          # sigue poniendo el workflow en rojo igual que antes.
          node publicar-borrador-instagram.mjs || CODIGO=$?
          CODIGO=${CODIGO:-0}
          if [ "$CODIGO" -eq 3 ]; then
            echo "::warning::El token de Instagram (META_PAGE_ACCESS_TOKEN) ha caducado o no es válido. Esta pasada no ha hecho nada. Hay que regenerarlo: lanza el workflow \"Comprobar token de Instagram\" para verificar el nuevo antes de guardarlo."
            {
              echo "### Token de Instagram caducado"
              echo "El secret \`META_PAGE_ACCESS_TOKEN\` ya no vale, así que esta pasada no ha hecho nada."
              echo "Nada que arreglar en el código: hay que regenerar el token y verificarlo con el workflow **Comprobar token de Instagram**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$CODIGO"
