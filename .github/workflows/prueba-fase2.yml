name: Prueba fase 2 capas (temporal, se borra)
on:
  push:
    branches: ["claude/prueba-copernicus"]
permissions:
  contents: write
jobs:
  capas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -r scripts/fuentes/requirements.txt
      - name: Capas reales (sin subir), volcadas al log en trozos
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
        run: |
          python -I scripts/fuentes/descargar-capas.py --salida /tmp/c 2>&1 | grep capa
          mkdir -p tmp-capas && cp /tmp/c/capas/*.json tmp-capas/
          git config user.name "prueba" && git config user.email "noreply@anthropic.com"
          git add tmp-capas && git commit -qm "Capas reales de prueba (temporal) [skip ci]" && git push -q origin HEAD:claude/prueba-copernicus
