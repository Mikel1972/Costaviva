name: Fuentes gratuitas (MET Norway, Copernicus) y comparativa

# 2026-10-08, aprobado por Mikel ("por ahora gratis"): Costaviva tiene
# suscripciones y la API gratuita de Open-Meteo es solo para uso no
# comercial. Se montan EN PARALELO dos fuentes gratuitas válidas para uso
# comercial y se comparan contra las boyas de Puertos del Estado antes de
# cambiar nada en producción (ver CLAUDE.md, "Fuentes gratuitas"). Sin IA.
#
# Cuatro partes:
#   atmosfera   cada 3 h: instantánea de MET Norway Locationforecast para los
#               spots y una rejilla de 1° -> Supabase Storage
#               fuentes-gratuitas/atmosfera/todos.json
#   mar         1 vez al día (tras la pasada de las 02:00 UTC de IBI):
#               modelo IBI de Copernicus Marine para spots y boyas ->
#               fuentes-gratuitas/mar/spots.json y mar/celdas/*.json
#               + franja costera de España y Portugal (fase 2) ->
#               mar/celdas/*.json, y capas del mapa de clorofila (satélite)
#               y temperatura del agua -> capas/*.json; 〰 frentes y
#               corrientes -> capas/frentes.json y copia diaria
#               capas/historico/frentes-AAAA-MM-DD.json (aprendizaje)
#   pasado      1 vez al día: reanálisis ERA5 (copia pública ARCO-ERA5 de
#               Google, SIN cuenta) para el diario de días pasados ->
#               pasado/<fecha>/<caja>.json (fase 2)
#   capas_nz    solo a mano (workflow_dispatch): capas del mar de Nueva
#               Zelanda con Copernicus GLOBAL -> capas/nz/*.json (región oculta)
#   historico_frentes  solo a mano (workflow_dispatch): histórico hacia atrás
#               de 〰 Frentes para el aprendizaje, un fichero por día
#               capas/historico/frentes-AAAA-MM-DD.json con el mismo cálculo
#               (descargar-capas.py --desde/--hasta); salta los días que ya
#               están en el bucket; como mucho `max_dias` por ejecución
#   comparativa 1 vez al día: archiva lo que prevé cada fuente para las
#               boyas y compara lo archivado con lo medido ->
#               datos-robots/fuentes/COMPARATIVA.md (commit en main)
#
# NADA DE ESTO CAMBIA LO QUE VE EL USUARIO: la app sigue en Open-Meteo hasta
# que se pongan FUENTE_ATMOSFERA / FUENTE_MAR (o por grupo) en Cloudflare.
#
# Activación: los `schedule` solo hacen algo con la variable de repositorio
# FUENTES_GRATUITAS=true (Settings -> Secrets and variables -> Actions ->
# Variables). Una vez activada, si falta algo el job sale en ROJO (comun
# pruebas-y-alertas.md P4, web-y-despliegue.md W9). A mano
# (workflow_dispatch) corre siempre. Respeta AUTOMATION_PAUSED (P8).
#
# Necesita:
#   vars.METNO_CONTACTO                 contacto del User-Agent de MET Norway
#                                       (web o email de empresa, no personal)
#   secrets.COPERNICUSMARINE_USERNAME   cuenta gratuita de Copernicus Marine
#   secrets.COPERNICUSMARINE_PASSWORD
#   secrets.SUPABASE_SERVICE_ROLE_KEY   ya existe (auth-test, smoke-test)
#   el bucket de la migración 20261008100000_bucket_fuentes_gratuitas.sql

on:
  schedule:
    - cron: "23 */3 * * *"   # atmosfera
    - cron: "47 4 * * *"     # mar
    - cron: "37 6 * * *"     # comparativa
    - cron: "13 8 * * *"     # pasado
  workflow_dispatch:
    inputs:
      parte:
        description: "atmosfera, mar, pasado, comparativa, todo, historico_frentes o capas_nz (estos dos solo a mano y nunca con todo)"
        required: true
        default: "todo"
      dias_pasado:
        description: "pasado: días hacia atrás desde el último de ERA5T (relleno histórico, como mucho 120 por ejecución; ~5 s, ~1 MB y 90 ficheros por día)"
        required: false
        default: "30"
      desde:
        description: "historico_frentes: primer día AAAA-MM-DD (antes de lo que guarda el NRT usa el archivo MY de Copernicus; lo que no cubre ningún dataset se salta)"
        required: false
        default: "2026-01-01"
      hasta:
        description: "historico_frentes: último día AAAA-MM-DD (vacío = ayer)"
        required: false
        default: ""
      max_dias:
        description: "historico_frentes: días como mucho en esta ejecución (~30-60 s y ~60 kB por día)"
        required: false
        default: "150"

permissions:
  contents: read

concurrency:
  group: fuentes-gratuitas-${{ github.event.schedule || inputs.parte }}
  cancel-in-progress: false

jobs:
  atmosfera:
    if: >-
      vars.AUTOMATION_PAUSED != 'true' && (
        (github.event_name == 'schedule' && github.event.schedule == '23 */3 * * *' && vars.FUENTES_GRATUITAS == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.parte == 'atmosfera' || inputs.parte == 'todo')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instantánea de MET Norway
        env:
          METNO_CONTACTO: ${{ vars.METNO_CONTACTO }}
        run: |
          mkdir -p /tmp/instantanea/atmosfera
          node scripts/fuentes/instantanea-met.mjs /tmp/instantanea/atmosfera/todos.json
      - name: Subir a Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fuentes/subir-storage.mjs /tmp/instantanea

  mar:
    if: >-
      vars.AUTOMATION_PAUSED != 'true' && (
        (github.event_name == 'schedule' && github.event.schedule == '47 4 * * *' && vars.FUENTES_GRATUITAS == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.parte == 'mar' || inputs.parte == 'todo')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar el toolbox de Copernicus Marine
        run: pip install --quiet -r scripts/fuentes/requirements.txt
      - name: Descargar IBI (oleaje y física) para spots, boyas y franja costera
        env:
          PYTHONUNBUFFERED: "1"
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
        run: |
          node scripts/fuentes/puntos.mjs > /tmp/puntos.json
          python -I scripts/fuentes/descargar-ibi.py --puntos /tmp/puntos.json --salida /tmp/instantanea
          du -sh /tmp/instantanea/mar
      - name: Subir a Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fuentes/subir-storage.mjs /tmp/instantanea
      # Las capas van aparte (otro directorio y otra subida): si fallan, el
      # job sale en rojo pero los datos de mar de los spots ya están subidos.
      # Clorofila y temperatura se escriben antes que 〰 Frentes: si los
      # frentes fallan, el paso sale en rojo pero la subida de abajo
      # (!cancelled()) sube lo que haya llegado a escribirse.
      - name: Capas del mapa (clorofila, temperatura del agua y frentes)
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
        run: python -I scripts/fuentes/descargar-capas.py --salida /tmp/capas
      - name: Subir las capas a Supabase Storage
        if: ${{ !cancelled() }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fuentes/subir-storage.mjs /tmp/capas

  pasado:
    if: >-
      vars.AUTOMATION_PAUSED != 'true' && (
        (github.event_name == 'schedule' && github.event.schedule == '13 8 * * *' && vars.FUENTES_GRATUITAS == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.parte == 'pasado' || inputs.parte == 'todo')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install --quiet -r scripts/fuentes/requirements.txt
      - name: ERA5 de días pasados (ARCO-ERA5 público, sin cuenta)
        env:
          DIAS: ${{ inputs.dias_pasado }}
        run: |
          case "${DIAS:-30}" in ''|*[!0-9]*) echo "::error::dias_pasado debe ser un número"; exit 1;; esac
          python -I scripts/fuentes/descargar-era5.py --salida /tmp/pasado \
            --indice-url https://imncbmizxkorotpeisic.supabase.co/storage/v1/object/public/fuentes-gratuitas/pasado/indice.json \
            --dias "${DIAS:-30}" --max-dias 120
          du -sh /tmp/pasado
      - name: Subir a Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fuentes/subir-storage.mjs /tmp/pasado


  historico_frentes:
    # Histórico hacia atrás de 〰 Frentes (2026-10-09): solo a mano. Lanzar
    # DESDE main. Respeta AUTOMATION_PAUSED. Si hay más días que max_dias, o
    # se acaba el tiempo, se vuelve a lanzar igual: salta lo ya subido.
    if: >-
      vars.AUTOMATION_PAUSED != 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.parte == 'historico_frentes'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar el toolbox de Copernicus Marine
        run: pip install --quiet -r scripts/fuentes/requirements.txt
      - name: Frentes de los días pasados (mismo cálculo que la pasada diaria)
        env:
          PYTHONUNBUFFERED: "1"
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MAX_DIAS: ${{ inputs.max_dias }}
        run: |
          HASTA="${HASTA:-$(date -u -d yesterday +%F)}"
          for f in "$DESDE" "$HASTA"; do case "$f" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::fecha no válida: $f (AAAA-MM-DD)"; exit 1;; esac; done
          case "${MAX_DIAS:-150}" in ''|*[!0-9]*) echo "::error::max_dias debe ser un número"; exit 1;; esac
          python -I scripts/fuentes/descargar-capas.py --salida /tmp/historico \
            --desde "$DESDE" --hasta "$HASTA" --max-dias "${MAX_DIAS:-150}" --max-minutos 290 --bloque 10 \
            --existentes-url https://imncbmizxkorotpeisic.supabase.co/storage/v1/object/public/fuentes-gratuitas/capas/historico/
          du -sh /tmp/historico
      - name: Subir el histórico a Supabase Storage
        if: ${{ !cancelled() }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ ! -d /tmp/historico/capas ]; then echo "Nada que subir."; exit 0; fi
          node scripts/fuentes/subir-storage.mjs /tmp/historico

  capas_nz:
    # Capas del mar de Nueva Zelanda (2026-10-09, fase 2 de NZ, región aún
    # OCULTA): clorofila, temperatura del agua y 〰 frentes con Copernicus
    # GLOBAL en la caja de NZ -> capas/nz/*.json (+ capas/nz/historico/).
    # Solo a mano (parte = capas_nz), nunca con "todo" ni con el cron, hasta
    # que Mikel active NZ. Lanzar DESDE main. Respeta AUTOMATION_PAUSED.
    if: >-
      vars.AUTOMATION_PAUSED != 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.parte == 'capas_nz'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar el toolbox de Copernicus Marine
        run: pip install --quiet -r scripts/fuentes/requirements.txt
      - name: Capas de NZ (Copernicus GLOBAL)
        env:
          PYTHONUNBUFFERED: "1"
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
        run: |
          python -I scripts/fuentes/descargar-capas.py --region nz --salida /tmp/capas-nz
          du -sh /tmp/capas-nz
      - name: Subir las capas de NZ a Supabase Storage
        if: ${{ !cancelled() }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ ! -d /tmp/capas-nz/capas/nz ]; then echo "Nada que subir."; exit 0; fi
          node scripts/fuentes/subir-storage.mjs /tmp/capas-nz

  comparativa:
    needs: [mar]
    # Corre aunque `mar` se haya saltado (otra hora de cron) o haya fallado:
    # la comparativa de Open-Meteo frente a MET Norway no depende de él.
    if: >-
      always() && vars.AUTOMATION_PAUSED != 'true' && (
        (github.event_name == 'schedule' && github.event.schedule == '37 6 * * *' && vars.FUENTES_GRATUITAS == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.parte == 'comparativa' || inputs.parte == 'todo')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Archivar pronósticos y comparar con las boyas
        env:
          METNO_CONTACTO: ${{ vars.METNO_CONTACTO }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: node scripts/fuentes/comparar-boyas.mjs ambos --dias 14
      - name: Guardar la comparativa en el repo
        run: |
          git config user.name "Costaviva (comparativa de fuentes)"
          git config user.email "noreply@anthropic.com"
          git add datos-robots/fuentes
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -qm "Comparativa de fuentes contra boyas [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::error::No se pudo subir la comparativa"; exit 1
