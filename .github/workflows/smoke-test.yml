name: Smoke test E2E

# ACTIVADO 2026-09-12, probado a mano primero (encontró y arregló un bug
# real: faltaba user_id explícito en el insert de prueba). Corre a las
# 05:00 UTC, antes que el informe diario (06:00 UTC) y el test de
# autenticación (06:17 UTC), para no saturar los runners a la vez.
#
# Recorre el camino real de un usuario contra produccion: login ->
# /prevision y /webcam/<slug> responden -> escribe una entrada de prueba
# en el cuaderno de pesca (salidas_pesca) -> la borra. Si algo falla, el
# workflow falla (GitHub avisa por email de los runs programados que
# fallan, sin plumbing adicional).
#
# LA FUNCION SOS QUEDA FUERA A PROPOSITO (decision explicita del
# 2026-09-12): este smoke test NUNCA debe llamar a /sos-alerta. Hacerlo
# dispararia un email de socorro real via Resend a los contactos de
# emergencia de la cuenta de prueba (si tuviera alguno). Si en el futuro
# se quiere cubrir tambien el camino del SOS, hace falta antes un modo de
# prueba explicito en sos-alerta.js que nunca llame a Resend de verdad
# para una cuenta marcada como test -- decidir eso aparte, no asumirlo.
#
# LOGIN SIN PASSWORD, VIA ADMIN API (cambiado 2026-09-14): activar el
# CAPTCHA de Cloudflare Turnstile en Supabase (ver CLAUDE.md) bloqueo el
# login por password de este workflow (mismo endpoint /auth/v1/token que
# usa un usuario real, sin captcha_token no cuela). Se genera la sesion
# via API admin (generate_link + verify) en su lugar -- no necesita
# password en absoluto, solo el email y SUPABASE_SERVICE_ROLE_KEY (misma
# key que ya usa aviso-alta.js, aqui como secret nuevo y separado de
# GitHub Actions, solo para esto). SMOKE_TEST_PASSWORD ya no hace falta.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://imncbmizxkorotpeisic.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltbmNibWl6eGtvcm90cGVpc2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzczMTQsImV4cCI6MjEwNDUxMzMxNH0.QYvtoHQyFRo1SploGPCUyWZqeHNwy6Qdd6IsAbmvHnc"
      PRODUCCION_URL: "https://costaviva.org"
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Comprobar que los secrets existen
        run: |
          if [ -z "$SMOKE_TEST_EMAIL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Faltan los secrets SMOKE_TEST_EMAIL/SUPABASE_SERVICE_ROLE_KEY — ver CLAUDE.md."
            exit 1
          fi

      - name: Genera una sesión para la cuenta de prueba (sin password, vía API admin)
        id: login
        run: |
          enlace=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/admin/generate_link" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"magiclink\",\"email\":\"$SMOKE_TEST_EMAIL\"}")
          hashed_token=$(echo "$enlace" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).hashed_token||JSON.parse(d).properties.hashed_token||'')}catch{console.log('')}})")
          if [ -z "$hashed_token" ]; then
            echo "::error::No se pudo generar el enlace de sesión: $enlace"
            exit 1
          fi
          resp=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/verify" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"type\":\"email\",\"token_hash\":\"$hashed_token\"}")
          token=$(echo "$resp" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).access_token||'')}catch{console.log('')}})")
          userid=$(echo "$resp" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).user.id||'')}catch{console.log('')}})")
          if [ -z "$token" ] || [ -z "$userid" ]; then
            echo "::error::No se pudo intercambiar el token de sesión: $resp"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "userid=$userid" >> "$GITHUB_OUTPUT"

      - name: /prevision y /webcam/<slug> responden
        run: |
          for ruta in "prevision" "webcam/mundaka"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$PRODUCCION_URL/$ruta")
            if [ "$code" != "200" ]; then echo "::error::$ruta devolvió $code"; exit 1; fi
          done

      - name: Escribe y borra una salida de pesca de prueba
        env:
          TOKEN: ${{ steps.login.outputs.token }}
          USERID: ${{ steps.login.outputs.userid }}
        run: |
          creada=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/salidas_pesca" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "{\"user_id\":\"$USERID\",\"fecha\":\"2000-01-01\",\"spot_slug\":\"smoke-test\",\"notas\":\"smoke test automatico, se borra solo\"}")
          id=$(echo "$creada" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d)[0].id||'')}catch{console.log('')}})")
          if [ -z "$id" ]; then
            echo "::error::No se pudo crear la salida de prueba: $creada"
            exit 1
          fi
          echo "Creada salida de prueba $id, borrando..."
          curl -sS -X DELETE "$SUPABASE_URL/rest/v1/salidas_pesca?id=eq.$id" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $TOKEN"
