name: Métricas de Instagram

# Pedido explícito del usuario (2026-09-19): "que el robot tenga una
# regla de cantidad de impactos e impresiones de la publicación para ir
# afinando". Revisa a diario los posts publicados por
# publicar-post-instagram.yml (ver scripts/marketing/posts-publicados.jsonl)
# y, para los que ya llevan 48h publicados (a las métricas de Instagram
# les hace falta ese margen para asentarse), guarda alcance/impresiones/
# likes/comentarios/guardados reales en CALIBRACION.jsonl -- el mismo
# fichero que ya usa el resto de calibraciones del repo, nunca se
# inventa un número si la API no lo da.
#
# Probar a mano (workflow_dispatch) antes de fiarse del schedule, mismo
# criterio que el resto de rutinas de este repo.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Medir métricas de posts publicados
        working-directory: scripts/marketing
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          # Guardarraíl de credencial (añadido 2026-09-25). El script sale con
          # código 3 cuando Meta responde que el token no vale (error 190). Un
          # token caducado no es un fallo del repo: se avisa con ::warning::
          # nombrando la causa y se sale en verde, para que no se confunda con
          # un bug y, sobre todo, para que no pase desapercibido 6 días como
          # ocurrió entre el 2026-09-19 y el 2026-09-25. Cualquier otro fallo
          # sigue poniendo el workflow en rojo igual que antes.
          node medir-metricas-instagram.mjs || CODIGO=$?
          CODIGO=${CODIGO:-0}
          if [ "$CODIGO" -eq 3 ]; then
            echo "::warning::El token de Instagram (META_PAGE_ACCESS_TOKEN) ha caducado o no es válido. Esta pasada no ha hecho nada. Hay que regenerarlo: lanza el workflow \"Comprobar token de Instagram\" para verificar el nuevo antes de guardarlo."
            {
              echo "### Token de Instagram caducado"
              echo "El secret \`META_PAGE_ACCESS_TOKEN\` ya no vale, así que esta pasada no ha hecho nada."
              echo "Nada que arreglar en el código: hay que regenerar el token y verificarlo con el workflow **Comprobar token de Instagram**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$CODIGO"

      - name: Comitear resultados si hubo algo nuevo
        run: |
          git config user.name "Claude (robot Costaviva)"
          git config user.email "actions@github.com"
          if git diff --quiet -- CALIBRACION.jsonl scripts/marketing/posts-publicados.jsonl; then
            echo "Sin cambios, nada que comitear."
          else
            git add CALIBRACION.jsonl scripts/marketing/posts-publicados.jsonl
            git commit -m "Robot de marketing: métricas de posts de Instagram"
            git push
          fi
