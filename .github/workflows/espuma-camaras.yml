name: Oleaje por cámara (espuma de las webcams)

# "Si hay cámara, utiliza nuestro cálculo" (Mikel, 2026-10-08). Cada 30 min
# con luz mide cuánta espuma (agua rompiendo) se ve en las 13 webcams que
# sirven (scripts/oleaje-camaras/camaras.mjs), la convierte en metros de ola
# en el spot con la calibración (calibracion.mjs: boyas de Copernicus Marine
# In Situ y etiquetas de Mikel) y:
#   - añade el histórico a datos-robots/oleaje-camaras/espuma.jsonl (de ahí
#     sale la calibración, que mejora sola con el tiempo) y deja
#     calibracion.json;
#   - publica la lectura en Supabase (oleaje_camara_lecturas) para que
#     /prevision enseñe "según cámara, HH:MM", y la miniatura en el bucket
#     oleaje-camaras para etiquetar-olas.html.
#
# SIN IA (regla de coste de Mikel): píxeles, Open-Meteo y boyas de
# Copernicus (licencia comercial con atribución). Todas las cámaras en UNA
# ejecución (en paralelo) para gastar pocos minutos de Actions.
#
# CUÁNDO (2026-10-08, ampliado): cada 30 min de 05:07 a 18:37 UTC, todo el
# año. Con el sol a ≥ 8° en la costa vasca (43,35 N 2,5 W) hay luz entre
# ~08:45-15:35 UTC en diciembre y ~05:30-18:55 UTC en junio; el horario
# anterior (08-15 UTC) se perdía las mañanas y las tardes de primavera a
# otoño (hoy, 8 de octubre: de 07:10 a 16:50). Fuera de la luz, el paso
# "¿Hay luz?" corta en ~15 s sin instalar nada. El repo es PÚBLICO: los
# runners estándar de GitHub son gratis, así que no hay tope que cuidar.
# test/oleaje-camaras.test.js comprueba que este cron cubre la luz de todo
# el año.
#
# OJO: GitHub trata el `schedule:` como "cuando pueda" y en este repo se
# salta casi todas las ejecuciones frecuentes (camaras-salud.yml, cada 30
# min, corre ~4-7 veces al día; esta, en su primer día, ninguna). Lo fiable
# es que pg_cron la lance por workflow_dispatch (migración
# 20261008210000_programador_espuma_camaras.sql y CLAUDE.md "Tareas cada 30
# min"); el `schedule:` queda de respaldo. Por eso el paso "¿Hay luz?" se
# aplica también a workflow_dispatch: solo se salta marcando forzar_luz.
# GitHub no cumple la hora al minuto; da igual, cada línea lleva su hora.

on:
  schedule:
    - cron: "7,37 5-18 * * *"
  workflow_dispatch:
    inputs:
      forzar_luz:
        description: "Medir aunque el sol esté bajo (solo para pruebas)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: espuma-camaras
  cancel-in-progress: false

jobs:
  medir:
    # Interruptor de pausa (comun pruebas-y-alertas.md P8).
    if: ${{ vars.AUTOMATION_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ¿Hay luz?
        id: luz
        env:
          FORZAR_LUZ: ${{ inputs.forzar_luz }}
        run: |
          node -e '
            import("./scripts/oleaje-camaras/calibracion.mjs").then(({ elevacionSolar, ELEVACION_MINIMA }) => {
              const e = elevacionSolar(Date.now(), 43.35, -2.5);
              console.log(`Sol a ${e}°`);
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `hay=${e >= ELEVACION_MINIMA || process.env.FORZAR_LUZ === "true"}\n`);
            })'

      - name: ffmpeg y netCDF4 (pip, más rápido que apt)
        if: steps.luz.outputs.hay == 'true'
        run: |
          pip install --quiet imageio-ffmpeg==0.5.1 netCDF4==1.7.2
          echo "FFMPEG=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"

      - name: Boyas de Copernicus Marine In Situ
        if: steps.luz.outputs.hay == 'true'
        # Si Copernicus falla, se sigue: la calibración usa el modelo con menos peso.
        continue-on-error: true
        run: python3 scripts/oleaje-camaras/boyas-copernicus.py --salida /tmp/boyas.json

      - name: Medir espuma y estimar la ola
        if: steps.luz.outputs.hay == 'true'
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          FUENTE_MAR: ${{ vars.FUENTE_MAR }}
          FUENTE_OLEAJE: ${{ vars.FUENTE_OLEAJE }}
          FUENTE_MAREA: ${{ vars.FUENTE_MAREA }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORZAR_LUZ: ${{ inputs.forzar_luz }}
        run: node scripts/oleaje-camaras/medir-espuma.mjs --boyas /tmp/boyas.json $([ "$FORZAR_LUZ" = "true" ] && echo --forzar-luz)

      - name: Guardar en el repo
        if: steps.luz.outputs.hay == 'true'
        run: |
          D=datos-robots/oleaje-camaras
          git config user.name "github-actions[bot]"
          git config user.email "noreply@anthropic.com"
          git add "$D/espuma.jsonl" "$D/calibracion.json"
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -qm "Oleaje por cámara [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::warning::No se pudo subir $D"; exit 1
