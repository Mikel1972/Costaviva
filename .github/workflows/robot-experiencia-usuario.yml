name: Robot de experiencia de usuario

# Pedido explícito del usuario (2026-09-15): "imagínate que eres un
# usuario real, o tres, y que has pagado por la app. Esa es la
# experiencia que quiero que un robot trabaje para ver qué falla, en
# silencio o no [...] pon en duda todo. Haz una prueba lo más intensiva
# y extrema posible. Busquemos los huecos, bugs, silencios o fallos
# claros."
#
# Distinto de smoke-test.yml (que es determinista: pasos fijos,
# comprueba códigos HTTP y presencia de campos) — este workflow le da
# a una sesión de Claude Code las credenciales de sesión ya generadas
# de 1-2 cuentas de prueba reales y la deja EXPLORAR y JUZGAR: no solo
# "¿respondió 200?" sino "¿el contenido de la respuesta tiene sentido
# de verdad, o algo huele raro aunque no haya error?" — el mismo tipo
# de fallo silencioso que el bug real de viento/presión/nubosidad/
# lluvia en blanco en diario.html (arreglado el mismo día que se pidió
# este robot): ahí no había ningún error HTTP, solo un dato mal
# indexado que se veía como "sin datos" en vez de como un fallo.
#
# GUARDARRAÍLES DE SEGURIDAD, no negociables:
# 1. NUNCA toca /sos-alerta ni nada de alarma.html — pedido explícito
#    del usuario ("deja fuera el sos"), y es la parte más crítica del
#    repo (ver CLAUDE.md). Si el prompt de abajo cambia alguna vez,
#    esta exclusión no se toca sin pedirlo expresamente.
# 2. Sin acceso de escritura al repo: --allowedTools no incluye Edit
#    ni Write sobre ficheros del repo (solo puede escribir su propio
#    fichero de informe en /tmp) y no se le da git. Esto prueba la app
#    YA DESPLEGADA en producción, nunca cambia código.
# 3. Cualquier dato de prueba que cree (entradas de diario, capturas,
#    grupos...) debe quedar borrado por la propia sesión antes de
#    terminar, usando siempre el token de sesión de la cuenta de
#    prueba (nunca service_role para escribir/borrar — solo para
#    generar el login, igual que ya hace smoke-test.yml).
# 4. Nunca toca ficheros del repo (código o configuración) aunque
#    encuentre un bug — solo REPORTA. Los fallos que encuentre se
#    corrigen después, a mano o con otra pasada dedicada, revisados
#    por una persona antes de tocar producción.
#
# 1x/SEMANA, los lunes (2026-09-28, pedido explícito del usuario para
# bajar el gasto de API por debajo de ~20 €/semana entre las 4 apps). Antes
# era diario y costaba unos 14-21 $/semana él solo; los fallos que busca no
# aparecen a diario, y lo básico ya lo cubre cada mañana smoke-test.yml sin
# gastar tokens. Sigue corriendo después del smoke test (05:00 UTC) y antes
# del informe diario, para que su hallazgo entre en la síntesis del lunes.
#
# Recortes de coste del mismo día, además de la frecuencia:
#   - --max-turns 30 (antes 60).
#   - Se ejecuta desde un directorio vacío fuera del repo. El CLI carga solo
#     el CLAUDE.md del directorio de trabajo en CADA turno, y el de este
#     repo pesa ~144 KB (~40k tokens) que este robot no necesita. El repo
#     sigue al alcance por ruta absoluta ($GITHUB_WORKSPACE) para leer
#     functions/ y para el commit de ROBOT.md.
#
# Necesita el secret ANTHROPIC_API_KEY (mismo que robot-buscador-
# fuentes.yml) y las mismas TEST_USER_A_EMAIL/TEST_USER_B_EMAIL/
# SUPABASE_SERVICE_ROLE_KEY que ya usan smoke-test.yml/auth-test.yml —
# sin login por password (CAPTCHA activo), mismo patrón admin
# generate_link + verify ya probado en real.
#
# --model y --max-turns fijados explícitamente el 2026-09-16 (gasto real
# de API más alto de lo esperado en la cuenta, revisado junto con el
# usuario) para que esta pasada nunca quede corriendo más de la cuenta.
#
# --max-turns subido 40→60 el 2026-09-17: la pasada del 2026-09-16 sí
# completó dentro de 40 turnos y dejó un informe extenso (encontró 2 bugs
# reales: mareas absurdas en spots mediterráneos de marea casi nula, y
# eliminar_grupo() no desplegada en producción) — pero la del 2026-09-17
# agotó el límite ("Reached max turns (40)") y perdió el informe entero.
# (Entonces el paso tenía continue-on-error y el job quedaba en verde. Desde
# 2026-10-07 ya no: un fallo real, incluido quedarse sin turnos, sale en
# rojo; solo la falta de saldo sale en verde con ::warning::.)

#
# SIN API DESDE EL 2026-10-08 (Mikel aprobó las propuestas de GASTO.md de
# comun; patrón de comun estandares/claude-api.md "Dónde va cada cosa"):
#   1. Este workflow, SIN IA, sondea producción como la cuenta de prueba
#      (scripts/experiencia/sondear.mjs: /prevision de toda la costa, /luna,
#      casos límite y una salida del diario que se guarda, se relee, se
#      comprueba contra la cuenta B y se borra) y deja el CONTENIDO en
#      datos-robots/experiencia/ultima.json, sin tokens ni user_id. Domingo
#      por la noche, para que esté listo el lunes por la mañana.
#   2. La rutina "Costaviva - Experiencia de usuario" del plan de Claude
#      (scripts/saldo/rutina-experiencia-usuario.txt, lunes) lo lee con
#      sospecha, lo cruza con el código y escribe los hallazgos en ROBOT.md.
# El paso de Claude de abajo solo corre a mano, con el input respaldo_api
# marcado (test/robots-sin-api.test.js lo comprueba). Antes: lunes 05:30 UTC
# con claude -p contra el saldo de la API.

on:
  schedule:
    - cron: "30 21 * * 0" # domingo por la noche: datos para la rutina del lunes
  workflow_dispatch:
    inputs:
      respaldo_api:
        description: "Respaldo manual: además del sondeo, explorar la app con Claude contra el saldo de la API (lo normal es la rutina del plan)"
        type: boolean
        default: false

jobs:
  experiencia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
    env:
      SUPABASE_URL: "https://imncbmizxkorotpeisic.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltbmNibWl6eGtvcm90cGVpc2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzczMTQsImV4cCI6MjEwNDUxMzMxNH0.QYvtoHQyFRo1SploGPCUyWZqeHNwy6Qdd6IsAbmvHnc"
      PRODUCCION_URL: "https://costaviva.org"
      TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
      TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar que los secrets existen
        run: |
          if [ -z "$TEST_USER_A_EMAIL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Faltan los secrets TEST_USER_A_EMAIL/SUPABASE_SERVICE_ROLE_KEY — ver CLAUDE.md."
            exit 1
          fi

      - name: Genera sesión(es) de prueba (sin password, vía API admin)
        id: login
        run: |
          generar_token() {
            local email="$1"
            local enlace hashed_token resp token
            enlace=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/admin/generate_link" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"magiclink\",\"email\":\"$email\"}")
            hashed_token=$(echo "$enlace" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).hashed_token||JSON.parse(d).properties.hashed_token||'')}catch{console.log('')}})")
            if [ -z "$hashed_token" ]; then echo "::error::No se pudo generar el enlace para $email: $enlace"; exit 1; fi
            resp=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/verify" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
              -d "{\"type\":\"email\",\"token_hash\":\"$hashed_token\"}")
            token=$(echo "$resp" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).access_token||'')}catch{console.log('')}})")
            if [ -z "$token" ]; then echo "::error::No se pudo intercambiar el token para $email: $resp"; exit 1; fi
            echo "$token"
          }
          token_a=$(generar_token "$TEST_USER_A_EMAIL")
          echo "::add-mask::$token_a"
          echo "$token_a" > /tmp/token_usuario_a.txt
          if [ -n "$TEST_USER_B_EMAIL" ]; then
            token_b=$(generar_token "$TEST_USER_B_EMAIL")
            echo "::add-mask::$token_b"
            echo "$token_b" > /tmp/token_usuario_b.txt
            echo "dos_usuarios=si" >> "$GITHUB_OUTPUT"
          else
            echo "dos_usuarios=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Sondear producción y guardar el contenido para la rutina (sin IA)
        env:
          TOKEN_A_FILE: /tmp/token_usuario_a.txt
          TOKEN_B_FILE: /tmp/token_usuario_b.txt
        run: |
          F=datos-robots/experiencia/ultima.json
          node scripts/experiencia/sondear.mjs "$F"
          git config user.name "Costaviva (volcado)"
          git config user.email "noreply@anthropic.com"
          git add "$F"
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -qm "Sondeo de experiencia de usuario para la rutina [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::error::No se pudo subir $F"; exit 1

      - name: Instalar Claude Code CLI
        if: github.event_name == 'workflow_dispatch' && inputs.respaldo_api == true
        run: npm install -g @anthropic-ai/claude-code

      - name: Explorar la app como usuario(s) real(es) (Claude Code, sesión no interactiva)
        if: github.event_name == 'workflow_dispatch' && inputs.respaldo_api == true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Sin continue-on-error desde 2026-10-07 (comun claude-api.md C15):
        # un fallo real sale en rojo; sin saldo, verde con ::warning::.
        run: |
          # Pausa comprobada en bash, ANTES de arrancar Claude: dentro del prompt
          # ya se habria pagado el arranque (Mikel1972/comun, claude-api.md C11).
          if [ -f "$GITHUB_WORKSPACE/ROBOT_PAUSADO" ]; then echo "ROBOT_PAUSADO: no se arranca Claude."; exit 0; fi
          SALIDA_CLAUDE=/tmp/claude-salida.log
          rm -f /tmp/experiencia-informe.txt
          # Directorio vacío: que el CLI no cargue el CLAUDE.md del repo (ver
          # la cabecera). OJO: todo lo del repo va por "$GITHUB_WORKSPACE".
          mkdir -p /tmp/sesion-experiencia && cd /tmp/sesion-experiencia
          claude -p "Eres un probador de calidad extremadamente exigente y desconfiado de Costaviva (app real de condiciones costeras + diario de pesca + grupos, repo Costaviva), actuando HOY como uno o dos usuarios reales que han pagado por la app y la usan de verdad — no como un script que solo comprueba códigos HTTP. Tu misión, pedida explícitamente por el dueño del proyecto: 'pon en duda todo. Haz una prueba lo más intensiva y extrema posible. Busquemos los huecos, bugs, silencios o fallos claros'. Un código 200 con datos mal calculados NO es un éxito — ya hubo un bug real así este mismo día (viento/presión/nubosidad/lluvia siempre en blanco en el diario por un índice mal cruzado entre dos respuestas de API distintas, sin ningún error visible). Trata cada respuesta con sospecha: LEE el contenido de verdad y pregúntate si tiene sentido, no solo si la petición 'funcionó'. Herramientas: tienes Bash (curl, node, jq si hace falta) para hablar con la API REST de Supabase ($SUPABASE_URL, cabecera apikey: $SUPABASE_ANON_KEY) y con los endpoints reales de producción ($PRODUCCION_URL — /prevision, /luna, /webcam/<slug>, /identificar-captura, /geocodificar, etc., el código está en $GITHUB_WORKSPACE/functions/ si quieres leer qué hace cada uno ANTES de probarlo, solo lectura). El token de sesión de la cuenta de prueba A está en /tmp/token_usuario_a.txt (y, si existe, el de la cuenta B en /tmp/token_usuario_b.txt — comprueba si el fichero existe antes de usarlo) — Authorization: Bearer <token de ese fichero> para llamadas autenticadas. REGLAS DE SEGURIDAD, INNEGOCIABLES, NUNCA LAS ROMPAS AUNQUE PAREZCA ÚTIL PARA LA PRUEBA: (1) JAMÁS llames a /sos-alerta ni toques nada relacionado con alarma.html/SOS — ninguna excepción, bajo ningún argumento. (2) JAMÁS edites, borres ni crees ficheros del repositorio salvo ROBOT.md al final, como se indica abajo (no tienes Edit/Write sobre código de todos modos). No hagas git commit salvo el único permitido al final. Tu trabajo es probar la app YA DESPLEGADA, nunca tocar el código. (3) Cualquier dato de prueba que crees en Supabase (salidas_pesca, capturas, grupos, spots_usuario, lo que sea) DEBES borrarlo tú mismo antes de terminar, usando el token de la cuenta de prueba correspondiente (nunca la service_role key, que no tienes de todas formas). Si algo falla a mitad de una prueba y no puedes limpiarlo del todo, dilo explícitamente en el informe en vez de dejarlo sin más. (4) No agotes la cuota de ninguna API externa a lo bestia — unas pocas pruebas bien elegidas por zona/función, no cientos de peticiones idénticas. Qué probar, con espíritu de 'usuario real pagando por esto, exigente': crea una entrada de diario con datos realistas para un spot real (elige uno de $GITHUB_WORKSPACE/functions/prevision.js), comprueba que marea/oleaje/viento/presión/nubosidad/lluvia/coeficiente de marea que devuelve tengan pinta de reales y no contradictorios entre sí (ej. ¿la marea sube pero el coeficiente es absurdo? ¿la temperatura del agua es coherente con la época del año?); prueba /identificar-captura con una foto real (descarga una de un pez conocido, por ejemplo https://upload.wikimedia.org/wikipedia/commons/d/d0/Bar_%28Dicentrarchus_labrax%29_%28Ifremer_00735-84702%29_%28cropped%29.jpg, base64 y compara si la especie que devuelve tiene sentido); si tienes las dos cuentas, prueba el flujo de grupos completo (crear grupo vía rpc/crear_grupo, invitar, que la cuenta B se una vía rpc/unirse_a_grupo, comprobar que B ve de verdad lo compartido, que A NO ve nada de B si B no comparte, salir, limpiar); prueba /prevision para 2-3 spots de zonas distintas (Cantábrico, Mediterráneo, Canarias) y compara si los números parecen razonables para esa zona/época; prueba con 1-2 entradas límite/raras a propósito (una fecha rara, un spot_slug que no existe, un campo vacío) y comprueba que el error (si lo hay) es claro y no un fallo silencioso a medias. Sé eficiente — tienes solo 30 turnos: reserva los últimos 6 para limpiar los datos de prueba, escribir el informe y hacer el commit, y si vas justo, deja de probar y cierra antes que quedarte a medias con datos sin borrar. No hace falta agotar cada rincón de la app en una sola pasada, prioriza lo que más importe a un usuario real y deja constancia de lo que NO te dio tiempo a probar hoy para la próxima pasada. Escribe tu informe en español, sin jerga, en /tmp/experiencia-informe.txt (usa Write), con esta estructura: '## Qué probé hoy' (lista breve), '## Todo bien' (lo que funcionó y tenía sentido de verdad, no solo 'no dio error'), '## Hallazgos' (cada uno: qué hiciste, qué esperabas, qué pasó de verdad, por qué te parece raro/mal — sé específico con valores reales, no vagues) y '## Pendiente para la próxima pasada' (qué no te dio tiempo). Si no encontraste NADA raro en absoluto, dilo así de claro en Hallazgos, no inventes un problema para rellenar. Después de escribir el informe, añade también una entrada nueva fechada a $GITHUB_WORKSPACE/ROBOT.md (dentro de la sección existente '## Robot de experiencia de usuario', justo antes de la siguiente cabecera '## ') resumiendo lo mismo en 3-5 frases. ROBOT.md pesa ~470 KB: NO lo leas entero ni lo reescribas con Write — localiza la sección con grep -n e inserta tu entrada con un pequeño script de node o python desde Bash. Luego haz commit+push tú mismo a main SOLO de ese cambio, con git -C \"$GITHUB_WORKSPACE\" add ROBOT.md y luego commit y push igual con git -C (el remoto y las credenciales ya están configurados en ese checkout) — nunca cambies ningún otro fichero del repo." \
            --dangerously-skip-permissions \
            --model claude-sonnet-5 \
            --max-turns 30 \
            --allowedTools "Bash,Read,Write,Grep" > "$SALIDA_CLAUDE" 2>&1 || CODIGO=$?
          # Guardarraíl de saldo (añadido 2026-09-25, pedido explícito del
          # usuario: "asegúrate que cuando no hay saldo nada se rompe"). El
          # 2026-09-24 la cuenta de Anthropic se quedó sin saldo y cada
          # workflow lo manifestó de una forma distinta y engañosa: este tipo
          # de pasada moría en ~20s con un rojo indistinguible de un bug real,
          # y las que llevan continue-on-error salían en VERDE sin haber hecho
          # nada. Un problema de facturación no es un fallo del repo: se avisa
          # con ::warning:: nombrando la causa, se deja dicho en el fichero de
          # informe, y se sale en verde para no disparar falsas alarmas.
          CODIGO=${CODIGO:-0}
          cat "$SALIDA_CLAUDE" || true
          # Sin turnos se pierde la pasada entera (2026-09-17, 09-25, 10-02): que se vea (comun C12).
          if grep -qiE "max turns|error_max_turns" "$SALIDA_CLAUDE"; then echo "::error::El robot se quedó sin turnos (--max-turns): la pasada no terminó."; echo "### ⚠️ Sin turnos: la pasada no terminó" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$CODIGO" -ne 0 ] && grep -qiE "credit balance is too low|purchase credits" "$SALIDA_CLAUDE"; then
            echo "::warning::Sin saldo en ANTHROPIC_API_KEY: esta pasada no se ha ejecutado. No es un fallo del repo ni de la tarea — recargar saldo en Plans & Billing de Anthropic."
            echo "No ejecutada: la ANTHROPIC_API_KEY se ha quedado sin saldo, así que esta pasada no ha podido hacer nada. No es un fallo del repo." > /tmp/experiencia-informe.txt
            {
              echo "### Pasada no ejecutada: sin saldo de API"
              echo "La \`ANTHROPIC_API_KEY\` no tiene saldo, así que esta pasada no ha hecho nada."
              echo "Nada que arreglar en el repo — hay que recargar saldo en Plans & Billing de Anthropic."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$CODIGO"

      # Ya NO publica su propio resumen en el Issue "Informe diario" (quitado
      # el 2026-09-20, pedido explícito del usuario: quería un único informe
      # al día, no uno de este robot a las 05:30 UTC y otro de
      # daily-report.yml a las ~08:00 UTC. Este robot sigue escribiendo su
      # hallazgo en ROBOT.md exactamente igual que antes (ver el prompt de
      # arriba) — daily-report.yml ya lee ROBOT.md y lo incluye en su única
      # síntesis diaria (sección "Experiencia de usuario y patrones de uso").
