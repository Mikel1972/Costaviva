name: Test de autenticación (endpoints de usuario)

# Comprueba periódicamente contra producción real y el Supabase real que
# los datos de usuario (contactos de emergencia, alertas SOS, capturas...)
# no son accesibles sin la sesión de su propio dueño. Ver
# test/endpoints-auth.test.js y CLAUDE.md para el detalle.
#
# La prueba cruzada (token de A leyendo fila de B) solo corre si existen
# TEST_USER_A_EMAIL, TEST_USER_B_EMAIL y SUPABASE_SERVICE_ROLE_KEY — sin
# ellos se salta con un aviso, no falla el workflow. Añadirlos en
# Settings > Secrets and variables > Actions para activarla aquí también.
#
# SIN PASSWORD desde 2026-09-14 (ver test/endpoints-auth.test.js): activar
# el CAPTCHA de Turnstile en Supabase bloqueó el login por password de
# este test — la sesión de cada cuenta se genera ahora vía API admin
# (generate_link + verify), así que TEST_USER_A/B_PASSWORD ya no hacen
# falta ni se leen.
#
# El resto de comprobaciones no escriben nada ni en Supabase ni en
# producción — solo leen/rechazan. La cruzada sí crea y borra una fila de
# prueba en contactos_emergencia con la cuenta de test A.

on:
  schedule:
    # Auditoría 2026-09-13: este cron nunca se había disparado solo pese a
    # llevar activo desde 2026-09-12 (los otros 4 workflows del repo sí
    # confirmaron su primer disparo por horario ese mismo día) — probado a
    # mano y funciona bien, así que el fallo estaba en el registro del
    # cron de GitHub Actions, no en el workflow. Reescribir la expresión
    # es un truco conocido para que GitHub la vuelva a registrar.
    - cron: "19 6 * * *" # una vez al día
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
      TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node test/endpoints-auth.test.js
