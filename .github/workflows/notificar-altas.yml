name: Notificar altas

# Añadido 2026-09-17, junto con la migración 20260917080000 (fin de la
# aprobación manual de altas). Llama a /notificar-altas cada 30 min:
# avisa al admin por email cuando alguien confirma su email de verdad
# (alta activada, sin necesitar ninguna acción) y cuando alguien lleva
# más de 48h sin confirmar (posible fallo). Cada alta se avisa como mucho
# una vez por tipo (lo controla la propia base de datos, ver la
# migración).
#
# Reutiliza el secret PRESION_CRON_SECRET (mismo valor que CRON_SECRET en
# Cloudflare Pages) que ya usa presion-historico.yml — no hace falta
# ningún secret nuevo.
#
# Probar a mano (workflow_dispatch) antes de fiarse del schedule, mismo
# criterio que las demás rutinas programadas de este repo.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Desde 2026-09-28 también la lanza pg_cron cada 30 min vía la API de GitHub
# (supabase/migrations/20260928160000_programador_workflows_github.sql),
# porque GitHub solo cumplía el schedule unas 7 veces al día. El schedule se
# queda de respaldo; esto evita que dos ejecuciones se solapen (la segunda
# espera a que acabe la primera, no se cancela nada).
concurrency:
  group: notificar-altas
  cancel-in-progress: false

jobs:
  notificar:
    # Interruptor de pausa (comun pruebas-y-alertas.md P8): con la variable de
    # repositorio AUTOMATION_PAUSED=true este job no se ejecuta.
    if: ${{ vars.AUTOMATION_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Cada llamada, con UN reintento a los 20 s si Cloudflare responde 5xx
      # con su error propio (1101/1102: la función se cayó o pasó su límite
      # de CPU; 2026-10-21, 1 de cada ~40 pasadas). Sin reintento si curl
      # corta por tiempo (código 28): el servidor puede seguir trabajando y
      # se podría mandar algún email dos veces. Un reintento tras un 1101/1102
      # no añade riesgo: cada email se marca solo tras confirmarlo Resend, y
      # lo que quedara a medias lo recogería igual la pasada siguiente.
      - name: Llamar a /notificar-altas y /avisar-fin-prueba
        run: |
          llamar() {
            for intento in 1 2; do
              code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
                -H "X-Cron-Secret: ${{ secrets.PRESION_CRON_SECRET }}" \
                --max-time 90 "https://costaviva.org/$1") || return 1
              echo "$1 (intento $intento): HTTP $code"
              cat /tmp/resp.json; echo
              [ "$code" = "200" ] && return 0
              if [ "$intento" = 1 ] && [ "${code:0:1}" = "5" ] && grep -q "error code: 110[12]" /tmp/resp.json; then
                sleep 20; continue
              fi
              return 1
            done
            return 1
          }
          # Las dos aunque falle una: un fallo no tapa al otro.
          fallo=0
          llamar notificar-altas || fallo=1
          llamar avisar-fin-prueba || fallo=1
          exit $fallo
