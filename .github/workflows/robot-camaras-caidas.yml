name: Robot de cámaras caídas

# Pedido explícito del usuario (2026-09-25): "todas las cámaras que estén en
# rojo, que un robot revise el porqué y pruebe a levantarlas. En vez de
# revisar todas, incluidos los verdes".
#
# Y con una hipótesis de partida concreta, también suya, a raíz del caso de
# Sopelana: cuando una cámara se cae, lo PRIMERO que hay que descartar no es
# que esté rota, sino que el stream se haya MOVIDO. El ayuntamiento de Sopela
# cambió su alias de IPCamLive (s61/3d0d8zpvutondjmwg -> s153/99eod1rsuvg7yjnvk)
# y nuestra URL guardada empezó a dar 404 puro, con la cámara funcionando
# perfectamente. Seis días marcada en rojo por un cambio de dirección.
#
# DIFERENCIA CON camaras-salud.yml: aquel comprueba TODAS las cámaras cada 30
# min y solo registra el estado (sano/caído) en la tabla camara_estado. Este
# no comprueba nada: lee lo que aquel ya dejó escrito, se queda SOLO con las
# que están en rojo, e intenta arreglarlas. Vigilar y reparar son dos trabajos
# distintos y con cadencias distintas.
#
# COSTE: este workflow NO arranca una sesión de Claude si no hay ninguna
# cámara en rojo — el primer paso consulta Supabase con curl (gratis) y, si
# la lista está vacía, el resto del job se salta. Importa porque el repo ya
# tuvo un incidente real de gasto de API (ver CLAUDE.md, 2026-09-16) y un
# robot de reparación que se despierta cada día "por si acaso" es justo el
# patrón que lo provocó.

on:
  schedule:
    # Diario, a una hora que no choca con las 4 pasadas del robot buscador
    # (47 2/8/14/20) ni con camaras-salud (cada 30 min). Después de la del
    # buscador de las 02:47, para que si esa integró cámaras nuevas ya estén
    # reflejadas en camara_estado cuando este mire.
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ver qué cámaras están en rojo
        id: rojas
        env:
          SUPABASE_URL: https://imncbmizxkorotpeisic.supabase.co
        run: |
          # La anon key NO es un secret (es pública por diseño, ver CLAUDE.md)
          # y ya vive hardcodeada en scripts/camaras/comprobar-camaras.mjs,
          # que es el script de este mismo dominio. Se saca de ahí en vez de
          # duplicarla aquí, para que haya un único sitio que actualizar si
          # algún día rota. camara_estado es de lectura pública: no son datos
          # de nadie, es el estado de unas webcams.
          SUPABASE_ANON_KEY=$(grep -oE "eyJ[A-Za-z0-9_.-]{40,}" scripts/camaras/comprobar-camaras.mjs | head -1)
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::No se pudo leer la anon key de scripts/camaras/comprobar-camaras.mjs — ¿ha cambiado de formato?"
            exit 1
          fi
          curl -sS -G "$SUPABASE_URL/rest/v1/camara_estado" \
            --data-urlencode "select=spot_slug,motivo,fallos_seguidos,ultima_senal_en,fuente_usada" \
            --data-urlencode "sin_senal=is.true" \
            --data-urlencode "order=fallos_seguidos.desc" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /tmp/rojas.json

          CUANTAS=$(node -e '
            const fs = require("fs");
            let f = [];
            try { f = JSON.parse(fs.readFileSync("/tmp/rojas.json", "utf8")); } catch (e) {}
            if (!Array.isArray(f)) f = [];
            console.log(f.length);
          ')
          echo "cuantas=$CUANTAS" >> "$GITHUB_OUTPUT"

          if [ "$CUANTAS" = "0" ]; then
            echo "Ninguna cámara en rojo. No hay nada que reparar."
            echo "### Ninguna cámara en rojo" >> "$GITHUB_STEP_SUMMARY"
            echo "No se ha arrancado ninguna sesión de Claude: no había nada que reparar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          LISTA=$(node -e '
            const fs = require("fs");
            const f = JSON.parse(fs.readFileSync("/tmp/rojas.json", "utf8"));
            console.log(f.map((c) =>
              `${c.spot_slug} (motivo: ${c.motivo}, ${c.fallos_seguidos} fallos seguidos, última señal: ${c.ultima_senal_en || "nunca registrada"})`
            ).join("; "));
          ')
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"
          echo "Cámaras en rojo ($CUANTAS): $LISTA"

      - name: Instalar Claude Code CLI
        if: steps.rojas.outputs.cuantas != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configurar git
        if: steps.rojas.outputs.cuantas != '0'
        run: |
          git config user.name "Claude (robot Costaviva)"
          git config user.email "noreply@anthropic.com"

      - name: Investigar y tratar de levantarlas
        if: steps.rojas.outputs.cuantas != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ROJAS: ${{ steps.rojas.outputs.lista }}
        run: |
          SALIDA_CLAUDE=/tmp/claude-salida.log
          rm -f /tmp/robot-informe.txt
          claude -p "Eres el robot de reparación de cámaras de Costaviva (repo Costaviva). A diferencia del robot buscador de fuentes, tú NO buscas cámaras nuevas ni revisas las que funcionan: tu único trabajo es coger las que están marcadas en rojo y tratar de levantarlas. Lee ROBOT_REGLAS.md, sección 'Cámara caída: primero descarta que se haya MOVIDO', y síguela al pie de la letra — ahí está el método completo, incluido cómo resolver un alias de IPCamLive y en qué ficheros vive cada URL. Si existe un fichero ROBOT_PAUSADO en la raíz del repo, no escribas nada y para ahí. CÁMARAS EN ROJO AHORA MISMO: \$ROJAS. Reglas de esta pasada, por orden: (1) Agrupa primero por proveedor mirando la URL de cada una en WEBCAMS/WEBCAMS_HLS, no por el nombre del spot: si varias del MISMO proveedor cayeron a la vez, es casi seguro una caída suya y NO hay que investigarlas una a una — anótalo y pasa a las demás. (2) Para cada cámara que quede, la PRIMERA hipótesis es que el stream se ha movido, no que esté rota: busca la web pública del dueño (ayuntamiento, escuela de surf, club náutico, puerto) y mira qué URL embebe HOY. (3) Verifica siempre cualquier URL candidata con una petición real, comprueba que la imagen o el manifiesto son de AHORA (Last-Modified reciente, o la secuencia del HLS avanzando entre dos lecturas separadas), y MIRA la imagen con Read para confirmar que se ve mar y que es el sitio correcto — nunca des por buena una URL solo porque responda 200. (4) Si encuentras la URL nueva, aplícala en TODOS los sitios donde viva la vieja (búscala con Grep por el identificador del stream, no solo por el slug) y haz commit y push a main tú mismo. Cambiar una URL que se movió es una corrección trivial y está permitido aplicarla directa, aunque toque functions/. (5) Si no encuentras sustituta, NO inventes ninguna: déjalo escrito en ROBOT.md con lo que comprobaste y por qué lo descartas, para que la próxima pasada no repita el mismo trabajo. Añade siempre una entrada nueva fechada a ROBOT.md (fecha y hora UTC) diciendo qué cámaras miraste, qué encontraste y qué arreglaste, incluso si no arreglaste nada. Al terminar escribe 2-4 frases en español, sin jerga, en /tmp/robot-informe.txt." \
            --dangerously-skip-permissions \
            --model claude-sonnet-5 \
            --max-turns 60 \
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob,WebSearch,WebFetch" > "$SALIDA_CLAUDE" 2>&1 || CODIGO=$?
          # Mismo guardarraíl de saldo que el resto de robots del repo (ver
          # CLAUDE.md, "Sin saldo de API, nada se rompe"): un problema de
          # facturación no es un fallo del repo.
          CODIGO=${CODIGO:-0}
          cat "$SALIDA_CLAUDE" || true
          if [ "$CODIGO" -ne 0 ] && grep -qiE "credit balance is too low|purchase credits" "$SALIDA_CLAUDE"; then
            echo "::warning::Sin saldo en ANTHROPIC_API_KEY: esta pasada no se ha ejecutado. No es un fallo del repo — recargar saldo en Plans y Billing de Anthropic."
            {
              echo "### Pasada no ejecutada: sin saldo de API"
              echo "Las cámaras en rojo siguen sin revisar."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$CODIGO"
