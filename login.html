<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Acceso — Costa Viva</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#0B2532" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0B2532; color: #E8E2D0;
    font-family: 'Inter', sans-serif;
    padding: 24px;
  }
  .caja {
    width: 100%; max-width: 380px;
    background: #0F2C38; border: 1px solid #1C3F4F; border-radius: 14px;
    padding: 32px 28px;
  }
  .caja h1 {
    font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin: 0 0 4px;
  }
  .caja p.sub { color: #7FA3AF; font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 12px; color: #9FB8BF; margin: 14px 0 5px; font-family: 'IBM Plex Mono', monospace; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #1C3F4F; background: #123B4D; color: #E8E2D0;
    font-family: 'Inter', sans-serif; font-size: 14px;
  }
  input:focus { outline: none; border-color: #D4A24C; }
  button {
    width: 100%; margin-top: 20px; padding: 11px; border-radius: 8px; border: none;
    background: #D4A24C; color: #0B2532; font-weight: 600; font-size: 14px;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secundario { background: transparent; border: 1px solid #1C3F4F; color: #9FB8BF; margin-top: 8px; }
  .mensaje { margin-top: 14px; font-size: 12.5px; padding: 10px 12px; border-radius: 8px; display: none; }
  .mensaje.error { display: block; background: rgba(163,74,53,0.15); color: #E8907A; border: 1px solid #A34A35; }
  .mensaje.info { display: block; background: rgba(212,162,76,0.12); color: #E8C888; border: 1px solid #6B5530; }
  .mensaje.ok { display: block; background: rgba(79,157,105,0.12); color: #8FCBA3; border: 1px solid #3A6B4C; }
  .toggle { text-align: center; margin-top: 18px; font-size: 12.5px; color: #7FA3AF; }
  .toggle a { color: #D4A24C; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="caja">
  <h1>Costa Viva</h1>
  <p class="sub" id="subtitulo">Accede con tu cuenta para ver la zona Lekeitio → Bilbao</p>

  <div id="mensaje" class="mensaje"></div>

  <form id="formLogin">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required autocomplete="email" />
    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password" />
    <button type="submit" id="btnPrincipal">Entrar</button>
    <button type="button" class="secundario" id="btnAlternar">Crear una cuenta nueva</button>
  </form>

  <div class="toggle">¿Olvidaste tu contraseña? <a id="linkRecuperar">Recupérala aquí</a></div>
</div>

<script type="module">
// ---------------------------------------------------------------------------
// Acceso vía Supabase Auth, mismo patrón que Etxeapala (Cloudflare Pages +
// Supabase + JS vanilla, con aprobación manual de nuevas cuentas antes de
// dar acceso — sistema Root/Superadmin/Member).
//
// PENDIENTE ANTES DE DESPLEGAR: sustituir estos dos valores por los de tu
// propio proyecto de Supabase (Project Settings > API). El "anon key" es
// público por diseño (va en el cliente), la seguridad real la da Row Level
// Security en las tablas de Supabase, no ocultar esta clave.
// ---------------------------------------------------------------------------
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://TU-PROYECTO.supabase.co"; // <-- cambiar
const SUPABASE_ANON_KEY = "TU-ANON-KEY-AQUI"; // <-- cambiar

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let modo = "login"; // "login" | "registro"

const form = document.getElementById("formLogin");
const btnPrincipal = document.getElementById("btnPrincipal");
const btnAlternar = document.getElementById("btnAlternar");
const mensajeEl = document.getElementById("mensaje");
const subtitulo = document.getElementById("subtitulo");

function mostrarMensaje(texto, tipo) {
  mensajeEl.textContent = texto;
  mensajeEl.className = `mensaje ${tipo}`;
}

btnAlternar.addEventListener("click", () => {
  modo = modo === "login" ? "registro" : "login";
  btnPrincipal.textContent = modo === "login" ? "Entrar" : "Crear cuenta";
  btnAlternar.textContent = modo === "login" ? "Crear una cuenta nueva" : "Ya tengo cuenta";
  subtitulo.textContent =
    modo === "login"
      ? "Accede con tu cuenta para ver la zona Lekeitio → Bilbao"
      : "Tu cuenta necesitará aprobación antes de poder entrar";
  mensajeEl.className = "mensaje";
});

document.getElementById("linkRecuperar").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  if (!email) { mostrarMensaje("Escribe primero tu correo electrónico.", "error"); return; }
  const { error } = await supabase.auth.resetPasswordForEmail(email);
  if (error) mostrarMensaje(error.message, "error");
  else mostrarMensaje("Te hemos enviado un enlace para restablecer la contraseña.", "ok");
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  btnPrincipal.disabled = true;
  mensajeEl.className = "mensaje";

  if (modo === "registro") {
    const { error } = await supabase.auth.signUp({ email, password });
    if (error) {
      mostrarMensaje(error.message, "error");
    } else {
      // Igual que en Etxeapala: la cuenta se crea pero queda pendiente de
      // aprobación manual (Root/Superadmin) antes de tener acceso real —
      // eso se gestiona con una tabla "perfiles" con un campo "aprobado"
      // y Row Level Security que bloquea el resto de tablas hasta que sea true.
      mostrarMensaje("Cuenta creada. Un administrador debe aprobarla antes de que puedas entrar.", "info");
    }
  } else {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      mostrarMensaje(error.message, "error");
    } else {
      // Comprobar aprobación antes de dejar pasar (ajustar nombre de tabla/
      // campo a lo que definas realmente en Supabase)
      const { data: perfil } = await supabase
        .from("perfiles")
        .select("aprobado")
        .eq("id", data.user.id)
        .single();

      if (perfil && perfil.aprobado === false) {
        mostrarMensaje("Tu cuenta todavía no ha sido aprobada.", "info");
        await supabase.auth.signOut();
      } else {
        window.location.href = "/";
      }
    }
  }
  btnPrincipal.disabled = false;
});

// Si ya hay sesión activa, no mostrar el login
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = "/";
});
</script>

</body>
</html>
