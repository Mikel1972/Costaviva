<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Acceso — Costa Viva</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#F7F3E8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #F7F3E8; color: #0B2532;
    font-family: 'Inter', sans-serif;
    padding: 24px;
  }
  .caja {
    width: 100%; max-width: 380px;
    background: #FFFFFF; border: 1px solid #DDE2DC; border-radius: 14px;
    padding: 32px 28px;
  }
  .caja h1 {
    font-family: 'Fraunces', serif; font-size: 32px; font-weight: 700; letter-spacing: 0.2px; margin: 0 0 4px;
  }
  .caja p.sub { color: #5C7680; font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 12px; color: #5F7981; margin: 14px 0 5px; font-family: 'Inter', sans-serif; font-weight: 500; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #DDE2DC; background: #EEF2EF; color: #0B2532;
    font-family: 'Inter', sans-serif; font-size: 14px;
  }
  input:focus { outline: none; border-color: #A8792A; }
  button {
    width: 100%; margin-top: 20px; padding: 11px; border-radius: 8px; border: none;
    background: #D4A24C; color: #0B2532; font-weight: 600; font-size: 14px;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secundario { background: transparent; border: 1px solid #DDE2DC; color: #42585F; margin-top: 8px; }
  .mensaje { margin-top: 14px; font-size: 12.5px; padding: 10px 12px; border-radius: 8px; display: none; }
  .mensaje.error { display: block; background: rgba(163,74,53,0.15); color: #A34A35; border: 1px solid #A34A35; }
  .mensaje.info { display: block; background: rgba(212,162,76,0.12); color: #6B5530; border: 1px solid #D9C08A; }
  .mensaje.ok { display: block; background: rgba(79,157,105,0.12); color: #3A6B4C; border: 1px solid #A8D4B8; }
  .toggle { text-align: center; margin-top: 18px; font-size: 12.5px; color: #5C7680; }
  .toggle a { color: #A8792A; cursor: pointer; text-decoration: underline; }
  .consentimiento { display: none; margin-top: 16px; }
  .consentimiento.visible { display: block; }
  .consentimiento label.checkbox {
    display: flex; align-items: flex-start; gap: 8px; margin: 10px 0 0;
    font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; color: #5F7981; cursor: pointer;
  }
  .consentimiento input[type="checkbox"] { width: auto; margin-top: 2px; accent-color: #A8792A; flex-shrink: 0; }
</style>
</head>
<body>

<div class="caja" id="cajaLogin">
  <h1>Costa Viva</h1>
  <p class="sub" id="subtitulo">Accede con tu cuenta para ver la zona Lekeitio → Bilbao</p>

  <div id="mensaje" class="mensaje"></div>

  <form id="formLogin">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required autocomplete="email" />
    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <div class="consentimiento" id="cajaConsentimiento">
      <label class="checkbox">
        <input type="checkbox" id="checkTerminos" />
        Acepto los términos de uso y la política de privacidad de Costa Viva, incluyendo el tratamiento de mis datos de cuenta para dar el servicio (obligatorio para crear la cuenta).
      </label>
      <label class="checkbox">
        <input type="checkbox" id="checkDatosCapturas" />
        Autorizo el uso anónimo de mis capturas registradas en el diario para mejorar el índice de pesca de Costa Viva (opcional — puedes usar la app igualmente si no lo marcas).
      </label>
    </div>

    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEywlSn_bxleOonO" style="margin-top:14px;"></div>

    <button type="submit" id="btnPrincipal">Entrar</button>
    <button type="button" class="secundario" id="btnAlternar">Crear una cuenta nueva</button>
  </form>

  <div class="toggle">¿Olvidaste tu contraseña? <a id="linkRecuperar">Recupérala aquí</a></div>
</div>

<!-- Pantalla de "nueva contraseña" tras pulsar el enlace del email de
     recuperación — bug real encontrado 2026-09-13: el enlace SÍ
     autentica (así funciona Supabase), pero sin esta pantalla el login
     mandaba directo al mapa sin dejar nunca cambiar la contraseña. -->
<div class="caja" id="cajaNuevaContrasena" style="display:none;">
  <h1>Nueva contraseña</h1>
  <p class="sub">Escribe tu nueva contraseña para tu cuenta.</p>
  <div id="mensajeNueva" class="mensaje"></div>
  <form id="formNuevaContrasena">
    <label for="passwordNueva">Contraseña nueva</label>
    <input type="password" id="passwordNueva" required autocomplete="new-password" minlength="6" />
    <label for="passwordNuevaRepetir">Repite la contraseña</label>
    <input type="password" id="passwordNuevaRepetir" required autocomplete="new-password" minlength="6" />
    <button type="submit" id="btnGuardarNuevaContrasena">Guardar y entrar</button>
  </form>
</div>

<script type="module">
// ---------------------------------------------------------------------------
// Acceso vía Supabase Auth, mismo patrón que Etxeapala (Cloudflare Pages +
// Supabase + JS vanilla, con aprobación manual de nuevas cuentas antes de
// dar acceso — sistema Root/Superadmin/Member).
//
// PENDIENTE ANTES DE DESPLEGAR: sustituir estos dos valores por los de tu
// propio proyecto de Supabase (Project Settings > API). El "anon key" es
// público por diseño (va en el cliente), la seguridad real la da Row Level
// Security en las tablas de Supabase, no ocultar esta clave.
// ---------------------------------------------------------------------------
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://imncbmizxkorotpeisic.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltbmNibWl6eGtvcm90cGVpc2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MzczMTQsImV4cCI6MjEwNDUxMzMxNH0.QYvtoHQyFRo1SploGPCUyWZqeHNwy6Qdd6IsAbmvHnc";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let modo = "login"; // "login" | "registro"

const form = document.getElementById("formLogin");
const btnPrincipal = document.getElementById("btnPrincipal");
const btnAlternar = document.getElementById("btnAlternar");
const mensajeEl = document.getElementById("mensaje");
const subtitulo = document.getElementById("subtitulo");
const cajaConsentimiento = document.getElementById("cajaConsentimiento");
const checkTerminos = document.getElementById("checkTerminos");
const checkDatosCapturas = document.getElementById("checkDatosCapturas");

function mostrarMensaje(texto, tipo) {
  mensajeEl.textContent = texto;
  mensajeEl.className = `mensaje ${tipo}`;
}

// CAPTCHA (Cloudflare Turnstile, 2026-09-13, pedido explícito del
// usuario: "como en Pólizas.ai") — widget declarativo (el script lo
// renderiza solo al cargar), así que solo hace falta leer el token que
// deja en un input oculto y pedirle a Turnstile un token nuevo después
// de cada intento (los tokens son de un solo uso). Supabase exige este
// token en signUp/signInWithPassword/resetPasswordForEmail en cuanto
// "Enable Captcha protection" está activado en su panel — sin él,
// rechaza la petición.
function leerTokenTurnstile() {
  const input = document.querySelector('input[name="cf-turnstile-response"]');
  return input ? input.value : "";
}
function reiniciarTurnstile() {
  if (window.turnstile) window.turnstile.reset();
}

btnAlternar.addEventListener("click", () => {
  modo = modo === "login" ? "registro" : "login";
  btnPrincipal.textContent = modo === "login" ? "Entrar" : "Crear cuenta";
  btnAlternar.textContent = modo === "login" ? "Crear una cuenta nueva" : "Ya tengo cuenta";
  subtitulo.textContent =
    modo === "login"
      ? "Accede con tu cuenta para ver la zona Lekeitio → Bilbao"
      : "Tu cuenta necesitará aprobación antes de poder entrar";
  cajaConsentimiento.classList.toggle("visible", modo === "registro");
  mensajeEl.className = "mensaje";
});

document.getElementById("linkRecuperar").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  if (!email) { mostrarMensaje("Escribe primero tu correo electrónico.", "error"); return; }
  const captchaToken = leerTokenTurnstile();
  if (!captchaToken) { mostrarMensaje("Completa la verificación de seguridad de más abajo antes de continuar.", "error"); return; }
  const { error } = await supabase.auth.resetPasswordForEmail(email, { captchaToken });
  reiniciarTurnstile();
  if (error) mostrarMensaje(error.message, "error");
  else mostrarMensaje("Te hemos enviado un enlace para restablecer la contraseña.", "ok");
});

// ---------------------------------------------------------------------------
// Recuperación de contraseña: el enlace del email autentica de verdad
// (Supabase lo hace así a propósito, para poder llamar a updateUser()
// mientras se resuelve el enlace) — sin esta pantalla, el login mandaba
// directo al mapa sin dejar nunca cambiar la contraseña.
//
// La detección va por onAuthStateChange (evento "PASSWORD_RECOVERY"),
// NO por mirar a mano el hash/query de la URL — supabase-js tiene dos
// formatos de enlace distintos según la versión (uno mete los datos en
// el hash de la URL, otro en un parámetro "?code=" que hay que
// intercambiar de forma asíncrona) y solo el evento del propio SDK
// funciona igual pase lo que pase con eso. Se muestra la pantalla de
// contraseña nueva en cuanto llega ese evento; para la sesión normal
// (visita con sesión ya guardada) se espera al primer evento
// "INITIAL_SESSION" en vez de a una llamada aparte a getSession(),
// para no arriesgarse a redirigir antes de que el SDK termine de
// resolver un enlace de recuperación en curso.
// ---------------------------------------------------------------------------
let flujoDecidido = false;

function mostrarPantallaNuevaContrasena() {
  document.getElementById("cajaLogin").style.display = "none";
  document.getElementById("cajaNuevaContrasena").style.display = "block";
}

const mensajeNuevaEl = document.getElementById("mensajeNueva");
const formNueva = document.getElementById("formNuevaContrasena");
const btnGuardarNueva = document.getElementById("btnGuardarNuevaContrasena");

formNueva.addEventListener("submit", async (e) => {
  e.preventDefault();
  const nueva = document.getElementById("passwordNueva").value;
  const repetir = document.getElementById("passwordNuevaRepetir").value;
  mensajeNuevaEl.className = "mensaje";

  if (nueva !== repetir) {
    mensajeNuevaEl.textContent = "Las dos contraseñas no coinciden.";
    mensajeNuevaEl.className = "mensaje error";
    return;
  }

  btnGuardarNueva.disabled = true;
  const { error } = await supabase.auth.updateUser({ password: nueva });
  btnGuardarNueva.disabled = false;

  if (error) {
    mensajeNuevaEl.textContent = error.message;
    mensajeNuevaEl.className = "mensaje error";
    return;
  }
  window.location.href = "/";
});

supabase.auth.onAuthStateChange((evento, sesion) => {
  if (evento === "PASSWORD_RECOVERY") {
    flujoDecidido = true;
    mostrarPantallaNuevaContrasena();
  } else if (evento === "INITIAL_SESSION" && !flujoDecidido) {
    flujoDecidido = true;
    if (sesion) window.location.href = "/";
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  btnPrincipal.disabled = true;
  mensajeEl.className = "mensaje";

  const captchaToken = leerTokenTurnstile();
  if (!captchaToken) {
    mostrarMensaje("Completa la verificación de seguridad de más abajo antes de continuar.", "error");
    btnPrincipal.disabled = false;
    return;
  }

  if (modo === "registro") {
    if (!checkTerminos.checked) {
      mostrarMensaje("Tienes que aceptar los términos de uso para crear la cuenta.", "error");
      btnPrincipal.disabled = false;
      return;
    }
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { consiente_uso_datos_capturas: checkDatosCapturas.checked }, captchaToken },
    });
    reiniciarTurnstile();
    if (error) {
      mostrarMensaje(error.message, "error");
    } else {
      // Igual que en Etxeapala: la cuenta se crea pero queda pendiente de
      // aprobación manual (Root/Superadmin) antes de tener acceso real —
      // eso se gestiona con una tabla "perfiles" con un campo "aprobado"
      // y Row Level Security que bloquea el resto de tablas hasta que sea true.
      mostrarMensaje("Cuenta creada. Un administrador debe aprobarla antes de que puedas entrar.", "info");
      // Aviso al admin, sin bloquear ni depender de él para nada del
      // flujo de alta — si falla (todavía no configurado, red, lo que
      // sea), el usuario no debe notarlo ni verse afectado.
      if (data?.user?.id) {
        fetch("/aviso-alta", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: data.user.id }),
        }).catch(() => {});
      }
    }
  } else {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password, options: { captchaToken } });
    reiniciarTurnstile();
    if (error) {
      mostrarMensaje(error.message, "error");
    } else {
      // Comprobar aprobación antes de dejar pasar (ajustar nombre de tabla/
      // campo a lo que definas realmente en Supabase)
      const { data: perfil } = await supabase
        .from("perfiles")
        .select("aprobado")
        .eq("id", data.user.id)
        .single();

      if (perfil && perfil.aprobado === false) {
        mostrarMensaje("Tu cuenta no tiene acceso activo ahora mismo.", "info");
        await supabase.auth.signOut();
      } else {
        window.location.href = "/";
      }
    }
  }
  btnPrincipal.disabled = false;
});
</script>

</body>
</html>
